<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數位教學資源索引</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
        }

        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: var(--primary-color); margin-bottom: 40px; }

        /* 網格佈局 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        /* 卡片樣式 */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            border: 1px solid #e2e8f0;
        }

        .card:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }

        /* 縮圖區域 */
        .thumbnail {
            width: 100%;
            height: 180px;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background-size: cover;
            background-position: center;
        }

        .thumbnail::after {
            content: "";
            font-size: 50px;
            opacity: 0.3;
        }

        /* 資訊區域 */
        .content { padding: 20px; text-align: center; flex-grow: 1; }
        .content h3 { margin: 0 0 15px 0; font-size: 1.25rem; word-break: break-all; }

        .qr-container {
            display: flex;
            justify-content: center;
            padding: 15px;
            background: #f1f5f9;
        }

        .btn-link {
            display: block;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-link:hover { background: #1d4ed8; }

        /* 載入中動畫 */
        #loader { text-align: center; font-size: 1.2rem; padding: 50px; }
    </style>
</head>
<body>

<div class="container">
    <h1>網頁導覽</h1>
    <div id="loader">正在讀取檔案清單...</div>
    <div class="grid" id="main-grid"></div>
</div>

<script>
    // === 設定區 ===
    const CONFIG = {
        username: 'mangundam', // 例如: 'myname'
        repo: 'Jolin',     // 例如: 'it-course'
        folder: ''        // HTML 存放的資料夾名稱 (若在根目錄則設為 '')
    };

    const grid = document.getElementById('main-grid');
    const loader = document.getElementById('loader');

    async function init() {
        try {
            // 1. 呼叫 GitHub API 取得檔案清單
            const apiUrl = `https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.folder}`;
            const response = await fetch(apiUrl);
            const files = await response.json();

            if (!Array.isArray(files)) throw new Error('無法讀取資料，請檢查設定');

            loader.style.display = 'none';

            // 2. 過濾出 HTML 檔案
            const htmlFiles = files.filter(f => f.name.endsWith('.html') && f.name !== 'index.html');

            htmlFiles.forEach((file, index) => {
                createCard(file, index);
            });

        } catch (error) {
            loader.innerHTML = `讀取失敗: ${error.message}<br>請確認 Repo 是否為公開(Public)。`;
        }
    }

    function createCard(file, index) {
        // 去除副檔名作為標題
        const title = file.name.replace('.html', '');
		const baseUrl = `https://${CONFIG.username}.github.io/${CONFIG.repo}/`;
		
		// 使用 encodeURI 處理中文檔名，確保網址在 QR Code 和縮圖服務中都能運作
		const fileNameEncoded = encodeURI(file.name);
		const fileUrl = baseUrl + (CONFIG.folder ? CONFIG.folder + '/' : '') + fileNameEncoded;

		const cardId = `qr-${index}`;

        // 建立卡片元件
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="thumbnail" id="thumb-${index}"></div>
            <div class="content">
                <h3>${title}</h3>
            </div>
            <div class="qr-container">
                <div id="${cardId}"></div>
            </div>
            <a href="${fileUrl}" class="btn-link">開啟網頁</a>
        `;
        grid.appendChild(card);

        // 生成 QR Code
        new QRCode(document.getElementById(cardId), {
            text: fileUrl,
            width: 120,
            height: 120,
            colorDark : "#1e293b",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.M
        });

        // 嘗試抓取網頁縮圖 (使用 WordPress mshots 免費服務)
        // 注意：這需要你的網站已經發佈且 GitHub Pages 已更新才看得到
        const thumbDiv = document.getElementById(`thumb-${index}`);
        const screenshotUrl = `https://s.wordpress.com/mshots/v1/${encodeURIComponent(fileUrl)}?w=400`;
        thumbDiv.style.backgroundImage = `url('${screenshotUrl}')`;
    }

    init();
</script>

</body>
</html>
