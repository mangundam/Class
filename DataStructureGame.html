<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資料結構生活場景</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pixel-bg: #070b14;
            --pixel-panel: #111827;
            --pixel-border: #38bdf8;
        }
        body {
            background-color: var(--pixel-bg);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(56, 189, 248, 0.12) 0%, transparent 60%),
                linear-gradient(rgba(17, 24, 39, 0.9) 1px, transparent 1px),
                linear-gradient(90deg, rgba(17, 24, 39, 0.9) 1px, transparent 1px);
            background-size: 100% 100%, 24px 24px, 24px 24px;
            font-family: 'Noto Sans TC', sans-serif;
            color: #f8fafc;
            user-select: none;
        }
        .font-pixel-en {
            font-family: 'Press Start 2P', monospace;
        }
        .pixel-box {
            background: #0f172a;
            border: 3px solid #38bdf8;
            box-shadow: 0 8px 0 #0284c7, 0 12px 24px rgba(0, 0, 0, 0.7);
        }
        .pixel-screen-frame {
            background: #020617;
            border: 4px solid #475569;
            box-shadow: inset 0 0 24px rgba(0,0,0,0.9), 0 4px 0 #1e293b;
            position: relative;
        }
        /* CRT 掃描線效果 */
        .crt-overlay {
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            display: block;
        }
        .pixel-btn {
            background: #1e293b;
            border: 3px solid #64748b;
            box-shadow: 0 5px 0 #0f172a;
            transition: transform 0.08s ease, box-shadow 0.08s ease, background-color 0.15s ease, border-color 0.15s ease;
        } 
        .pixel-btn:hover:not(:disabled) {
            background: #334155;
            border-color: #94a3b8;
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #0f172a;
        }
        .pixel-btn:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #0f172a;
        }
        /* 答對綠色發光樣式 */
        .btn-correct {
            background: #059669 !important;
            border-color: #34d399 !important;
            color: #ffffff !important;
            box-shadow: 0 5px 0 #065f46, 0 0 18px rgba(52, 211, 153, 0.65) !important;
            animation: pulse-green 1s infinite alternate;
        }
        /* 答錯紅色搖晃樣式 */
        .btn-wrong {
            background: #dc2626 !important;
            border-color: #f87171 !important;
            color: #ffffff !important;
            box-shadow: 0 5px 0 #7f1d1d, 0 0 18px rgba(248, 113, 113, 0.65) !important;
            animation: shake-red 0.4s ease-in-out;
        }
        @keyframes shake-red {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        @keyframes pulse-green {
            from { filter: brightness(1); }
            to { filter: brightness(1.15); }
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #38bdf8;
            border-radius: 2px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-2 sm:p-4">

    <!-- 主遊戲機台容器 (放大寬度至 max-w-4xl 讓整體畫面更大) -->
    <main class="max-w-4xl w-full mx-auto flex flex-col gap-3 sm:gap-4">
        
        <!-- 遊戲測驗畫面 -->
        <div id="quizView" class="pixel-box rounded-xl p-4 sm:p-6 flex flex-col gap-3.5 sm:gap-4">
            
            <!-- 1. 放大後的點陣圖 Canvas 舞台區 (使用 max-w-3xl 讓舞台畫面更清晰寬敞) -->
            <div class="pixel-screen-frame rounded-lg overflow-hidden w-full max-w-3xl mx-auto">
                <!-- 內部解析度 320x180 放大顯示，確保濃厚復古點陣顆粒感 -->
                <canvas id="pixelCanvas" width="320" height="180"></canvas>
                <div class="crt-overlay absolute inset-0"></div>
                
                <!-- 畫面左上角題號與場景名稱標記 -->
                <div class="absolute top-2.5 left-2.5 bg-slate-950/85 border border-sky-500/60 px-3 py-1 rounded text-xs sm:text-sm text-sky-300 flex items-center gap-2 pointer-events-none shadow-lg">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span id="sceneNumberBadge" class="font-pixel-en text-amber-400 text-xs sm:text-sm">Q01/18</span>
                    <span id="sceneTitle" class="font-bold text-white tracking-wide text-sm sm:text-base">載入中...</span>
                </div>

                <!-- 畫面右上角原始題號標記 -->
                <div class="absolute top-2.5 right-2.5 bg-slate-950/85 border border-slate-600 px-2.5 py-1 rounded text-xs text-slate-300 font-pixel-en pointer-events-none">
                    <span id="sceneCodeBadge">#01</span>
                </div>
            </div>

            <!-- 2. 舞台正下方：放大文字與適當高度的情境描述對話框 (防止過度推擠並提升閱讀清晰度) -->
            <div id="feedbackBox" class="bg-slate-950/95 border-2 border-slate-700 rounded-lg p-3.5 sm:p-4.5 h-[146px] sm:h-[156px] overflow-y-auto flex flex-col justify-between transition-colors shadow-inner">
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <div id="feedbackHeader" class="text-xs sm:text-sm font-bold text-amber-300 flex items-center gap-1.5">
                        <span>💬</span> <span>現場情境與題目</span>
                    </div>
                    <span id="feedbackConceptBadge" class="hidden text-xs sm:text-sm px-2.5 py-0.5 rounded bg-sky-950 text-sky-300 border border-sky-700 font-bold"></span>
                </div>
                <p id="feedbackDesc" class="text-base sm:text-lg text-white font-bold leading-relaxed my-auto pt-1">
                    載入中...
                </p>
            </div>

            <!-- 3. 資料結構選項按鈕區 (字體與空間配合放大) -->
            <div>
                <div id="optionsContainer" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2.5 sm:gap-3">
                    <!-- 由 JS 動態生成按鈕 -->
                </div>
            </div>

            <!-- 4. 最下方：一長條形「下一關」大按鈕 -->
            <button id="nextStageBarBtn" onclick="nextScene()" class="pixel-btn w-full py-3.5 sm:py-4 rounded-lg text-base sm:text-lg font-bold tracking-widest flex items-center justify-center gap-2 bg-sky-900/80 border-sky-400 text-sky-100 hover:bg-sky-800 transition shadow-lg">
                <span id="nextStageBtnText">下一題 (NEXT STAGE)</span>
                <span>➔</span>
            </button>

        </div>

        <!-- 測驗結束：輸入學號與姓名畫面 -->
        <div id="studentFormView" class="hidden pixel-box rounded-xl p-6 sm:p-10 flex-col items-center gap-6 text-center max-w-2xl mx-auto w-full">
            <h2 class="text-2xl sm:text-3xl font-black text-amber-300 tracking-wide">18 題挑戰完成！</h2>
            <p class="text-slate-300 text-base sm:text-lg max-w-md">
                請輸入您的學號與姓名。
            </p>
            <div class="w-full max-w-md flex flex-col gap-4 text-left mt-1">
                <div>
                    <label class="block text-sm font-bold text-sky-300 mb-1.5">學號 (Student ID)</label>
                    <input id="studentIdInput" type="text" placeholder="請輸入學號，例如：112001" class="w-full px-4 py-3 rounded-lg bg-slate-950 border-2 border-slate-600 text-white font-bold focus:outline-none focus:border-sky-400 text-base">
                </div>
                <div>
                    <label class="block text-sm font-bold text-sky-300 mb-1.5">姓名 (Student Name)</label>
                    <input id="studentNameInput" type="text" placeholder="請輸入您的姓名" class="w-full px-4 py-3 rounded-lg bg-slate-950 border-2 border-slate-600 text-white font-bold focus:outline-none focus:border-sky-400 text-base">
                </div>
                <p id="formErrorMsg" class="hidden text-rose-400 text-sm font-bold text-center">請完整填寫學號與姓名後再送出喔！</p>
                <button onclick="generateScoreImage()" class="pixel-btn w-full py-3.5 rounded-lg text-lg font-bold bg-emerald-600 border-emerald-300 text-white hover:bg-emerald-500 mt-1">
                    送出並產生成績圖檔
                </button>
            </div>
        </div>

        <!-- 測驗結果：顯示得分圖檔與下載畫面 -->
        <div id="resultCardView" class="hidden pixel-box rounded-xl p-5 sm:p-8 flex-col items-center gap-5 text-center max-w-2xl mx-auto w-full">
            <h2 class="text-xl sm:text-2xl font-black text-sky-300 tracking-wide">成績證明</h2>
            <div class="w-full rounded-lg overflow-hidden border-2 border-sky-400 shadow-2xl bg-slate-950">
                <img id="scoreResultImg" alt="學生成績單圖檔" class="w-full h-auto block" />
                <canvas id="scoreCardCanvas" width="720" height="540" class="hidden"></canvas>
            </div>
            <div class="w-full flex flex-col sm:flex-row gap-3 mt-1">
                <button onclick="downloadScoreImage()" class="pixel-btn flex-1 py-3.5 rounded-lg text-base sm:text-lg font-bold bg-amber-400 border-amber-200 text-slate-950 hover:bg-amber-300 flex items-center justify-center gap-2">
                    <span>下載成績圖片</span>
                </button>
                <button onclick="startNewQuiz()" class="pixel-btn sm:w-48 py-3.5 rounded-lg text-base font-bold bg-slate-800 border-slate-500 text-slate-200 hover:bg-slate-700">
                    重新抽 18 題
                </button>
            </div>
        </div>

    </main>

    <script>
        /**************************************************************
         * 1. 六大資料結構定義與說明
         **************************************************************/
        const CATEGORIES = [
            { id: 'array', name: '陣列', en: 'Array', icon: '📏', shortDesc: '一維線性排列，用單一索引定位' },
            { id: 'array2d', name: '二維陣列', en: '2D Array', icon: '🎛️', shortDesc: '行列網格結構，用 (Row, Col) 雙座標定位' },
            { id: 'queue', name: '佇列', en: 'Queue', icon: '🚶‍♂️', shortDesc: '先進先出 (FIFO)，先排隊的人先處理' },
            { id: 'stack', name: '堆疊', en: 'Stack', icon: '🥞', shortDesc: '後進先出 (LIFO)，最後放進去的先拿出來' },
            { id: 'tree', name: '樹', en: 'Tree', icon: '🌳', shortDesc: '階層與分支關係，從根節點向下延伸' },
            { id: 'graph', name: '圖', en: 'Graph', icon: '🕸️', shortDesc: '節點與邊交織的複雜網狀連結' }
        ];

        /**************************************************************
         * 2. 60個不重複的生活場景資料庫
         **************************************************************/
        const SCENES = [
            // === 1~10 陣列 (Array) ===
            { id: 1, type: 'array', title: '一週藥盒', quote: '「今天是星期三，直接打開標示『WED (索引2)』的那一格吃藥！」', explain: '一排7格的藥盒依序排列，直接用星期幾當作「索引 (Index)」就能找到對應位置的藥丸。' },
            { id: 2, type: 'array', title: '糖葫蘆串', quote: '「竹籤上串著一排山楂，從竹籤頭算起第 3 顆最大顆！」', explain: '相同類型的山楂在竹籤上一字排開，以線性順序編號存取。' },
            { id: 3, type: 'array', title: '火車車廂', quote: '「我的車票寫著『第 4 車廂』，沿著月台找到編號 04 的車廂上車！」', explain: '火車車廂一節接一節排成一列，每節車廂都有唯一且連續的編號。' },
            { id: 4, type: 'array', title: '尺上的刻度', quote: '「鉛筆的長度剛好對齊直尺上刻度『7 公分』的位置！」', explain: '尺上的刻度呈一維線性等距排列，每個刻度就像陣列中固定的記憶體位置。' },
            { id: 5, type: 'array', title: '書架上的一排書', quote: '「我要拿書架上從左邊算來的第 3 本書！」', explain: '單層書架上的書本由左至右整齊排列，可直接指定「第幾個位置」來取書。' },
            { id: 6, type: 'array', title: '公車的單排座位', quote: '「靠窗那排單人座，請坐到第 2 個座位！」', explain: '單排座位依序編號，乘客可透過座位號碼直接入座。' },
            { id: 7, type: 'array', title: '地板等候腳印標示', quote: '「請站在地面上標示『第 2 格』的黃色腳印位置等候！」', explain: '地板上畫好一排固定間距的格子，每個格子對應一個明確的索引編號。' },
            { id: 8, type: 'array', title: '溫度計的度數標示', quote: '「紅色水銀柱指在一維刻度表上的『25°C』位置！」', explain: '溫度計的刻度由低到高線性排列，透過單一數值位置表示狀態。' },
            { id: 9, type: 'array', title: '直尺型路邊停車格', quote: '「我的紅車停在路邊一字排開的『03 號』收費停車格裡！」', explain: '路邊車格沿著馬路排成單一直線，每格都有編號可供定位。' },
            { id: 10, type: 'array', title: '自動販賣機的單一軌道', quote: '「同一個軌道裡排著一列相同的綠茶罐，佔據連續的位置 [0]~[5]！」', explain: '單一軌道儲存相同型態的飲料並連續排列，是標準的一維陣列結構。' },

            // === 11~20 二維陣列 (2D Array) ===
            { id: 11, type: 'array2d', title: '電影院座位表', quote: '「我們的電影票在『C 排 4 號』，先找第 C 排、再數第 4 個位置！」', explain: '需要「第幾排 (Row)」與「第幾號 (Column)」兩個座標才能定位，是典型的二維陣列。' },
            { id: 12, type: 'array2d', title: '棋盤網格', quote: '「黑子下在棋盤座標 (3, 4) 的交叉網格點上！」', explain: '棋盤由橫線與直線交織成二維網格，每一步棋都用 (X, Y) 雙座標記錄。' },
            { id: 13, type: 'array2d', title: 'Excel 試算表', quote: '「請把成績輸入在『C 欄第 3 列 (C3)』的那個儲存格裡！」', explain: '試算表以欄(Column)與列(Row)構成二維表格，是二維陣列最直觀的代表。' },
            { id: 14, type: 'array2d', title: '教室的課桌椅排列', quote: '「老師點名：『請第 3 排、第 4 個座位的同學起來回答問題！』」', explain: '教室座位排成幾排幾列的矩陣，用「排」與「列」兩個數字鎖定學生位置。' },
            { id: 15, type: 'array2d', title: '捷運站的置物櫃牆', quote: '「我的背包鎖在置物櫃牆『第 2 層、左起第 3 格』！」', explain: '整面寄物櫃牆由水平層數與垂直格數組成一個二維矩陣。' },
            { id: 16, type: 'array2d', title: '賓果遊戲卡 (Bingo)', quote: '「抽中號碼了！把 5x5 賓果卡上『第 2 列、第 4 行』的格子圈起來！」', explain: '5x5 方格卡具備明確的列(Row)與行(Col)，屬於固定大小的二維陣列。' },
            { id: 17, type: 'array2d', title: '月曆 / 日曆表格', quote: '「這個月的『第 3 週、星期五』是校外教學的日子！」', explain: '月曆橫向是星期日到六、縱向是第1~5週，構成二維網格結構。' },
            { id: 18, type: 'array2d', title: '魔術方塊的單一面', quote: '「魔術方塊這一面的 3x3 九宮格中，右上角 [0][2] 是黃色色塊！」', explain: '單一面由 3 列 × 3 行的色塊組成，可用 matrix[row][col] 表示。' },
            { id: 19, type: 'array2d', title: '大型停車場的平面車位', quote: '「車子停在地下室『B 區、第 3 車道』的格子裡！」', explain: '將平面車位劃分為橫向分區與縱向車道編號，透過雙重索引快速找車。' },
            { id: 20, type: 'array2d', title: '九宮格戳戳樂', quote: '「我要戳正中間『第 2 排、第 2 個』的那一格試試手氣！」', explain: '童玩戳戳樂紙盒以整齊的橫列與直行隔間組成二維方陣。' },

            // === 21~30 佇列 (Queue) ===
            { id: 21, type: 'queue', title: '超市結帳人潮', quote: '「先排到收銀台前面的顧客先結帳離開，新來的客人請排到隊伍最後面！」', explain: '遵循「先進先出 (FIFO)」原則，最先排隊的人最先完成結帳。' },
            { id: 22, type: 'queue', title: '洗車機的車輛等待線', quote: '「第 1 台紅車最先開進洗車隧道，洗完也是第 1 台先開出來！」', explain: '洗車隧道單向通行，先進入的車輛必定先洗好離開 (First-In, First-Out)。' },
            { id: 23, type: 'queue', title: '銀行抽號碼牌', quote: '「叮咚！請 025 號到櫃檯辦理，後面抽 026、027 號的客人請依序等候！」', explain: '抽號碼牌系統將客人依到達先後順序排入等候佇列，依序叫號服務。' },
            { id: 24, type: 'queue', title: '得來速車道 (Drive-Thru)', quote: '「單線車道無法超車，先點餐的車子會先在窗口拿到漢堡開走！」', explain: '車道限制了車輛只能從尾端進入、前端離開，標準的先進先出佇列。' },
            { id: 25, type: 'queue', title: '遊樂園排隊動線', quote: '「排在最前面的遊客先搭上雲霄飛車出發，後面的遊客依序往前遞補！」', explain: '排隊欄杆確保遊客按照先來後到的順序搭乘設施。' },
            { id: 26, type: 'queue', title: '客服電話的等待接聽', quote: '「『您的電話正在排隊中...』系統會優先幫最先打進來的顧客接通專員！」', explain: '電話客服系統使用佇列管理來電，先撥入的電話先被處理。' },
            { id: 27, type: 'queue', title: '印表機的列印任務', quote: '「三個人同時按列印，印表機會照傳送先後順序：先印 Doc1、再印 Doc2！」', explain: '列印工作佇列 (Print Spooler) 會把先收到的文件排在前面優先印出。' },
            { id: 28, type: 'queue', title: '機場行李安檢 X 光機', quote: '「先放上輸送帶的紅色行李箱，會最先通過 X 光機從另一頭出來！」', explain: '輸送帶將行李由入口端依序推進、出口端依序送出，符合 FIFO 特性。' },
            { id: 29, type: 'queue', title: '手搖飲叫號螢幕', quote: '「店員依照點單順序搖飲料，先點餐的 101 號客人先拿走珍珠奶茶！」', explain: '訂單依成立時間進入製作佇列，先點單的人先取餐。' },
            { id: 30, type: 'queue', title: '高速公路匝道儀控', quote: '「匝道紅綠燈每次變綠燈，就讓排在最前面的第 1 台車先上高速公路！」', explain: '匝道車流依排隊先後順序一台接一台放行，屬於先進先出佇列。' },

        /**************************************************************
         * 3. 遊戲狀態與音效合成器 (Web Audio 8-bit 音效)
         **************************************************************/
        const TOTAL_QUIZ_COUNT = 18;
        // 答對題數 (0 ~ 18 題) 對應分數表 (70 ~ 100 分)
        const SCORE_LOOKUP_TABLE = [
            70, // 0 題
            72, // 1 題
            73, // 2 題
            75, // 3 題
            77, // 4 題
            78, // 5 題
            80, // 6 題
            82, // 7 題
            83, // 8 題
            85, // 9 題
            87, // 10 題
            88, // 11 題
            90, // 12 題
            92, // 13 題
            93, // 14 題
            95, // 15 題
            97, // 16 題
            98, // 17 題
            100 // 18 題
        ];

        let quizScenes = []; // 每次隨機抽取的 18 題 (保證每種資料結構至少出現 2 題)
        let currentQuizIndex = 0; // 0 ~ 17
        let currentSceneIndex = 0; // 對應 SCENES 的索引 (0 ~ 59)
        let soundEnabled = true;
        let currentOptions = [...CATEGORIES]; // 顯示完整選項
        let answeredHistory = {}; // { sceneId: { selected: 'array', isCorrect: true } }
        let animTick = 0; // 放慢後的動畫計時器
        let generatedDataUrl = '';
        let currentStudentName = '';

        let audioCtx = null;
        function play8BitSound(type) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'correct') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
                    osc.frequency.setValueAtTime(1046.50, now + 0.24); // C6
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
                    osc.start(now);
                    osc.stop(now + 0.42);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.setValueAtTime(150, now + 0.14);
                    gain.gain.setValueAtTime(0.14, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'switch') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, now);
                    gain.gain.setValueAtTime(0.06, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
                    osc.start(now);
                    osc.stop(now + 0.07);
                }
            } catch (e) {}
        }

        /**************************************************************
         * 4. 介面更新與作答邏輯 (隨機抽 18 題 + 成績結算圖檔)
         **************************************************************/
        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function startNewQuiz() {
            // 確保 6 種資料結構每一種至少出現 2 題 (共先保底 12 題)，剩下的 6 題再從剩餘的 48 題隨機抽出
            let guaranteed = [];
            let remainingPool = [];

            CATEGORIES.forEach(cat => {
                const catScenes = shuffleArray(SCENES.filter(s => s.type === cat.id));
                guaranteed.push(...catScenes.slice(0, 2)); // 每種至少抽 2 題
                remainingPool.push(...catScenes.slice(2));
            });

            const extraSix = shuffleArray(remainingPool).slice(0, TOTAL_QUIZ_COUNT - guaranteed.length);
            quizScenes = shuffleArray([...guaranteed, ...extraSix]);

            answeredHistory = {};
            currentQuizIndex = 0;

            document.getElementById('quizView').classList.remove('hidden');
            document.getElementById('quizView').classList.add('flex');
            document.getElementById('studentFormView').classList.add('hidden');
            document.getElementById('studentFormView').classList.remove('flex');
            document.getElementById('resultCardView').classList.add('hidden');
            document.getElementById('resultCardView').classList.remove('flex');

            loadScene(0);
        }

        function loadScene(quizIdx) {
            if (quizIdx < 0) quizIdx = 0;
            if (quizIdx >= quizScenes.length) {
                showStudentForm();
                return;
            }
            currentQuizIndex = quizIdx;
            const scene = quizScenes[currentQuizIndex];
            currentSceneIndex = SCENES.findIndex(s => s.id === scene.id);
            animTick = 0; // 切換關卡時從頭開始播放慢速動畫

            const qNumStr = String(currentQuizIndex + 1).padStart(2, '0');
            const codeStr = String(scene.id).padStart(2, '0');

            document.getElementById('sceneNumberBadge').textContent = `Q${qNumStr}/${TOTAL_QUIZ_COUNT}`;
            document.getElementById('sceneTitle').textContent = `${scene.title}`;
            document.getElementById('sceneCodeBadge').textContent = `題庫#${codeStr}`;

            renderOptionButtons();
            updateFeedbackPanel();
        }

        function renderOptionButtons() {
            const container = document.getElementById('optionsContainer');
            const scene = quizScenes[currentQuizIndex];
            const record = answeredHistory[scene.id];

            container.innerHTML = '';

            currentOptions.forEach((cat, idx) => {
                const btn = document.createElement('button');
                btn.className = 'pixel-btn rounded-lg p-3 sm:p-3.5 flex flex-col items-center justify-center gap-1 text-center relative group';

                // 如果這題已經作答過，套用紅綠標示並鎖定重複點擊
                if (record) {
                    btn.disabled = true;
                    if (cat.id === scene.type) {
                        btn.classList.add('btn-correct');
                    } else if (cat.id === record.selected && !record.isCorrect) {
                        btn.classList.add('btn-wrong');
                    } else {
                        btn.classList.add('opacity-50');
                    }
                }

                btn.onclick = () => submitAnswer(cat.id);

                // 右上角狀態圖示
                let statusBadge = `<span class="absolute top-1.5 left-2 font-pixel-en text-[10px] text-slate-400 group-hover:text-sky-300">[${idx + 1}]</span>`;
                if (record) {
                    if (cat.id === scene.type) {
                        statusBadge += `<span class="absolute top-1.5 right-2 text-xs sm:text-sm">✅</span>`;
                    } else if (cat.id === record.selected && !record.isCorrect) {
                        statusBadge += `<span class="absolute top-1.5 right-2 text-xs sm:text-sm">❌</span>`;
                    }
                }

                btn.innerHTML = `
                    ${statusBadge}
                    <div class="text-2xl sm:text-3xl mb-0.5 transform group-hover:scale-110 transition">${cat.icon}</div>
                    <div class="text-base sm:text-lg font-bold tracking-wide text-white">${cat.name}</div>
                    <div class="font-pixel-en text-[9px] sm:text-[10px] text-sky-300/90">${cat.en}</div>
                `;
                container.appendChild(btn);
            });
        }

        function submitAnswer(selectedTypeId) {
            const scene = quizScenes[currentQuizIndex];
            // 已作答過不重複計分
            if (answeredHistory[scene.id]) return;

            const isCorrect = (selectedTypeId === scene.type);

            answeredHistory[scene.id] = {
                selected: selectedTypeId,
                isCorrect: isCorrect
            };

            play8BitSound(isCorrect ? 'correct' : 'wrong');
            renderOptionButtons();
            updateFeedbackPanel();
        }

        function updateFeedbackPanel() {
            const scene = quizScenes[currentQuizIndex];
            const record = answeredHistory[scene.id];
            const box = document.getElementById('feedbackBox');
            const header = document.getElementById('feedbackHeader');
            const desc = document.getElementById('feedbackDesc');
            const badge = document.getElementById('feedbackConceptBadge');
            const nextBtn = document.getElementById('nextStageBarBtn');
            const nextBtnText = document.getElementById('nextStageBtnText');

            const isLastQuestion = (currentQuizIndex === TOTAL_QUIZ_COUNT - 1);
            nextBtnText.textContent = isLastQuestion ? '完成測驗，前往結算成績 (FINISH)' : `下一題 (${currentQuizIndex + 1}/${TOTAL_QUIZ_COUNT})`;

            const correctCat = CATEGORIES.find(c => c.id === scene.type);

            if (!record) {
                box.className = 'bg-slate-950/95 border-2 border-amber-400/80 rounded-lg p-3.5 sm:p-4.5 h-[146px] sm:h-[156px] overflow-y-auto flex flex-col justify-between shadow-inner';
                header.className = 'text-xs sm:text-sm font-bold text-amber-400 flex items-center gap-1.5';
                header.innerHTML = `<span>💬 現場情境描述（請觀察上方動畫並選擇對應的資料結構）：</span>`;
                desc.className = 'text-base sm:text-lg text-white font-bold my-auto pt-1 leading-relaxed';
                desc.textContent = scene.quote;
                badge.classList.add('hidden');
                nextBtn.disabled = true;
                nextBtn.className = 'pixel-btn w-full py-3.5 sm:py-4 rounded-lg text-base sm:text-lg font-bold tracking-widest flex items-center justify-center gap-2 bg-slate-800/70 border-slate-700 text-slate-500 cursor-not-allowed';
                nextBtnText.textContent = '請先選擇上方一個資料結構選項作答';
                return;
            }

            const selectedCat = CATEGORIES.find(c => c.id === record.selected);
            badge.classList.remove('hidden');
            badge.textContent = `${correctCat.icon} ${correctCat.name}：${correctCat.shortDesc}`;
            nextBtn.disabled = false;
            nextBtn.className = 'pixel-btn w-full py-3.5 sm:py-4 rounded-lg text-base sm:text-lg font-bold tracking-widest flex items-center justify-center gap-2 bg-amber-400 border-amber-200 text-slate-950 hover:bg-amber-300 transition shadow-lg';

            if (record.isCorrect) {
                box.className = 'bg-emerald-950/60 border-2 border-emerald-400 rounded-lg p-3.5 sm:p-4.5 h-[146px] sm:h-[156px] overflow-y-auto flex flex-col justify-between shadow-lg shadow-emerald-950/50';
                header.className = 'text-xs sm:text-sm font-bold text-emerald-300 flex items-center gap-1.5';
                header.innerHTML = `<span>✅ 答對了！這正是【${correctCat.name} (${correctCat.en})】！</span>`;
                desc.className = 'text-sm sm:text-base text-emerald-100 my-auto pt-1 leading-relaxed font-normal';
                desc.textContent = `${scene.quote} ➔ ${scene.explain}`;
            } else {
                box.className = 'bg-rose-950/60 border-2 border-rose-400 rounded-lg p-3.5 sm:p-4.5 h-[146px] sm:h-[156px] overflow-y-auto flex flex-col justify-between shadow-lg shadow-rose-950/50';
                header.className = 'text-xs sm:text-sm font-bold text-rose-300 flex items-center gap-1.5';
                header.innerHTML = `<span>❌ 猜錯囉！您選了「${selectedCat ? selectedCat.name : ''}」，正確答案是綠色的【${correctCat.name}】！</span>`;
                desc.className = 'text-sm sm:text-base text-rose-100 my-auto pt-1 leading-relaxed font-normal';
                desc.textContent = `${scene.quote} ➔ ${scene.explain}`;
            }

        function nextScene() {
            const scene = quizScenes[currentQuizIndex];

        function generateScoreImage() {
            const studentId = document.getElementById('studentIdInput').value.trim();
            const studentName = document.getElementById('studentNameInput').value.trim();
            const errEl = document.getElementById('formErrorMsg');

            if (!studentId || !studentName) {
                errEl.classList.remove('hidden');
                play8BitSound('wrong');
                return;
            }
            errEl.classList.add('hidden');
            currentStudentName = studentName;
            play8BitSound('correct');

            // 計算答對題數並查表取得對應分數 (0~18 題對應 70~100 分)
            let correctCount = 0;
            quizScenes.forEach(s => {
                if (answeredHistory[s.id] && answeredHistory[s.id].isCorrect) {
                    correctCount++;
                }
            });
            const finalScore = SCORE_LOOKUP_TABLE[correctCount] ?? 70;

            // 繪製專屬成績單 Canvas (720 x 540)
            const sCanvas = document.getElementById('scoreCardCanvas');
            const sCtx = sCanvas.getContext('2d');
            const W = sCanvas.width;
            const H = sCanvas.height;

            // 背景漸層與復古格線
            const grad = sCtx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#070b14');
            grad.addColorStop(1, '#111827');
            sCtx.fillStyle = grad;
            sCtx.fillRect(0, 0, W, H);

            sCtx.strokeStyle = 'rgba(56, 189, 248, 0.08)';
            sCtx.lineWidth = 1;
            for (let x = 0; x < W; x += 24) {
                sCtx.beginPath(); sCtx.moveTo(x, 0); sCtx.lineTo(x, H); sCtx.stroke();
            }
            for (let y = 0; y < H; y += 24) {
                sCtx.beginPath(); sCtx.moveTo(0, y); sCtx.lineTo(W, y); sCtx.stroke();
            }

            // 外框裝飾
            sCtx.strokeStyle = '#38bdf8';
            sCtx.lineWidth = 6;
            sCtx.strokeRect(16, 16, W - 32, H - 32);
            sCtx.strokeStyle = '#0284c7';
            sCtx.lineWidth = 2;
            sCtx.strokeRect(24, 24, W - 48, H - 48);

            // 學生學號與姓名區塊
            sCtx.fillStyle = '#1e293b';
            sCtx.fillRect(60, 100, W - 120, 74);
            sCtx.strokeStyle = '#64748b';
            sCtx.lineWidth = 2;
            sCtx.strokeRect(60, 100, W - 120, 74);

            sCtx.fillStyle = '#f8fafc';
            sCtx.font = 'bold 26px "Noto Sans TC", sans-serif';
            sCtx.textAlign = 'center';
            sCtx.fillText(`學號：${studentId}　｜　姓名：${studentName}`, W / 2, 146);

            // 分數大字展示區塊
            sCtx.fillStyle = '#94a3b8';
            sCtx.font = 'bold 18px "Noto Sans TC", sans-serif';
            sCtx.fillText(`答對題數：${correctCount} / ${TOTAL_QUIZ_COUNT} 題`, W / 2, 214);

            // 得分光暈與巨大數字
            sCtx.fillStyle = finalScore >= 90 ? '#4ade80' : finalScore >= 80 ? '#facc15' : '#38bdf8';
            sCtx.font = '900 96px "Noto Sans TC", monospace';
            sCtx.fillText(`${finalScore}`, W / 2 - 18, 315);

            sCtx.fillStyle = '#e2e8f0';
            sCtx.font = 'bold 30px "Noto Sans TC", sans-serif';
            sCtx.fillText('分', W / 2 + 88, 310);

            // 底部：抽到的 18 題代碼明細區 (標示題號代碼與答對/答錯顏色)
            sCtx.fillStyle = '#0f172a';
            sCtx.fillRect(50, 358, W - 100, 136);
            sCtx.strokeStyle = '#334155';
            sCtx.lineWidth = 2;
            sCtx.strokeRect(50, 358, W - 100, 136);

            const codeListStr = quizScenes.map(s => '#' + String(s.id).padStart(2, '0')).join(' ');
            sCtx.fillStyle = '#cbd5e1';
            sCtx.font = 'bold 12px "Noto Sans TC", monospace';
            sCtx.fillText(`本次隨機抽取 18 題代碼：${codeListStr}`, W / 2, 382);

            // 繪製 18 個小標籤 (2列: 上9題、下9題)，清楚呈現每題代碼與正誤
            quizScenes.forEach((s, idx) => {
                const isCorrect = answeredHistory[s.id]?.isCorrect;
                const row = idx < 9 ? 0 : 1;
                const col = idx < 9 ? idx : idx - 9;
                const totalInRow = 9;
                const boxW = 60;
                const boxH = 30;
                const gap = 7;
                const rowWidth = totalInRow * boxW + (totalInRow - 1) * gap;
                const startX = (W - rowWidth) / 2;
                const bx = startX + col * (boxW + gap);
                const by = 400 + row * 40;

                sCtx.fillStyle = isCorrect ? '#065f46' : '#7f1d1d';
                sCtx.fillRect(bx, by, boxW, boxH);
                sCtx.strokeStyle = isCorrect ? '#34d399' : '#f87171';
                sCtx.lineWidth = 1.5;
                sCtx.strokeRect(bx, by, boxW, boxH);

                sCtx.fillStyle = '#ffffff';
                sCtx.font = 'bold 12px monospace';
                sCtx.fillText(`#${String(s.id).padStart(2, '0')}${isCorrect ? '✓' : '✗'}`, bx + boxW / 2, by + 19);
            });

            // 時間戳記
            const nowStr = new Date().toLocaleString('zh-TW', { hour12: false });
            sCtx.fillStyle = '#64748b';
            sCtx.font = '11px "Noto Sans TC", monospace';
            sCtx.fillText(`測驗完成時間：${nowStr}`, W / 2, 512);

            generatedDataUrl = sCanvas.toDataURL('image/png');
            document.getElementById('scoreResultImg').src = generatedDataUrl;

            document.getElementById('studentFormView').classList.add('hidden');
            document.getElementById('studentFormView').classList.remove('flex');
            document.getElementById('resultCardView').classList.remove('hidden');
            document.getElementById('resultCardView').classList.add('flex');
        }

        // 鍵盤數字鍵 1~6 快速作答支援
        window.addEventListener('keydown', (e) => {

        /**************************************************************
         * 5. 點陣圖 Canvas 60 個場景專屬動畫渲染引擎 (320 x 180)
         **************************************************************/
        const canvas = document.getElementById('pixelCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        // 基礎像素繪圖輔助函式
        function pxRect(x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
        }

        function pxBorder(x, y, w, h, color, thickness = 2) {
            ctx.fillStyle = color;
            const rx = Math.round(x), ry = Math.round(y), rw = Math.round(w), rh = Math.round(h);
            ctx.fillRect(rx, ry, rw, thickness);
            ctx.fillRect(rx, ry + rh - thickness, rw, thickness);
            ctx.fillRect(rx, ry, thickness, rh);
            ctx.fillRect(rx + rw - thickness, ry, thickness, rh);
        }

        function pxText(text, x, y, color = '#ffffff', size = 10, align = 'center') {
            ctx.fillStyle = color;
            ctx.font = `bold ${size}px "Noto Sans TC", monospace`;
            ctx.textAlign = align;
            ctx.textBaseline = 'middle';
            ctx.fillText(text, Math.round(x), Math.round(y));
        }

        function pxLine(x1, y1, x2, y2, color = '#64748b', width = 2) {
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.beginPath();
            ctx.moveTo(Math.round(x1), Math.round(y1));
            ctx.lineTo(Math.round(x2), Math.round(y2));
            ctx.stroke();
        }

        // 繪製像素小人
        function drawPixelPerson(x, y, shirtColor = '#38bdf8', scale = 2) {
            // 頭
            pxRect(x - 2 * scale, y - 7 * scale, 4 * scale, 4 * scale, '#fcd34d');
            // 身體
            pxRect(x - 3 * scale, y - 3 * scale, 6 * scale, 5 * scale, shirtColor);
            // 腳
            pxRect(x - 2 * scale, y + 2 * scale, 2 * scale, 3 * scale, '#1e293b');
            pxRect(x + 0.5 * scale, y + 2 * scale, 2 * scale, 3 * scale, '#1e293b');
        }

        // 繪製像素小汽車
        function drawPixelCar(x, y, bodyColor = '#ef4444') {
            pxRect(x + 4, y, 20, 7, bodyColor); // 車頂
            pxRect(x + 6, y + 2, 16, 5, '#bae6fd'); // 車窗
            pxRect(x, y + 7, 28, 9, bodyColor); // 車身
            pxRect(x + 4, y + 14, 6, 5, '#0f172a'); // 左輪
            pxRect(x + 18, y + 14, 6, 5, '#0f172a'); // 右輪
            pxRect(x + 25, y + 9, 3, 3, '#fde047'); // 車頭燈
        }

        // 繪製閃爍像素指標箭頭
        function drawPointerArrow(x, y, dir = 'down', color = '#facc15') {
            const bounce = Math.sin(animTick * 0.12) * 3;
            const ay = Math.round(y + bounce);
            ctx.fillStyle = color;
            if (dir === 'down') {
                pxRect(x - 2, ay - 12, 4, 6, color);
                pxRect(x - 6, ay - 6, 12, 2, color);
                pxRect(x - 4, ay - 4, 8, 2, color);
                pxRect(x - 2, ay - 2, 4, 2, color);
            } else if (dir === 'up') {
                pxRect(x - 2, ay, 4, 2, color);
                pxRect(x - 4, ay + 2, 8, 2, color);
                pxRect(x - 6, ay + 4, 12, 2, color);
                pxRect(x - 2, ay + 6, 4, 6, color);
            }
        }

        // 繪製星空與地板背景 (移除底部文字遮罩，讓舞台乾淨無遮擋)
        function drawRetroBackground(bgType) {
            pxRect(0, 0, 320, 180, '#0b101e');
            // 背景像素網格點綴
            ctx.fillStyle = 'rgba(56, 189, 248, 0.06)';
            for (let x = 0; x < 320; x += 16) {
                ctx.fillRect(x, 0, 1, 180);
            }
            for (let y = 0; y < 180; y += 16) {
                ctx.fillRect(0, y, 320, 1);
            }
            // 底部舞台地板裝飾線
            pxRect(0, 166, 320, 14, '#131c31');
            pxRect(0, 166, 320, 2, '#1e293b');
        }

        /**************************************************************
         * 60 個場景的獨立繪製邏輯 (放慢動畫推進速度 3 倍，拉長演示週期)
         **************************************************************/
        function renderSceneCanvas() {
            // 將動畫計時器步進放慢至 0.32 (約原本速度的 1/3)，讓每個動作細節清楚呈現

                        { x: 95, y: 86, w: 66, l: 1 },
                        { x: 225, y: 86, w: 66, l: 1 },
                        { x: 60, y: 130, w: 54, l: 2 },
                        { x: 130, y: 130, w: 54, l: 2 },
                        { x: 190, y: 130, w: 54, l: 2 },
                        { x: 260, y: 130, w: 54, l: 2 }
                    ];
                    pts.forEach((p, i) => {
                        const hl = (p.l === activeLvl);
                        pxRect(p.x - p.w / 2, p.y - 11, p.w, 22, hl ? '#166534' : '#1e293b');
                        pxBorder(p.x - p.w / 2, p.y - 11, p.w, 22, hl ? '#4ade80' : '#64748b', 2);
                        pxText(treeData[i], p.x, p.y, '#ffffff', 8);
                    });
                    break;
                }
                case 48: { // 心智圖
                    const subs = [
                        { x: 68, y: 54, t: '✈️ 交通', c1: { x: 26, y: 38, t: '高鐵' }, c2: { x: 26, y: 70, t: '租車' } },
                        { x: 252, y: 54, t: '🏨 住宿', c1: { x: 294, y: 38, t: '飯店' }, c2: { x: 294, y: 70, t: '民宿' } },
                        { x: 68, y: 124, t: '🍜 美食', c1: { x: 26, y: 108, t: '夜市' }, c2: { x: 26, y: 138, t: '甜點' } },
                        { x: 252, y: 124, t: '🎡 景點', c1: { x: 294, y: 108, t: '古蹟' }, c2: { x: 294, y: 138, t: '海邊' } }
                    ];
                    subs.forEach(s => {
                        pxLine(160, 89, s.x, s.y, '#38bdf8', 2);
                        pxLine(s.x, s.y, s.c1.x, s.c1.y, '#64748b', 2);
                        pxLine(s.x, s.y, s.c2.x, s.c2.y, '#64748b', 2);
                        pxRect(s.x - 26, s.y - 10, 52, 20, '#0284c7');
                        pxText(s.t, s.x, s.y, '#fff', 8);
                        pxRect(s.c1.x - 18, s.c1.y - 8, 36, 16, '#1e293b');
                        pxText(s.c1.t, s.c1.x, s.c1.y, '#cbd5e1', 8);
                        pxRect(s.c2.x - 18, s.c2.y - 8, 36, 16, '#1e293b');
                        pxText(s.c2.t, s.c2.x, s.c2.y, '#cbd5e1', 8);
                    });
                    pxRect(122, 74, 76, 30, '#eab308');
                    pxBorder(122, 74, 76, 30, '#ffffff', 2);
                    pxText('🎯 旅遊心智圖', 160, 89, '#0f172a', 9);
                    break;
                }

                // ================= 圖 51~60 =================
                default: {
                    // 51~60 圖 (Graph) 網狀節點與交錯邊
                    const graphNodes = [
                        { x: 64, y: 50 }, { x: 160, y: 38 }, { x: 256, y: 52 },
                        { x: 52, y: 122 }, { x: 160, y: 102 }, { x: 266, y: 122 }
                    ];
                    const edges = [
                        [0, 1], [1, 2], [0, 3], [0, 4], [1, 4], [2, 4], [2, 5], [3, 4], [4, 5], [3, 5]
                    ];
                    const isShortestPathScene = (scene.id === 52);
                    const highlightEdges = [[0, 4], [4, 5]]; // 最短路徑或高亮迴路

                    edges.forEach(([a, b]) => {
                        const n1 = graphNodes[a], n2 = graphNodes[b];
                        const isHL = highlightEdges.some(([ha, hb]) => (ha === a && hb === b));
                        let lineColor = '#475569';
                        if (scene.id === 51) lineColor = (a + b) % 2 === 0 ? '#ef4444' : '#3b82f6';
                        if (scene.id === 60) lineColor = '#ef4444';
                        if (isShortestPathScene && isHL) lineColor = '#facc15';
                        pxLine(n1.x, n1.y, n2.x, n2.y, lineColor, isHL && pulse ? 3 : 2);
                    });

                    // 放慢動態脈衝點在網狀圖中穿梭的速度
                    const edgeIdx = Math.floor(t / 45) % edges.length;
                    const [ea, eb] = edges[edgeIdx];
                    const prog = (t % 45) / 45;
                    const px = graphNodes[ea].x + (graphNodes[eb].x - graphNodes[ea].x) * prog;
                    const py = graphNodes[ea].y + (graphNodes[eb].y - graphNodes[ea].y) * prog;
                    pxRect(px - 4, py - 4, 8, 8, '#facc15');

                    const nodeLabels = {
                        51: ['台北站', '中山站', '忠孝站', '西門站', '東門站', '古亭站'],
                        52: ['起點A', '路口1', '路口2', '路口3', '轉折點', '終點B'],
                        53: ['👦阿明', '👧小美', '🧑阿華', '👩小珍', '🧔大雄', '👱‍♀️靜香'],
                        54: ['✈️TPE', '✈️NRT', '✈️LAX', '✈️BKK', '✈️SIN', '✈️LHR'],
                        55: ['⚡電廠', '變電A', '變電B', '社區1', '樞紐站', '工廠區'],
                        56: ['⚔️斬擊', '🔥火球', '❄️冰凍', '🛡️格擋', '✨魔劍', '💥奧義'],
                        57: ['❤️心臟', '肺循環', '腦血管', '肝門脈', '主動脈', '微血管'],
                        58: ['🚏站牌1', '🚏站牌2', '🚏站牌3', '🚏站牌4', '🚏總站', '🚏站牌6'],
                        59: ['🌐R1', '🌐R2', '🌐R3', '🌐R4', '🌐Core', '🌐R6'],
                        60: ['🕵️嫌犯A', '📄證物1', '🕵️嫌犯B', '📍現場', '🔑關鍵', '🕵️共犯C']
                    }[scene.id];

                    graphNodes.forEach((n, idx) => {
                        pxRect(n.x - 24, n.y - 11, 48, 22, idx === 4 ? '#0284c7' : '#1e293b');
                        pxBorder(n.x - 24, n.y - 11, 48, 22, '#38bdf8', 2);
                        pxText(nodeLabels[idx], n.x, n.y, '#ffffff', 8);
                    });
                    break;
                }
            }

            requestAnimationFrame(renderSceneCanvas);
        }

        // 啟動遊戲與動畫迴圈
        window.onload = function () {
            startNewQuiz();
            renderSceneCanvas();
        };
    </script>
