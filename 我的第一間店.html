<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名店大師 Online - 營運數據版</title>
    <style>
        :root { --primary: #6366f1; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }
        body { font-family: "Noto Sans TC", sans-serif; background: #f0f2f5; margin: 0; padding: 15px; }
        .container { max-width: 1100px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 28px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); }
        
        .header-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: #f8fafc; padding: 15px; border-radius: 18px; text-align: center; border: 1px solid #e2e8f0; }
        .stat-val { font-size: 24px; font-weight: 800; color: var(--primary); display: block; }
        .stat-hint { font-size: 11px; color: #64748b; margin-top: 5px; display: block; line-height: 1.4; }

        #game-canvas {
            height: 280px; background: linear-gradient(to bottom, #bae6fd 0%, #e0f2fe 100%); 
            border-radius: 20px; position: relative; overflow: hidden;
            margin-bottom: 20px; border: 6px solid #f1f5f9;
        }
        .shop-building { position: absolute; bottom: 0px; left: 50%; transform: translateX(-50%); z-index: 100; }
        .main-store-icon { font-size: 200px; line-height: 1; }
        .sub-type-icon { 
            position: absolute; top: 20px; right: -30px; font-size: 55px; 
            background: white; border-radius: 50%; width: 75px; height: 75px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 12px rgba(0,0,0,0.2); border: 4px solid var(--primary);
        }
        .road { position: absolute; bottom: 0; width: 100%; height: 70px; background: #94a3b8; border-top: 5px solid #64748b; z-index: 10; }
        .customer { position: absolute; font-size: 50px; bottom: 5px; left: 110%; z-index: 20; transition: left linear; }
        
        .coin-pop {
            position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
            z-index: 150; font-weight: 800; font-size: 32px; color: #f59e0b;
            display: flex; align-items: center; white-space: nowrap;
            animation: popUp 1s ease-out forwards;
        }
        @keyframes popUp {
            0% { opacity: 0; transform: translate(-50%, 0); }
            30% { opacity: 1; }
            100% { opacity: 0; transform: translate(-50%, -100px); }
        }

        .setup-grid { display: grid; grid-template-columns: 0.8fr 1.2fr; gap: 20px; margin-bottom: 20px; }
		.strategy-history-area {max-height: 160px;overflow-y: auto;padding-right: 5px;}
        .card { border: 1px solid #e5e7eb; padding: 20px; border-radius: 18px; background: #fafbfc; }
        
        /* Modal Content 縮小約 20% */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.98); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 35px; border-radius: 28px; max-width: 760px; width: 90%; text-align: center; max-height: 90vh; overflow-y: auto; }
        
        .type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .diff-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 20px; }
        
        /* 選擇店型按鈕縮小 */
        .btn-type, .btn-diff { background: white; border: 3px solid #e2e8f0; padding: 18px; border-radius: 16px; cursor: pointer; text-align: left; transition: 0.3s; }
        .btn-type:hover, .btn-diff:hover { border-color: var(--primary); background: #f5f3ff; transform: translateY(-3px); }
        .btn-type h4, .btn-diff h4 { margin: 0 0 8px 0; font-size: 22px; }
        .btn-type p, .btn-diff p { margin: 0; font-size: 13px; color: #475569; line-height: 1.4; }

        /* 策略按鈕縮小 20% */
        .btn-buff-card {
            background: #fff;
            border: 3px solid #e5e7eb;
            border-radius: 16px;
            padding: 22px 15px;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .btn-buff-card:hover {
            border-color: var(--primary);
            background: #f5f3ff;
            transform: scale(1.03);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.15);
        }

        .buff-name-label { font-size: 22px; font-weight: 900; color: #1f2937; }
        .buff-desc-label { font-size: 16px; color: #4b5563; font-weight: 500; }
        .buff-cost-label { 
            font-size: 19px; 
            font-weight: 800; 
            color: var(--danger); 
            background: #fee2e2;
            padding: 4px 12px;
            border-radius: 10px;
        }

        /* 主按鈕縮小 */
        .btn-main { background: linear-gradient(135deg, #6366f1, #4338ca); color: white; width: 100%; padding: 16px; border-radius: 12px; font-size: 19px; font-weight: bold; border: none; cursor: pointer; margin: 4px 0; }
        .btn-info { background: #94a3b8; color: white; border-radius: 12px; padding: 12px; border: none; cursor: pointer; font-weight: bold; margin-bottom: 10px; width: 100%; font-size: 18px; }
        
        .log { background: #0f172a; color: #cbd5e1; padding: 20px; border-radius: 15px; height: 120px; overflow-y: auto; font-family: monospace; font-size: 15px; border-left: 8px solid var(--primary); }
        .status-tag { display: inline-block; background: #fee2e2; color: #991b1b; padding: 4px 10px; border-radius: 8px; margin: 4px; font-size: 14px; border: 1px solid #fecaca; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-stats">
        <div class="stat-card">📅 天數 <span class="stat-val" id="ui-day">1</span></div>
        <div class="stat-card">💰 現金 <span class="stat-val" id="ui-money">50000</span></div>
        <div class="stat-card">🏬 店型 <span id="ui-shop-name" style="font-weight:bold; color:var(--success)">-</span></div>
        <div class="stat-card">
            💸 固定開銷 <span id="ui-expense" style="font-weight:bold">0</span>
            <span class="stat-hint" id="ui-expense-hint">💡 固定成本：店租 0元 + 人事 2,400元 = 2,400元/天</span>
        </div>
    </div>

    <div id="game-canvas">
        <div class="shop-building" id="shop-node" style="display:none">
            <span class="main-store-icon">🏪</span>
            <div class="sub-type-icon" id="shop-sub-icon">🥤</div>
        </div>
        <div class="road"></div>
    </div>

    <div class="setup-grid">
        <div class="card">
            <h3>📊 營運數據</h3>
            <div style="font-size: 20px; line-height: 1.8;">
                單價：<b id="ui-price" style="color:var(--primary)">0</b> 元<br>
                成本：<b id="ui-cost" style="color:var(--danger)">0</b> 元<br>
                預估客流：<b id="ui-demand-range" style="color:var(--warning)">25 ~ 40</b> 人
            </div>
        </div>
		<div class="card">
			<h3 style="margin-top:0">📜 經營手札</h3>
			<div class="strategy-history-area">
				<div id="active-buffs-list" style="font-size: 14px; margin-bottom: 10px;">
					<b style="color:var(--primary)">✅ 當前策略：</b>
					<div id="history-buffs-inline" style="display: flex; flex-wrap: wrap; gap: 4px; margin-top:5px;">暫無</div>
				</div>
				<div id="event-impact-list" style="font-size: 14px;">
					<b style="color:var(--danger)">⚠️ 事件影響：</b>
					<div id="history-events-inline" style="margin-top:5px;">暫無</div>
				</div>
			</div>
		</div>
    </div>

    <button class="btn-main" id="btn-start" onclick="startDay()">開店!</button>
    <div class="log" id="game-log" style="margin-top:15px;"></div>
</div>

<div id="setup-modal" class="modal" style="display:flex">
    <div class="modal-content" id="setup-content">
        <h2 style="font-size: 28px;">🏬 第一步：選擇你的事業起源</h2>
        <div class="type-grid">
            <button class="btn-type" onclick="chooseDiff('drink')"><h4>🥤 飲料店</h4><p>客流量極大，單價低。</p></button>
            <button class="btn-type" onclick="chooseDiff('bakery')"><h4>🥐 烘焙坊</h4><p>成本與需求穩定。</p></button>
            <button class="btn-type" onclick="chooseDiff('game')"><h4>🎮 電玩店</h4><p>高單價、高利潤。</p></button>
            <button class="btn-type" onclick="chooseDiff('hobby')"><h4>🧱 玩具店</h4><p>專業客群穩定。</p></button>
        </div>
    </div>
</div>

<div id="settle-modal" class="modal">
    <div class="modal-content">
        <h2 id="settle-title" style="font-size: 32px; margin-bottom: 15px;">📈 今日結算報表</h2>
        <div id="settle-report" style="font-size:20px; text-align:center; background:#f8fafc; padding:25px; border-radius:20px; line-height:1.6; border: 2px solid #e2e8f0; margin-bottom: 25px;"></div>
        <hr style="border: 1px solid #f3f4f6; margin-bottom: 25px;">
        <h3 style="font-size: 26px; color: var(--primary); margin-bottom: 15px;">💡 每日投資決策</h3>
        <div class="type-grid" id="buff-options" style="grid-template-columns: repeat(3, 1fr); gap: 15px;"></div>
        <button class="btn-main" style="background:#94a3b8; font-size:18px; margin-top: 30px; width: 45%;" onclick="checkEventAfterSettle()">跳過投資</button>
    </div>
</div>

<div id="event-modal" class="modal">
    <div class="modal-content">
        <h2 id="event-title" style="color:var(--danger); font-size: 30px;">🔥 重大經營決策</h2>
        <p id="event-desc" style="font-size:17px; padding:20px; background:#fff1f2; border-radius:15px; line-height:1.5;"></p>
        <div id="event-options" class="type-grid" style="grid-template-columns: 1fr 1fr;"></div>
    </div>
</div>

<div id="history-modal" class="modal">
    <div class="modal-content">
        <h2 style="font-size: 28px;">📜 經營手札</h2>
        <div style="text-align:left; line-height:1.6; font-size: 15px;">
            <h4>✅ 當前投資策略：</h4>
            <div id="history-buffs">暫無</div>
            <h4 style="margin-top:15px;">⚠️ 歷史事件影響：</h4>
            <div id="history-events">暫無</div>
        </div>
        <button class="btn-main" style="width: 40%; margin-top: 20px;" onclick="document.getElementById('history-modal').style.display='none'">關閉手札</button>
    </div>
</div>

<script>
	const SHOP_DATA = {
		drink: { name: "飲料店", icon: "🥤", price: 65, cost: 22, demandMin: 25, demandMax: 40, expense: 2400 },
		bakery: { name: "烘焙坊", icon: "🥐", price: 165, cost: 55, demandMin: 15, demandMax: 25, expense: 2400 },
		game: { name: "電玩店", icon: "🎮", price: 1800, cost: 1100, demandMin: 3, demandMax: 8, expense: 2400 },
		hobby: { name: "玩具店", icon: "🧱", price: 900, cost: 500, demandMin: 8, demandMax: 15, expense: 2400 }
	};

const BUFF_POOL = [
    { name: "🚀 網路廣告", desc: "客流 +30%", buy: 2500, dRate: 0.30 },
    { name: "🤖 自動結帳", desc: "單位成本 -10%", buy: 3500, cRate: -0.10 },
    { name: "💎 尊榮會員", desc: "客流 +15%, 售價 +10%", buy: 4000, dRate: 0.15, pRate: 0.10 },
    { name: "⏰ 延長工時", desc: "客流 +25%, 人事 +800", buy: 1500, dRate: 0.25, personnelAdd: 800 }, // 修改點
    { name: "🎫 優惠禮券", desc: "客流 +40%, 售價 -15%", buy: 1200, dRate: 0.40, pRate: -0.15 },
    { name: "🧹 門面裝修", desc: "客流 +10%, 售價 +5%", buy: 5000, dRate: 0.10, pRate: 0.05 },
    { name: "📦 批發採購", desc: "單位成本 -20%, 客流 -5%", buy: 3000, cRate: -0.20, dRate: -0.05 },
    { name: "👨‍🍳 專業培訓", desc: "售價 +15%, 人事 +500", buy: 4500, pRate: 0.15, personnelAdd: 500 } // 修改點
];
	const BIG_EVENTS = [
		{
			title: "⚖️ 法定工資調漲",
			desc: "政府宣布調高基本時薪，這將影響近期的經營成本（持續 5 天）。",
			options: [
				{ 
					text: "精簡人力 (人事+400, 客流-10%)", 
					impact: { personnelAdd: 400, dRate: -0.10, log: "短期：精簡人力導致服務品質下降", duration: 5 } 
				},
				{ 
					text: "全面調薪 (人事+800, 售價+10%)", 
					impact: { pRate: 0.10, personnelAdd: 800, log: "短期：調薪提升士氣與產品價值", duration: 5 }
				}
			]
		},
		{
			title: "🌀 強力颱風侵襲",
			desc: "氣象局發布陸上警報，影響預計僅限今日。",
			options: [
				{ 
					text: "防颱加固 (開銷+1000, 客流-5%)", 
					impact: { eAdd: 1000, dRate: -0.05, log: "短期：加固設施支出", duration: 1 } 
				},
				{ 
					text: "停業一天 (當天零客流, 成本-20%)", 
					impact: { dRate: -1.0, cRate: -0.20, log: "短期：停業避災", duration: 1 } 
				}
			]
		},
		{
			title: "✈️ 國際旅遊節",
			desc: "大量國外旅客湧入，這是一次性的觀光熱潮（持續 1 天）。",
			options: [
				{ 
					text: "外籍友善 (人事+800, 客流+40%)", 
					impact: { dRate: 0.40, personnelAdd: 800, log: "短期：增聘臨時翻譯人員", duration: 1 }
				},
				{ 
					text: "推出套裝 (售價+15%, 客流+10%)", 
					impact: { pRate: 0.15, dRate: 0.10, log: "短期：觀光限定套裝", duration: 1 } 
				}
			]
		},
		{
			title: "🌍 供應鏈危機",
			desc: "全球物料短缺，預計會造成短期的成本波動（持續 2 天）。",
			options: [
				{ 
					text: "吸收成本 (成本+8)", 
					impact: { cAdd: 8, log: "短期：公司吸收物料漲幅", duration: 2 } 
				},
				{ 
					text: "調整配方 (客流-15%)", 
					impact: { dRate: -0.15, log: "短期：配方更換導致客流流失", duration: 2 } 
				}
			]
		},
		{
			title: "🚧 門口修路",
			desc: "店門口進行地下管線施工，預計持續 3 天，進出不便。",
			options: [
				{ 
					text: "忍受不便 (客流-40%)", 
					impact: { dRate: -0.40, log: "短期：施工阻擋了客流", duration: 3 } 
				},
				{
					text: "補貼吸引 (開銷+2000, 客流-10%)",
					impact: { eAdd: 2000, dRate: -0.10, log: "短期：投入行銷經費補貼", duration: 3 }
				}
			]
		}
	];
	
    let state = {
        shop: null, money: 50000, day: 1, 
        activeBuffs: [], historyEvents: [],
        difficulty: 'normal', eventCycle: 5,
        rent: 1000, personnel: 2400,
        expenseMod: 1, dailyRev: 0, dailySold: 0
    };

    function chooseDiff(key) {
        state.shop = { ...SHOP_DATA[key] };
        document.getElementById('setup-content').innerHTML = `<h2 style="font-size:28px;">⚙️ 第二步：選擇經營難度</h2>
            <div class="diff-grid">
                <button class="btn-diff" onclick="finalize('easy', 120000, 800, 7)">
                    <h4>🟢 簡單</h4>
                    <p>資金充足 ($12萬)<br>店租: $800 / 天<br><b>每 7 天</b>一事件</p>
                </button>
                <button class="btn-diff" onclick="finalize('normal', 60000, 1000, 5)">
                    <h4>🟡 標準</h4>
                    <p>創業資金 ($6萬)<br>店租: $1,000 / 天<br><b>每 5 天</b>一事件</p>
                </button>
                <button class="btn-diff" onclick="finalize('hard', 30000, 1200, 3)">
                    <h4>🔴 困難</h4>
                    <p>資金吃緊 ($3萬)<br>店租: $1,200 / 天<br><b>每 3 天</b>一事件</p>
                </button>
            </div>`;
    }

    function finalize(diff, m, r, cycle) {
        state.difficulty = diff; state.money = m; state.rent = r; state.eventCycle = cycle;
        document.getElementById('setup-modal').style.display = 'none';
        document.getElementById('shop-node').style.display = 'flex';
        document.getElementById('shop-sub-icon').textContent = state.shop.icon;
        document.getElementById('ui-shop-name').textContent = state.shop.name;
        updateUI();
    }

	function calculateCurrentStats() {
		let p = state.shop.price, c = state.shop.cost;
		let baseE = (state.rent + state.personnel);
		
		let totalPRate = 1, totalCRate = 1, totalERate = 1;
		let totalDRate = 0, totalDAdd = 0, totalEAdd = 0;
		let tempPersonnelAdd = 0; // 用於處理事件增加的人事費

		state.activeBuffs.concat(state.historyEvents).forEach(item => {
			if(item.pRate) totalPRate += item.pRate;
			if(item.cRate) totalCRate += item.cRate;
			if(item.eRate) totalERate += item.eRate;
			if(item.dRate) totalDRate += item.dRate;
			
			if(item.pAdd) p += item.pAdd;
			if(item.cAdd) c += item.cAdd;
			if(item.eAdd) totalEAdd += item.eAdd;
			if(item.dAdd) totalDAdd += item.dAdd;

			// 如果是事件帶來的暫時性支出
			if(item.personnelAdd) tempPersonnelAdd += item.personnelAdd;
			if(item.rentAdd) totalEAdd += item.rentAdd;
		});

		return { 
			price: Math.max(1, Math.floor(p * totalPRate)), 
			cost: Math.max(1, Math.floor(c * totalCRate)), 
			expense: Math.max(0, Math.floor((baseE + tempPersonnelAdd) * totalERate) + totalEAdd), 
			dRate: totalDRate, 
			dAdd: totalDAdd 
		};
	}

	function updateUI() {
			const stats = calculateCurrentStats();
			document.getElementById('ui-money').textContent = Math.floor(state.money);
			document.getElementById('ui-day').textContent = state.day;
			document.getElementById('ui-price').textContent = stats.price;
			document.getElementById('ui-cost').textContent = stats.cost;
			document.getElementById('ui-expense').textContent = Math.floor(stats.expense);
			
			// 這裡同步更新提示文字，確保店租與人事費是 state 中的最新數值
			const currentTotal = state.rent + state.personnel;
			document.getElementById('ui-expense-hint').textContent = 
				`💡 固定成本：店租 ${state.rent.toLocaleString()}元 + 人事 ${state.personnel.toLocaleString()}元 = ${currentTotal.toLocaleString()}元/天`;
			
			const minDemand = Math.max(0, Math.floor(state.shop.demandMin * (1 + stats.dRate)) + stats.dAdd);
			const maxDemand = Math.max(0, Math.floor(state.shop.demandMax * (1 + stats.dRate)) + stats.dAdd);
			document.getElementById('ui-demand-range').textContent = `${minDemand} ~ ${maxDemand}`;
			const buffDiv = document.getElementById('history-buffs-inline');
			const eventDiv = document.getElementById('history-events-inline');
			
			if (buffDiv) {
				buffDiv.innerHTML = state.activeBuffs.map(b => 
					`<span class="status-tag" style="margin:2px; font-size:11px;">${b.name}</span>`
				).join('') || "無";
			}
			
			if (eventDiv) {
				eventDiv.innerHTML = state.historyEvents.map(e => {
					// 如果有 duration 就顯示剩餘天數，否則顯示永久
					const countdown = e.duration !== undefined ? ` (剩餘 ${e.duration+1} 天)` : " (永久)";
					return `<div style="font-size:12px; color:#64748b; border-bottom:1px solid #eee; padding:2px 0;">
						• ${e.log} <b style="color:var(--danger)">${countdown}</b>
					</div>`;
				}).join('') || "無";
			}
	}
	
	async function startDay() {
		document.getElementById('btn-start').disabled = true;
		state.dailyRev = 0; state.dailySold = 0;
		
		// 核心邏輯：此時 calculateCurrentStats 會包含剛剛選取的 BigEvent 效果
		const stats = calculateCurrentStats();
		
		const range = state.shop.demandMax - state.shop.demandMin + 1;
		const baseDemand = Math.floor(Math.random() * range) + state.shop.demandMin; 
		
		const finalCount = Math.max(0, Math.floor(baseDemand * (1 + stats.dRate)) + stats.dAdd);
		await playBusinessAnimation(finalCount, stats.price);
		
		let totalCost = (state.dailySold * stats.cost) + stats.expense;
		state.money -= totalCost; 
		showSettlement(state.dailySold, state.dailyRev, totalCost, state.dailyRev - totalCost);
	}

    async function playBusinessAnimation(total, currentPrice) {
        return new Promise(resolve => {
            const canvas = document.getElementById('game-canvas');
            let spawned = 0;
            const duration = 10000;
            const startTime = Date.now();

            function spawnCustomer() {
                if (spawned >= total) return;

                spawned++;
                const c = document.createElement('div');
                c.className = 'customer';
                c.textContent = ['🚶', '🧍', '🚶‍♀️', '🧍‍♂️', '🏃'][Math.floor(Math.random() * 5)];
                const xOffset = (Math.random() * 80) - 40;
                c.style.transform = `translateX(${xOffset}px)`;
                canvas.appendChild(c);

                // 客人走向商店
                setTimeout(() => {
                    c.style.transition = "left 3s linear";
                    c.style.left = "43%";

                    // 到達商店後的邏輯
                    setTimeout(() => {
                        c.style.opacity = "0";

                        // 獨立觸發錢袋與金額動畫
                        const coin = document.createElement('div');
                        coin.className = 'coin-pop';
                        coin.innerHTML = `💰 +${currentPrice}`;
                        document.getElementById('shop-node').appendChild(coin);

                        // 更新數據
                        state.money += currentPrice;
                        state.dailyRev += currentPrice;
                        state.dailySold += 1;
                        document.getElementById('ui-money').textContent = Math.floor(state.money);

                        // 離開商店
                        setTimeout(() => {
                            c.style.opacity = "1";
                            c.style.transition = "left 3s linear";
                            c.style.left = "-20%";
                            // 清除錢袋
                            setTimeout(() => coin.remove(), 1000);
                        }, 800);
                    }, 3000);
                }, 50);

                // 清除客人元件
                setTimeout(() => c.remove(), 9500);

                // 隨機間隔產生下一個客人，維持流暢感
                if (spawned < total) {
                    const nextDelay = (duration / total) * (Math.random() * 0.5 + 0.75);
                    setTimeout(spawnCustomer, nextDelay);
                }
            }

            // 開始生成
            spawnCustomer();

            // 確保所有動畫跑完才結算 (約需動畫時間+緩衝)
            setTimeout(resolve, duration + 5000);
        });
    }

    function showSettlement(count, rev, cost, profit) {
        const modal = document.getElementById('settle-modal');
        document.getElementById('settle-report').innerHTML = `
            🛍️ 銷量：<b>${count}</b> 件 | 
            收入：<span style="color:var(--success); font-weight:800;">+$${rev.toLocaleString()}</span><br>
            支出：<span style="color:var(--danger); font-weight:800;">-$${Math.floor(cost).toLocaleString()}</span><br>
            💎 純利：<b style="color:${profit>=0?'green':'red'}; font-size: 26px;">$${Math.floor(profit).toLocaleString()}</b>
        `;
        log(`Day ${state.day}：銷量 ${count} | 營收 ${rev} | 淨利 ${Math.floor(profit)}`);
        const optBox = document.getElementById('buff-options');
        optBox.innerHTML = '';
        [...BUFF_POOL].sort(() => 0.5-Math.random()).slice(0,3).forEach(b => {
            const btn = document.createElement('div');
            btn.className = 'btn-buff-card';
            btn.innerHTML = `
                <div class="buff-name-label">${b.name}</div>
                <div class="buff-desc-label">${b.desc}</div>
                <div class="buff-cost-label">$${b.buy.toLocaleString()}</div>
            `;
            btn.onclick = () => {
				if(state.money < b.buy) return alert("資金不足");
				state.money -= b.buy;
				
				// 如果投資項目有人事或店租增加，直接永久加進 state
				if(b.personnelAdd) state.personnel += b.personnelAdd;
				if(b.rentAdd) state.rent += b.rentAdd;
				
				state.activeBuffs.push(b);
				updateUI(); // 這會觸發更新「固定開銷」下方那段文字
				checkEventAfterSettle();
			};
            optBox.appendChild(btn);
        });
        modal.style.display = 'flex';
    }

    function checkEventAfterSettle() {
        document.getElementById('settle-modal').style.display = 'none';
        if (state.day % state.eventCycle === 0) triggerBigEvent(); else nextDay();
    }

    function triggerBigEvent() {
		const ev = BIG_EVENTS[Math.floor(Math.random() * BIG_EVENTS.length)];
		document.getElementById('event-title').textContent = `🔥 第 ${state.day} 天 ${ev.title}`;
		document.getElementById('event-desc').textContent = ev.desc;
		const optBox = document.getElementById('event-options');
		optBox.innerHTML = '';
		ev.options.forEach(opt => {
			const btn = document.createElement('button');
			btn.className = 'btn-main';
			btn.textContent = opt.text;
			btn.onclick = () => {
				// 使用物件展開運算子 {...} 確保 duration 是這一次事件獨立擁有的
				const newImpact = { ...opt.impact };
				
				// 如果是像你說的「5日得到3天事件」，這行 log 可以幫助除錯
				log(`[事件] ${newImpact.log} (持續 ${newImpact.duration} 天，預計 ${state.day + newImpact.duration+1} 日恢復)`);
				
				state.historyEvents.push(newImpact);
				document.getElementById('event-modal').style.display = 'none';
				updateUI(); 
				nextDay();
			};
			optBox.appendChild(btn);
		});
		document.getElementById('event-modal').style.display = 'flex';
	}

	function nextDay() {
		// 1. 處理事件剩餘天數
		state.historyEvents.forEach(event => {
			if (event.duration !== undefined) {
				event.duration--; // 天數減 1
			}
		});

		// 2. 自動過濾：只保留 duration 還大於 0 的事件
		// 當 duration 變為 0，這個事件就會從陣列消失，calculateCurrentStats() 就不會再計算它的加成
		const originalCount = state.historyEvents.length;
		state.historyEvents = state.historyEvents.filter(event => 
			event.duration === undefined || event.duration > -1
		);

		// 3. 如果有事件消失了，紀錄一條 log 提醒玩家
		if (state.historyEvents.length < originalCount) {
			log(`<span style="color:var(--success)">✨ 部分暫時性事件影響已結束，經營狀況回復原狀。</span>`);
		}

		// 4. 原有的天數增加與 UI 更新
		state.day++;
		updateUI(); 
		document.getElementById('btn-start').disabled = false;

		if(state.day > 30) alert("30天經營結束！");
	}

    function showHistory() {
        const buffDiv = document.getElementById('history-buffs');
        const eventDiv = document.getElementById('history-events');
        buffDiv.innerHTML = state.activeBuffs.map(b => `<div class="status-tag">${b.name}: ${b.desc}</div>`).join('') || "目前無投資";
        eventDiv.innerHTML = state.historyEvents.map(e => `<div class="status-tag" style="background:#e0f2fe; color:#0369a1; border-color:#bae6fd;">${e.log}</div>`).join('') || "目前無事件影響";
        document.getElementById('history-modal').style.display = 'flex';
    }

    function log(msg) {
        const l = document.getElementById('game-log');
        l.innerHTML = `[${state.day}日] ${msg}<br>` + l.innerHTML;
    }
</script>
