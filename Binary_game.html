<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>進位制探索</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --accent: #22c55e;
            --inactive: #475569;
            --text-light: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 5px;
            color: var(--primary);
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 25px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 860px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .controls-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            width: 100%;
        }

        .toggle-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .group-label {
            font-size: 14px;
            color: #94a3b8;
            font-weight: bold;
            margin-right: 4px;
        }

        .btn {
            background-color: #334155;
            color: #f8fafc;
            border: 2px solid transparent;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .btn.active {
            background-color: var(--primary);
            color: #0f172a;
        }

        .btn-base.active {
            background-color: #f59e0b;
            color: #0f172a;
        }

        .btn:hover:not(.active) {
            background-color: #475569;
        }

        /* 遊戲面板 */
        #game-panel {
            display: none;
            text-align: center;
            margin-bottom: 15px;
            width: 100%;
        }

        .target-box {
            font-size: 26px;
            background: #090d16;
            padding: 10px 24px;
            border-radius: 10px;
            border: 2px dashed var(--primary);
            display: inline-block;
            margin-bottom: 10px;
        }

        .score-box {
            display: flex;
            justify-content: center;
            gap: 25px;
            width: 100%;
            font-size: 16px;
            color: #fbbf24;
        }

        #finish-banner {
            display: none;
            background-color: rgba(34, 197, 94, 0.15);
            border: 2px solid var(--accent);
            color: #f8fafc;
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            width: 90%;
            box-sizing: border-box;
        }

        /* 卡片群組 */
        .cards-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin: 15px 0 25px 0;
            min-height: 140px;
        }

        .digit-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .weight-label {
            font-size: 13px;
            color: #94a3b8;
            font-family: monospace;
        }

        .weight-val {
            font-size: 16px;
            font-weight: bold;
            color: #38bdf8;
        }

        .digit-card {
            width: 76px;
            height: 105px;
            background-color: #0f172a;
            border: 2px solid var(--inactive);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s, border-color 0.2s, background-color 0.2s;
        }

        .digit-card:hover {
            transform: translateY(-4px);
        }

        .digit-card.active {
            border-color: var(--accent);
            background-color: rgba(34, 197, 94, 0.15);
            box-shadow: 0 0 14px rgba(34, 197, 94, 0.4);
        }

        .digit-val {
            font-size: 38px;
            font-weight: 800;
            color: var(--inactive);
            line-height: 1;
        }

        .digit-card.active .digit-val {
            color: var(--accent);
        }

        .hint-text {
            font-size: 11px;
            color: #64748b;
            margin-top: 4px;
        }

        /* 結果顯示板 */
        .display-board {
            width: 100%;
            background-color: #0f172a;
            border-radius: 10px;
            padding: 18px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .formula-line {
            font-family: monospace;
            font-size: 15px;
            color: #cbd5e1;
            word-break: break-all;
            line-height: 1.5;
            min-height: 24px;
        }

        .val-tags {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .tag {
            background-color: #1e293b;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            flex: 1;
            min-width: 120px;
            text-align: center;
        }

        .tag strong {
            display: block;
            font-size: 24px;
            color: #38bdf8;
            margin-top: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <h1>進位制探索實驗室</h1>
    <div class="subtitle">點擊卡片遞增數值，探索位值與權重運作原理</div>

    <div class="container">
        <div class="controls-row">
            <!-- 進位制切換 -->
            <div class="toggle-group">
                <span class="group-label">進位制：</span>
                <button class="btn btn-base active" id="btn-base2" onclick="setBase(2)">二進位 (BIN)</button>
                <button class="btn btn-base" id="btn-base8" onclick="setBase(8)">八進位 (OCT)</button>
                <button class="btn btn-base" id="btn-base16" onclick="setBase(16)">十六進位 (HEX)</button>
            </div>

            <!-- 遊玩模式切換 -->
            <div class="toggle-group">
                <span class="group-label">模式：</span>
                <button class="btn active" id="btn-explore" onclick="setMode('explore')">自由探索</button>
                <button class="btn" id="btn-quiz10" onclick="setMode('quiz10')">10題闖關 (不計時)</button>
                <button class="btn" id="btn-timed" onclick="setMode('timed')">限時挑戰 (15秒)</button>
            </div>
        </div>

        <!-- 遊戲面板 -->
        <div id="game-panel">
            <div class="target-box">
                目標十進位：<span id="targetNumber" style="color: #f43f5e; font-weight: bold;">0</span>
            </div>
            <div class="score-box">
                <span id="progress-info">題數：<b id="currentQ">1</b> / 10</span>
                <span id="timer-info" style="display: none;">倒數：<b id="timer">15</b>s</span>
            </div>
        </div>

        <!-- 10題完成橫幅 -->
        <div id="finish-banner">
            <h2 style="margin: 0 0 6px 0; color: #4ade80;">🎉 恭喜通關！</h2>
            <p style="margin: 0 0 12px 0;">已順利完成 10 題數字系統轉換！</p>
            <button class="btn" style="background-color: var(--accent); color: #0f172a;" onclick="setMode('quiz10')">再玩一次</button>
        </div>

        <!-- 卡片操作區 -->
        <div class="cards-container" id="cardsContainer"></div>

        <!-- 即時算式與進位展示 -->
        <div class="display-board">
            <div>
                <span style="color: #94a3b8; font-size: 13px;">權重累加計算過程：</span>
                <div class="formula-line" id="formula">0</div>
            </div>
            <div class="val-tags">
                <div class="tag">二進位 (BIN)<strong id="binDisplay">0</strong></div>
                <div class="tag">八進位 (OCT)<strong id="octDisplay">0</strong></div>
                <div class="tag">十進位 (DEC)<strong id="decDisplay">0</strong></div>
                <div class="tag">十六進位 (HEX)<strong id="hexDisplay">0</strong></div>
            </div>
        </div>
    </div>

    <script>
        const HEX_CHARS = "0123456789ABCDEF";

        // 各進位制配置：位數與上限 (控制最大值約在 255~511，便於心算練習)
        const BASE_CONFIG = {
            2:  { length: 8, maxTarget: 255 },  // 2^8 = 256
            8:  { length: 3, maxTarget: 511 },  // 8^3 = 512
            16: { length: 2, maxTarget: 255 }   // 16^2 = 256
        };

        let currentBase = 2;
        let digits = [];
        let mode = 'explore'; // 'explore', 'quiz10', 'timed'
        let targetValue = 0;
        let timerId = null;
        let timeLeft = 15;
        let currentQuestion = 1;
        const TOTAL_QUESTIONS = 10;

        // 格式化單一數值為該進位的文字符號
        function formatDigit(val) {
            return HEX_CHARS[val];
        }

        // 初始化卡片區
        function initCards() {
            const config = BASE_CONFIG[currentBase];
            digits = new Array(config.length).fill(0);

            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            for (let i = 0; i < config.length; i++) {
                const exp = config.length - 1 - i;
                const weight = Math.pow(currentBase, exp);

                const col = document.createElement('div');
                col.className = 'digit-column';

                col.innerHTML = `
                    <div class="weight-label">${currentBase}<sup>${exp}</sup></div>
                    <div class="weight-val">${weight}</div>
                    <div class="digit-card" id="card-${i}" onclick="incrementDigit(${i})">
                        <span class="digit-val" id="val-${i}">0</span>
                    </div>
                    <div class="hint-text">點擊+1</div>
                `;
                container.appendChild(col);
            }
            updateDisplays();
        }

        // 點擊卡片：數值 +1 並循環
        function incrementDigit(index) {
            digits[index] = (digits[index] + 1) % currentBase;

            const card = document.getElementById(`card-${index}`);
            const valEl = document.getElementById(`val-${index}`);

            valEl.innerText = formatDigit(digits[index]);

            if (digits[index] > 0) {
                card.classList.add('active');
            } else {
                card.classList.remove('active');
            }

            updateDisplays();

            if (mode === 'quiz10' || mode === 'timed') {
                checkAnswer();
            }
        }

        // 即時計算數值與公式
        function updateDisplays() {
            const config = BASE_CONFIG[currentBase];
            let total = 0;
            let formulaParts = [];

            for (let i = 0; i < config.length; i++) {
                const exp = config.length - 1 - i;
                const weight = Math.pow(currentBase, exp);
                const val = digits[i];
                if (val > 0) {
                    total += val * weight;
                    if (currentBase === 2) {
                        formulaParts.push(`<span style="color: #22c55e;">${weight}</span>`);
                    } else {
                        formulaParts.push(`<span style="color: #22c55e;">(${formatDigit(val)} × ${weight})</span>`);
                    }
                }
            }

            // 更新四種進位制數值（均無 0x / 0o 前綴）
            document.getElementById('binDisplay').innerText = total.toString(2);
            document.getElementById('octDisplay').innerText = total.toString(8);
            document.getElementById('decDisplay').innerText = total;
            document.getElementById('hexDisplay').innerText = total.toString(16).toUpperCase();

            const formulaEl = document.getElementById('formula');
            formulaEl.innerHTML = formulaParts.length > 0 ? formulaParts.join(' + ') + ` = ${total}` : '0 (尚未設定任何數值)';
        }

        // 切換進位制
        function setBase(base) {
            if (currentBase === base) return;
            currentBase = base;

            document.getElementById('btn-base2').className = `btn btn-base ${base === 2 ? 'active' : ''}`;
            document.getElementById('btn-base8').className = `btn btn-base ${base === 8 ? 'active' : ''}`;
            document.getElementById('btn-base16').className = `btn btn-base ${base === 16 ? 'active' : ''}`;

            initCards();

            // 若在遊戲中，重抽一題符合該進位制範圍的題目
            if (mode !== 'explore') {
                nextRound();
            }
        }

        // 切換遊玩模式
        function setMode(newMode) {
            mode = newMode;
            clearInterval(timerId);

            document.getElementById('btn-explore').className = `btn ${mode === 'explore' ? 'active' : ''}`;
            document.getElementById('btn-quiz10').className = `btn ${mode === 'quiz10' ? 'active' : ''}`;
            document.getElementById('btn-timed').className = `btn ${mode === 'timed' ? 'active' : ''}`;

            const gamePanel = document.getElementById('game-panel');
            const timerInfo = document.getElementById('timer-info');
            const progressInfo = document.getElementById('progress-info');
            const finishBanner = document.getElementById('finish-banner');

            finishBanner.style.display = 'none';

            if (mode === 'explore') {
                gamePanel.style.display = 'none';
                resetDigits();
            } else if (mode === 'quiz10') {
                gamePanel.style.display = 'block';
                timerInfo.style.display = 'none';
                progressInfo.style.display = 'inline';
                currentQuestion = 1;
                document.getElementById('currentQ').innerText = currentQuestion;
                nextRound();
            } else if (mode === 'timed') {
                gamePanel.style.display = 'block';
                timerInfo.style.display = 'inline';
                progressInfo.style.display = 'none';
                nextRound();
            }
        }

        // 歸零所有卡片
        function resetDigits() {
            const config = BASE_CONFIG[currentBase];
            digits = new Array(config.length).fill(0);
            for (let i = 0; i < config.length; i++) {
                const card = document.getElementById(`card-${i}`);
                const valEl = document.getElementById(`val-${i}`);
                if (card && valEl) {
                    valEl.innerText = '0';
                    card.classList.remove('active');
                }
            }
            updateDisplays();
        }

        // 產生下一題
        function nextRound() {
            resetDigits();
            const config = BASE_CONFIG[currentBase];
            targetValue = Math.floor(Math.random() * config.maxTarget) + 1;
            document.getElementById('targetNumber').innerText = targetValue;

            if (mode === 'timed') {
                timeLeft = 15;
                document.getElementById('timer').innerText = timeLeft;
                clearInterval(timerId);
                timerId = setInterval(() => {
                    timeLeft--;
                    document.getElementById('timer').innerText = timeLeft;
                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        alert(`⏰ 時間到！目標數字是 ${targetValue}，重新開始挑戰！`);
                        nextRound();
                    }
                }, 1000);
            }
        }

        // 檢查作答
        function checkAnswer() {
            const currentTotal = parseInt(document.getElementById('decDisplay').innerText, 10);
            if (currentTotal === targetValue) {
                if (mode === 'quiz10') {
                    if (currentQuestion >= TOTAL_QUESTIONS) {
                        document.getElementById('game-panel').style.display = 'none';
                        document.getElementById('finish-banner').style.display = 'block';
                    } else {
                        currentQuestion++;
                        document.getElementById('currentQ').innerText = currentQuestion;
                        setTimeout(nextRound, 150);
                    }
                } else if (mode === 'timed') {
                    clearInterval(timerId);
                    setTimeout(() => {
                        alert('🎉 答對了！進入下一題！');
                        nextRound();
                    }, 120);
                }
            }
        }

        window.onload = () => {
            initCards();
        };
    </script>
</body>
</html>
