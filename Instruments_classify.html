<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>樂器分類大挑戰</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #007bff;
            --success-color: #28a745;
            --error-color: #dc3545;
            --bg-color: #f0f4f8;
        }

        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            margin: 0;
            touch-action: manipulation;
        }

        h1 { color: var(--primary-color); margin-bottom: 5px; font-size: 1.5rem; }
        .instruction { color: #666; margin-bottom: 20px; font-size: 0.9rem; }

        #instrument-pool {
            width: 95%;
            max-width: 1000px;
            min-height: 100px;
            background: #fff;
            border: 2px dashed #999;
            border-radius: 10px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            padding: 10px;
            margin-bottom: 20px;
        }

        .instrument {
            width: 60px;
            height: 60px;
            margin: 8px;
            cursor: grab;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            touch-action: none;
            position: relative;
            z-index: 10;
        }

        .instrument img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        .categories-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            width: 100%;
            max-width: 1200px;
        }

        .category-box {
            width: 160px;
            min-height: 180px;
            background: #e9ecef;
            border: 2px solid #ced4da;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            padding: 8px;
        }

        .category-box h3 {
            margin: 0 0 10px 0;
            color: #495057;
            font-size: 0.9rem;
            border-bottom: 2px solid #dee2e6;
            text-align: center;
            padding-bottom: 5px;
        }

        .drop-zone {
            flex-grow: 1;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 5px;
            min-height: 100px;
        }

        .controls { margin: 30px 0; }
        button {
            padding: 12px 40px;
            font-size: 1.1rem;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        #certificate {
            background: #fff;
            width: 90%;
            max-width: 500px;
            padding: 40px;
            border: 10px double #c9ad6a;
            border-radius: 5px;
            text-align: center;
            position: relative;
        }

        #certificate h2 { font-family: "Times New Roman", serif; color: #846733; margin-top: 0; }
        .cert-name { font-size: 1.8rem; border-bottom: 2px solid #333; margin: 20px auto; width: fit-content; min-width: 200px; }
        .cert-score { font-size: 1.4rem; color: var(--primary-color); margin: 15px 0; }
        .cert-date { font-size: 0.9rem; color: #999; margin-top: 30px; }
        
        .close-btn {
            margin-top: 20px;
            background: #6c757d;
            padding: 8px 20px;
            border-radius: 5px;
        }

        @media (max-width: 600px) {
            .category-box { width: 42%; }
            .instrument { width: 50px; height: 50px; }
        }
    </style>
</head>
<body>

    <h1>樂器分類大挑戰</h1>
    <p class="instruction">用滑鼠或手指將樂器拖移到正確的分類框內</p>

    <!-- 樂器選擇區 -->
    <div id="instrument-pool">
        <div class="instrument" id="Violin"><img src="instruments/Violin.png" title="Violin"></div>
        <div class="instrument" id="Viola"><img src="instruments/Viola.png" title="Viola"></div>
        <div class="instrument" id="Cello"><img src="instruments/Cello.png" title="Cello"></div>
        <div class="instrument" id="Harp"><img src="instruments/Harp.png" title="Harp"></div>
        <div class="instrument" id="Guitar"><img src="instruments/Guitar.png" title="Guitar"></div>
        <div class="instrument" id="Flute"><img src="instruments/Flute.png" title="Flute"></div>
        <div class="instrument" id="Clarinet"><img src="instruments/Clarinet.png" title="Clarinet"></div>
        <div class="instrument" id="Saxophone"><img src="instruments/Saxophone.png" title="Saxophone"></div>
        <div class="instrument" id="Trumpet"><img src="instruments/Trumpet.png" title="Trumpet"></div>
        <div class="instrument" id="French Horn"><img src="instruments/French Horn.png" title="French Horn"></div>
        <div class="instrument" id="Xylophone"><img src="instruments/Xylophone.png" title="Xylophone"></div>
        <div class="instrument" id="Piano"><img src="instruments/Piano.png" title="Piano"></div>
        <div class="instrument" id="Accordion"><img src="instruments/Accordion.png" title="Accordion"></div>
    </div>

    <div class="categories-container">
        <div class="category-box">
            <h3>Strings 弦樂器</h3>
            <div class="drop-zone" id="Strings"></div>
        </div>
        <div class="category-box">
            <h3>Woodwinds 木管樂器</h3>
            <div class="drop-zone" id="Woodwinds"></div>
        </div>
        <div class="category-box">
            <h3>Brass 銅管樂器</h3>
            <div class="drop-zone" id="Brass"></div>
        </div>
        <div class="category-box">
            <h3>Percussion 打擊樂器</h3>
            <div class="drop-zone" id="Percussion"></div>
        </div>
        <div class="category-box">
            <h3>Keyboards 鍵盤樂器</h3>
            <div class="drop-zone" id="Keyboards"></div>
        </div>
    </div>

    <div class="controls">
        <button onclick="submitGame()">提交答案</button>
    </div>

    <div id="overlay">
        <div id="certificate">
            <h2>CERTIFICATE OF COMPLETION</h2>
            <p>這項榮譽授予</p>
            <div class="cert-name" id="display-name"></div>
            <p>成功完成樂器分類挑戰</p>
            <div class="cert-score" id="display-score"></div>
            <div class="cert-date" id="display-date"></div>
            <button class="close-btn" onclick="location.reload()">重新挑戰</button>
        </div>
    </div>

    <script>
        const answers = {
            "Strings": ["Violin", "Viola", "Cello", "Harp", "Guitar"],
            "Woodwinds": ["Flute", "Clarinet", "Saxophone"],
            "Brass": ["Trumpet", "French Horn"],
            "Percussion": ["Xylophone"],
            "Keyboards": ["Piano", "Accordion"]
        };

        // --- 隨機排序功能 ---
        function shuffleInstruments() {
            const pool = document.getElementById('instrument-pool');
            const items = Array.from(pool.children);
            
            // Fisher-Yates Shuffle 演算法
            for (let i = items.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                pool.appendChild(items[j]); // appendChild 會自動將原有元素移動到最後
                items.splice(j, 1);
                items.push(pool.lastChild);
            }
        }

        // 頁面載入後立即洗牌
        window.onload = shuffleInstruments;

        // --- 拖放邏輯 (含手機支援) ---
        let activeItem = null;
        let initialX, initialY;

        document.querySelectorAll('.instrument').forEach(item => {
            item.draggable = true;
            item.addEventListener('dragstart', e => e.dataTransfer.setData("text", item.id));

            item.addEventListener('touchstart', e => {
                activeItem = e.target.closest('.instrument');
                const touch = e.touches[0];
                initialX = touch.clientX - activeItem.offsetLeft;
                initialY = touch.clientY - activeItem.offsetTop;
                activeItem.style.zIndex = "1000";
            }, {passive: false});

            item.addEventListener('touchmove', e => {
                if (!activeItem) return;
                e.preventDefault();
                const touch = e.touches[0];
                activeItem.style.position = 'fixed';
                activeItem.style.left = (touch.clientX - initialX) + 'px';
                activeItem.style.top = (touch.clientY - initialY) + 'px';
            }, {passive: false});

            item.addEventListener('touchend', e => {
                if (!activeItem) return;
                activeItem.style.display = 'none';
                const dropTarget = document.elementFromPoint(
                    e.changedTouches[0].clientX, 
                    e.changedTouches[0].clientY
                );
                activeItem.style.display = 'block';
                activeItem.style.position = 'static';
                activeItem.style.zIndex = "10";

                let zone = dropTarget ? dropTarget.closest('.drop-zone, #instrument-pool') : null;
                if (zone) zone.appendChild(activeItem);
                activeItem = null;
            }, {passive: false});
        });

        document.querySelectorAll('.drop-zone, #instrument-pool').forEach(zone => {
            zone.addEventListener('dragover', e => e.preventDefault());
            zone.addEventListener('drop', e => {
                e.preventDefault();
                const id = e.dataTransfer.getData("text");
                zone.appendChild(document.getElementById(id));
            });
        });

        // --- 結算與證書 ---
        function submitGame() {
            const studentName = prompt("請輸入學生姓名:");
            if (!studentName) return;

            let correctCount = 0;
            const total = 13;

            for (const [cat, list] of Object.entries(answers)) {
                const zone = document.getElementById(cat);
                const items = zone.querySelectorAll('.instrument');
                items.forEach(inst => {
                    if (list.includes(inst.id)) {
                        correctCount++;
                        inst.style.border = "2px solid var(--success-color)";
                    } else {
                        inst.style.border = "2px solid var(--error-color)";
                    }
                });
            }

            const score = Math.round((correctCount / total) * 100);
            showCertificate(studentName, score, correctCount, total);
        }

        function showCertificate(name, score, count, total) {
            document.getElementById('display-name').innerText = name;
            document.getElementById('display-score').innerText = `得分: ${score}% (正確數: ${count} / ${total})`;
            document.getElementById('display-date').innerText = `完成日期: ${new Date().toLocaleDateString()}`;
            document.getElementById('overlay').style.display = 'flex';
        }
    </script>
</body>
</html>
