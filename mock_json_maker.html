<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>題庫 CSV 轉 JSON 工具</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 { color: #2c3e50; }
        .file-upload {
            margin: 20px 0;
            padding: 20px;
            border: 2px dashed #bdc3c7;
            text-align: center;
            border-radius: 5px;
            background-color: #f9fbfc;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover { background-color: #2980b9; }
        textarea {
            width: 100%;
            height: 300px;
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: monospace;
            box-sizing: border-box;
            resize: vertical;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📁 題庫 CSV 轉 JSON 工具</h2>
    <p>請選擇您的 CSV 檔案，程式會自動將其轉換為 JSON 格式，並為每題新增空白的<strong>「解析」</strong>欄位。</p>
    
    <div class="file-upload">
        <input type="file" id="csvFileInput" accept=".csv">
    </div>
    
    <button id="convertBtn">開始轉換並下載 JSON</button>
    
    <textarea id="jsonOutput" placeholder="轉換後的 JSON 預覽將顯示於此..." readonly></textarea>
</div>

<script>
    document.getElementById('convertBtn').addEventListener('click', function() {
        const fileInput = document.getElementById('csvFileInput');
        
        if (fileInput.files.length === 0) {
            alert('請先選擇一個 CSV 檔案！');
            return;
        }

        const file = fileInput.files[0];
        
        // 使用 PapaParse 處理 CSV 解析
        Papa.parse(file, {
            header: true,         // 自動將第一行(來源、答案等)當成 Key
            skipEmptyLines: true, // 忽略空白行
            complete: function(results) {
                const rawData = results.data;
                
                // 重新組合我們需要的資料格式，並加上「解析」
                const formattedData = rawData.map(row => {
                    return {
                        "來源": row["來源"] ? row["來源"].trim() : "",
                        "答案": row["答案"] ? row["答案"].trim() : "",
                        "題號": row["題號"] ? row["題號"].trim() : "",
                        "題目": row["題目"] ? row["題目"].trim() : "",
                        "選項A": row["選項A"] ? row["選項A"].trim() : "",
                        "選項B": row["選項B"] ? row["選項B"].trim() : "",
                        "選項C": row["選項C"] ? row["選項C"].trim() : "",
                        "選項D": row["選項D"] ? row["選項D"].trim() : "",
                        // 注意這裡相容您 CSV 中可能叫「標籤」或「新標籤」的欄位
                        "標籤": row["標籤"] ? row["標籤"].trim() : (row["新標籤"] ? row["新標籤"].trim() : ""),
                        "解析": ""  // 預留空白解析欄位
                    };
                });

                // 將物件轉換為格式化的 JSON 字串
                const jsonString = JSON.stringify(formattedData, null, 4);
                
                // 顯示預覽
                document.getElementById('jsonOutput').value = jsonString;

                // 觸發自動下載
                downloadJSON(jsonString, "questions_database.json");
            },
            error: function(err) {
                alert("解析 CSV 失敗：" + err.message);
            }
        });
    });

    // 產生檔案並下載的副程式
    function downloadJSON(jsonString, filename) {
        const blob = new Blob([jsonString], { type: "application/json;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        
        // 清理記憶體
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
