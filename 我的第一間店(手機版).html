<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>名店大師</title>
    <style>
        :root { --primary: #6366f1; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }
        body { font-family: "Noto Sans TC", sans-serif; background: #f0f2f5; margin: 0; padding: 8px; overflow-x: hidden; }
        .container { max-width: 1100px; margin: 0 auto; background: #fff; padding: 12px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        /* 頂部三欄排版 */
        .header-stats { display: grid; grid-template-columns: 0.8fr 1.2fr 1fr; gap: 6px; margin-bottom: 10px; }
        .stat-card { background: #f8fafc; padding: 8px 4px; border-radius: 12px; text-align: center; border: 1px solid #e2e8f0; display: flex; flex-direction: column; justify-content: center; }
        .stat-val { font-size: 16px; font-weight: 800; color: var(--primary); display: block; }
        .stat-hint { font-size: 9px; color: #64748b; transform: scale(0.85); line-height: 1.1; margin-top: 2px; }

        .speed-controls { margin-top: 3px; display: flex; gap: 2px; justify-content: center; }
        .btn-speed { 
            background: #e2e8f0; border: none; padding: 1px 4px; border-radius: 4px; 
            font-size: 10px; cursor: pointer; font-weight: bold;
        }
        .btn-speed.active { background: var(--primary); color: white; }

        #game-canvas {
            height: 160px; background: linear-gradient(to bottom, #bae6fd 0%, #e0f2fe 100%); 
            border-radius: 15px; position: relative; overflow: hidden;
            margin-bottom: 10px; border: 4px solid #f1f5f9;
        }
        .shop-building { position: absolute; bottom: 0px; left: 50%; transform: translateX(-50%); z-index: 100; }
        .main-store-icon { font-size: 100px; line-height: 1; }
        .sub-type-icon { 
            position: absolute; top: 10px; right: -15px; font-size: 30px; 
            background: white; border-radius: 50%; width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2); border: 2px solid var(--primary);
        }
        .road { position: absolute; bottom: 0; width: 100%; height: 40px; background: #94a3b8; border-top: 4px solid #64748b; z-index: 10; }
        .customer { position: absolute; font-size: 35px; bottom: 5px; left: 110%; z-index: 20; transition: left linear; }
        
        .coin-pop {
            position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
            z-index: 150; font-weight: 800; font-size: 20px; color: #f59e0b;
            animation: popUp 1s ease-out forwards;
        }
        @keyframes popUp {
            0% { opacity: 0; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -60px); }
        }

        /* 數據與筆記：左右並排 */
        .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .card { border: 1px solid #e5e7eb; padding: 8px; border-radius: 12px; background: #fafbfc; min-height: 90px; }
        .card h3 { margin: 0 0 5px 0; font-size: 13px; border-bottom: 1px solid #eee; }
        .card-content { font-size: 12px; line-height: 1.5; }

        .strategy-history-area { max-height: 60px; overflow-y: auto; font-size: 11px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.98); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 15px; border-radius: 20px; width: 92%; text-align: center; max-height: 95vh; overflow-y: auto; box-sizing: border-box; }
        
        /* 縮小決策格子 */
        .type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .btn-type, .btn-diff { background: white; border: 2px solid #e2e8f0; padding: 10px; border-radius: 12px; text-align: left; }
        .btn-type h4, .btn-diff h4 { margin: 0 0 3px 0; font-size: 15px; }
        .btn-type p, .btn-diff p { margin: 0; font-size: 11px; color: #475569; line-height: 1.2; }

        #buff-options { grid-template-columns: 1fr; gap: 6px; }
        .btn-buff-card {
            background: #fff; border: 2px solid #e5e7eb; border-radius: 10px; padding: 8px 12px;
            display: flex; align-items: center; justify-content: space-between; gap: 5px;
        }
        .buff-name-label { font-size: 14px; font-weight: 800; }
        .buff-desc-label { font-size: 11px; color: #64748b; flex: 1; text-align: left; margin-left: 5px; }
        .buff-cost-label { font-size: 12px; font-weight: 800; color: var(--danger); background: #fee2e2; padding: 2px 6px; border-radius: 6px; }

        .btn-main { background: linear-gradient(135deg, #6366f1, #4338ca); color: white; width: 100%; padding: 12px; border-radius: 10px; font-size: 16px; font-weight: bold; border: none; cursor: pointer; }
        
        .log { background: #0f172a; color: #cbd5e1; padding: 10px; border-radius: 12px; height: 80px; overflow-y: auto; font-family: monospace; font-size: 12px; border-left: 5px solid var(--primary); margin-top: 10px; }
        .status-tag { display: inline-block; background: #fee2e2; color: #991b1b; padding: 2px 6px; border-radius: 4px; margin: 1px; font-size: 10px; }

        .insufficient-funds-toast {
            position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(239, 68, 68, 0.95); color: white; padding: 15px 30px;
            border-radius: 15px; font-size: 20px; font-weight: 900; z-index: 2000;
            animation: fadeOutUp 1.5s ease-out forwards;
        }
        @keyframes fadeOutUp {
            0% { opacity: 0; transform: translate(-50%, -20%); }
            100% { opacity: 0; transform: translate(-50%, -80%); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-stats">
        <div class="stat-card">
            📅 天數 <span class="stat-val" id="ui-day">1</span>
            <div class="speed-controls">
                <button class="btn-speed active" id="speed-1" onclick="setSpeed(1)">1x</button>
                <button class="btn-speed" id="speed-2" onclick="setSpeed(2)">2x</button>
                <button class="btn-speed" id="speed-10" onclick="setSpeed(10)">10x</button>
            </div>
        </div>
        <div class="stat-card">
            💰 <span class="stat-val" id="ui-money">50000</span>
            <span id="ui-shop-name" style="font-size:11px; font-weight:bold; color:var(--success)">-</span>
        </div>
        <div class="stat-card">
            💸 開銷 <span class="stat-val" id="ui-expense">0</span>
            <span class="stat-hint" id="ui-expense-hint">店租 0 + 人事 0</span>
        </div>
    </div>

    <div id="game-canvas">
        <div class="shop-building" id="shop-node" style="display:none">
            <span class="main-store-icon">🏪</span>
            <div class="sub-type-icon" id="shop-sub-icon">🥤</div>
        </div>
        <div class="road"></div>
    </div>

    <div class="setup-grid">
        <div class="card">
            <h3>📊 營運數據</h3>
            <div class="card-content">
                單價: <b id="ui-price" style="color:var(--primary)">0</b><br>
                成本: <b id="ui-cost" style="color:var(--danger)">0</b><br>
                客流: <b id="ui-demand-range" style="color:var(--warning)">0~0</b>
            </div>
        </div>
        <div class="card">
            <h3>📜 經營筆記</h3>
            <div class="strategy-history-area">
                <div id="history-buffs-inline"></div>
                <div id="history-events-inline"></div>
            </div>
        </div>
    </div>

    <button class="btn-main" id="btn-start" onclick="startDay()">開店!</button>
    <div class="log" id="game-log"></div>
</div>

<div id="setup-modal" class="modal" style="display:flex">
    <div class="modal-content" id="setup-content">
        <h2 style="font-size: 20px;">第一步：選擇你的事業起源</h2>
        <div class="type-grid">
            <button class="btn-type" onclick="chooseDiff('drink')"><h4>🥤 飲料店</h4><p>客流量極大、低單價、低成本。</p></button>
            <button class="btn-type" onclick="chooseDiff('bakery')"><h4>🥐 烘焙坊</h4><p>低成本、需求穩定、中等人事費。</p></button>
            <button class="btn-type" onclick="chooseDiff('game')"><h4>🎮 電玩店</h4><p>高單價、高利潤、需求不穩定。</p></button>
            <button class="btn-type" onclick="chooseDiff('hobby')"><h4>🧸 玩具店</h4><p>高單價、需求穩定、高人事費。</p></button>
        </div>
    </div>
</div>

<div id="settle-modal" class="modal">
    <div class="modal-content">
        <h2 id="settle-title" style="font-size: 22px; margin-bottom: 8px;">📈 今日結算</h2>
        <div id="settle-report" style="font-size:14px; background:#f8fafc; padding:10px; border-radius:12px; line-height:1.4; border: 1px solid #e2e8f0;"></div>
        <h3 style="font-size: 16px; color: var(--primary); margin: 10px 0 5px 0;">💡 每日投資</h3>
        <div id="buff-options" class="type-grid"></div>
        <button class="btn-main" style="background:#94a3b8; font-size:14px; margin-top: 10px; width: 50%;" onclick="checkEventAfterSettle()">跳過投資</button>
    </div>
</div>

<div id="event-modal" class="modal">
    <div class="modal-content">
        <h2 id="event-title" style="color:var(--danger); font-size: 20px;">🔥 重大經營決策</h2>
        <p id="event-desc" style="font-size:13px; padding:10px; background:#fff1f2; border-radius:10px;"></p>
        <div id="event-options" class="type-grid" style="grid-template-columns: 1fr;"></div>
    </div>
</div>

<script>
    const SHOP_DATA = {
        drink: { name: "飲料店", icon: "🥤", price: 65, cost: 22, demandMin: 36, demandMax: 55, personnel: 2400 },
        bakery: { name: "烘焙坊", icon: "🥐", price: 180, cost: 55, demandMin: 18, demandMax: 22, personnel: 3000 },
        game: { name: "電玩店", icon: "🎮", price: 1800, cost: 1100, demandMin: 1, demandMax: 5, personnel: 2800 },
        hobby: { name: "玩具店", icon: "🧸", price: 900, cost: 500, demandMin: 6, demandMax: 8, personnel: 3600 }
    };

    const BUFF_POOL = [
        { name: "📰 廣告", desc: "客流+10%", buy: 4000, dRate: 0.10 },
        { name: "🤖 自動化", desc: "成本-10%", buy: 3500, cRate: -0.10 },
        { name: "💎 會員", desc: "客流+5%,售價+10%", buy: 4000, dRate: 0.05, pRate: 0.10 },
        { name: "🎫 禮券", desc: "客流+15%,售價-15%", buy: 2500, dRate: 0.15, pRate: -0.15 }
    ];

    const BIG_EVENTS = [
        {
            title: "⚖️ 工資調漲",
            desc: "政府宣布調高時薪（持續 5 天）。",
            options: [
                { text: "精簡人力 (人事+20%, 客流-20%)", impact: { personnelRate: 0.2, dRate: -0.20, log: "精簡人力", duration: 5 } },
                { text: "全面調薪 (人事+40%, 售價+10%)", impact: { pRate: 0.10, personnelRate: 0.4, log: "全面調薪", duration: 5 } }
            ]
        },
        {
            title: "🌀 颱風侵襲",
            desc: "氣象局發布警報，影響明日。",
            options: [
                { text: "防颱加固 (支出1000, 客流-40%)", impact: { rentAdd: 1000, dRate: -0.4, log: "防颱加固", duration: 1 } },
                { text: "停業一天", impact: { dRate: -10.0, personnelRate: -10.0, log: "停業避災", duration: 1 } }
            ]
        }
    ];
    
    let state = {
        shop: null, money: 50000, day: 1, 
        activeBuffs: [], historyEvents: [],
        difficulty: 'normal', eventCycle: 5,
        rent: 1000, personnel: 2400,
        gameSpeed: 1, dailyRev: 0, dailySold: 0
    };

    function chooseDiff(key) {
        state.shop = { ...SHOP_DATA[key] };
        document.getElementById('setup-content').innerHTML = `<h2 style="font-size:20px;">⚙️ 第二步：選擇經營難度</h2>
            <div class="diff-grid">
                <button class="btn-diff" onclick="finalize('easy', 120000, 800, 7)"><h4>🟢 簡單</h4><p>資金充足 ($12萬)<br>店租: $800 / 天<br><b>每 7 天</b>一事件</p></button>
                <button class="btn-diff" onclick="finalize('normal', 60000, 1000, 5)"><h4>🟡 標準</h4><p>創業資金 ($6萬)<br>店租: $1,000 / 天<br><b>每 5 天</b>一事件</p></button>
                <button class="btn-diff" onclick="finalize('hard', 30000, 1200, 3)"><h4>🔴 困難</h4><p>資金吃緊 ($3萬)<br>店租: $1,200 / 天<br><b>每 3 天</b>一事件</p></button>
            </div>`;
    }

    function finalize(diff, m, r, cycle) {
        state.difficulty = diff; state.money = m; state.rent = r; state.eventCycle = cycle;
        state.personnel = state.shop.personnel; 
        document.getElementById('setup-modal').style.display = 'none';
        document.getElementById('shop-node').style.display = 'flex';
        document.getElementById('shop-sub-icon').textContent = state.shop.icon;
        document.getElementById('ui-shop-name').textContent = state.shop.name;
        updateUI();
        log("遊戲開始！祝您經營順利。");
    }

    function calculateCurrentStats() {
        let p = state.shop.price, c = state.shop.cost;
        let baseRent = state.rent, basePersonnel = state.personnel;
        let pMul = 1.0, cMul = 1.0, dMul = 1.0, persMul = 1.0, rentAdd = 0;

        [...state.activeBuffs, ...state.historyEvents].forEach(item => {
            if(item.pRate) pMul *= (1 + item.pRate);
            if(item.cRate) cMul *= (1 + item.cRate);
            if(item.dRate) dMul *= (1 + item.dRate);
            if(item.personnelRate) persMul *= (1 + item.personnelRate);
            if(item.rentAdd) rentAdd += item.rentAdd;
        });

        return { 
            price: Math.max(1, Math.floor(p * pMul)), cost: Math.max(1, Math.floor(c * cMul)), 
            expense: Math.max(0, Math.floor(basePersonnel * persMul) + baseRent + rentAdd),
            Statrent: baseRent + rentAdd, StatPersonnel: Math.floor(basePersonnel * persMul), dRate: dMul - 1
        };
    }

    function updateUI() {
        const stats = calculateCurrentStats();
        document.getElementById('ui-money').textContent = Math.floor(state.money).toLocaleString();
        document.getElementById('ui-day').textContent = state.day;
        document.getElementById('ui-price').textContent = stats.price;
        document.getElementById('ui-cost').textContent = stats.cost;
        document.getElementById('ui-expense').textContent = Math.floor(stats.expense);
        document.getElementById('ui-expense-hint').textContent = `租金:${stats.Statrent} 人事:${stats.StatPersonnel}`;
        
        const minD = Math.max(0, Math.floor(state.shop.demandMin * (1 + stats.dRate)));
        const maxD = Math.max(0, Math.floor(state.shop.demandMax * (1 + stats.dRate)));
        document.getElementById('ui-demand-range').textContent = `${minD}~${maxD}`;
        
        document.getElementById('history-buffs-inline').innerHTML = state.activeBuffs.map(b => `<span class="status-tag">${b.name}</span>`).join('');
        document.getElementById('history-events-inline').innerHTML = state.historyEvents.map(e => `<div style="color:#ef4444; font-size:10px;">• ${e.log}</div>`).join('');
    }

    async function startDay() {
        document.getElementById('btn-start').disabled = true;
        const stats = calculateCurrentStats();
        const range = state.shop.demandMax - state.shop.demandMin + 1;
        const baseDemand = Math.floor(Math.random() * range) + state.shop.demandMin;
        const finalCount = Math.max(0, Math.floor(baseDemand * (1 + stats.dRate)));
        
        state.dailyRev = 0; state.dailySold = 0;
        await playBusinessAnimation(finalCount, stats.price);
        
        let totalCost = (state.dailySold * stats.cost) + stats.expense;
        state.money -= totalCost;
        showSettlement(state.dailySold, state.dailyRev, totalCost, state.dailyRev - totalCost, state.money);
    }

    async function playBusinessAnimation(total, currentPrice) {
        return new Promise(resolve => {
            const canvas = document.getElementById('game-canvas');
            let spawned = 0; const s = state.gameSpeed;
            function spawn() {
                if (spawned >= total) return;
                spawned++;
                const c = document.createElement('div');
                c.className = 'customer'; c.textContent = '🚶';
                canvas.appendChild(c);
                setTimeout(() => {
                    c.style.transition = `left ${3000/s}ms linear`; c.style.left = "43%";
                    setTimeout(() => {
                        const coin = document.createElement('div');
                        coin.className = 'coin-pop'; coin.innerHTML = `+${currentPrice}`;
                        document.getElementById('shop-node').appendChild(coin);
                        state.money += currentPrice; state.dailyRev += currentPrice; state.dailySold++;
                        document.getElementById('ui-money').textContent = Math.floor(state.money).toLocaleString();
                        setTimeout(() => {
                            c.style.left = "-20%"; setTimeout(() => { coin.remove(); c.remove(); }, 3000/s);
                        }, 800/s);
                    }, 3000/s);
                }, 50);
                if (spawned < total) setTimeout(spawn, (8000/total)/s);
            }
            spawn();
            setTimeout(resolve, (12000/s));
        });
    }

    function showSettlement(count, rev, cost, profit, money) {
        if(state.day >= 30) { checkEventAfterSettle(); return; }
        const modal = document.getElementById('settle-modal');
        document.getElementById('settle-report').innerHTML = `銷量:${count} | 營收:+${rev} | 支出:-${Math.floor(cost)}<br><b>今日利潤: $${Math.floor(profit)}</b>`;
        log(`第 ${state.day} 天：銷量 ${count}，利潤 ${Math.floor(profit)}`);
        
        const optBox = document.getElementById('buff-options');
        optBox.innerHTML = '';
        [...BUFF_POOL].sort(() => 0.5-Math.random()).slice(0,3).forEach(b => {
            const btn = document.createElement('div');
            btn.className = 'btn-buff-card';
            btn.innerHTML = `<div class="buff-name-label">${b.name}</div><div class="buff-desc-label">${b.desc}</div><div class="buff-cost-label">$${b.buy}</div>`;
            btn.onclick = () => {
                if(state.money < b.buy) { showWarning("⚠️ 資金不足"); return; }
                state.money -= b.buy; state.activeBuffs.push(b); updateUI(); checkEventAfterSettle();
            };
            optBox.appendChild(btn);
        });
        modal.style.display = 'flex';
    }

    function checkEventAfterSettle() {
        document.getElementById('settle-modal').style.display = 'none';
        if (state.day < 30 && state.day % state.eventCycle === 0) triggerBigEvent(); else nextDay();
    }

    function triggerBigEvent() {
        const ev = BIG_EVENTS[Math.floor(Math.random() * BIG_EVENTS.length)];
        document.getElementById('event-title').textContent = `🔥 第 ${state.day} 天 ${ev.title}`;
        document.getElementById('event-desc').textContent = ev.desc;
        const optBox = document.getElementById('event-options');
        optBox.innerHTML = '';
        ev.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn-main'; btn.textContent = opt.text;
            btn.onclick = () => {
                state.historyEvents.push({ ...opt.impact });
                document.getElementById('event-modal').style.display = 'none';
                log(`[重大事件] ${opt.impact.log}`); updateUI(); nextDay();
            };
            optBox.appendChild(btn);
        });
        document.getElementById('event-modal').style.display = 'flex';
    }

    function nextDay() {
        state.historyEvents.forEach(e => { if(e.duration !== undefined) e.duration--; });
        state.historyEvents = state.historyEvents.filter(e => e.duration === undefined || e.duration > -1);
        state.day++; updateUI();
        if (state.day > 30 || state.money <= 0) {
            log(state.money <= 0 ? "<b>資產耗盡，經營結束。</b>" : "<b>30天經營圓滿結束！</b>");
            document.getElementById('btn-start').style.display = 'none';
        } else {
            document.getElementById('btn-start').disabled = false;
        }
    }

    function setSpeed(speed) {
        state.gameSpeed = speed;
        document.querySelectorAll('.btn-speed').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`speed-${speed}`).classList.add('active');
    }

    function showWarning(text) {
        const toast = document.createElement('div');
        toast.className = 'insufficient-funds-toast'; toast.textContent = text;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 1500);
    }

    function log(msg) {
        const l = document.getElementById('game-log');
        const entry = document.createElement('div');
        entry.innerHTML = `[Day ${state.day}] ${msg}`;
        l.prepend(entry); // 最新的訊息放在最上面
    }
</script>
</body>
</html>
