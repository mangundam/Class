<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名店大師</title>
    <link rel="stylesheet" href="myShop_desktop.css" media="screen and (min-width: 769px)">
	<link rel="stylesheet" href="myShop_phone.css" media="screen and (max-width: 768px)">
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">
    <div class="header-stats">
    <div class="stat-card">
        <span class="stat-label">📅 天數</span>
        <span class="stat-val" id="ui-day">-</span>
        <div class="speed-controls">
            <button class="btn-speed active" id="speed-1" onclick="setSpeed(1)">1x</button>
			<button class="btn-speed" id="speed-2" onclick="setSpeed(2)">2x</button>
            <button class="btn-speed" id="speed-10" onclick="setSpeed(10)">10x</button>

        </div>
				<button class="btn-reset" onclick="resetGame()">重開一局</button>

    </div>
    <div class="stat-card">
        <span class="stat-label">💰 持有現金</span>
        <span class="stat-val" id="ui-money">-</span>
        <hr style="width:100%; border:0; border-top:1px solid #ddd; margin:4px 0">
        <span id="ui-shop-name" style="font-weight:bold; color:var(--success)">-</span>
    </div>
    <div class="stat-card">
        <span class="stat-label">💸 固定開銷</span>
        <span class="stat-val" id="ui-expense" style="color:var(--danger)">-</span>
        <span class="stat-hint" id="ui-expense-hint"></span>
    </div>
</div>

    <div id="game-canvas">
		<div class="road"></div>
		
		<div id="sub-stores-container" class="sub-stores-container"></div>
		
		<div class="shop-building" id="shop-node" style="display:none">
			<span class="main-store-icon">🏪</span>
			<div class="sub-type-icon" id="shop-sub-icon">🥤</div>
		</div>
	</div>
    <button class="btn-main" id="btn-start" onclick="startDay()">開店!</button>

    <div class="setup-grid">
        <div class="card">
            <h3>📊 營運數據 </h3>
			<div style="line-height: 1.8;">
                單價：<b id="ui-price" style="color:var(--primary)">-</b> 元<br>
                成本：<b id="ui-cost" style="color:var(--danger)">-</b> 元<br>
                預估客流：<b id="ui-demand-range" style="color:var(--warning)">-</b> 人
            </div>
        </div>
		<div class="card">
			<h3 style="margin-top:0">📜 經營筆記
				<button onclick="showEffectPanel()" class="Buff-detail" style="">查看詳細加成</button>
			</h3>
			<div class="strategy-history-area">
				<div id="active-buffs-list" style="margin-bottom: 10px;">
					<b style="color:var(--primary)">🎯 當前策略：</b>
					<div id="history-buffs-inline" style="display: flex; flex-wrap: wrap; gap: 4px; margin-top:5px;">-</div>
				</div>
				<div id="event-impact-list">
					<b style="color:var(--danger)">⚠️ 事件影響：</b>
					<div id="history-events-inline" style="margin-top:5px;">-</div>
				</div>
			</div>
		</div>
    </div>
	
	<div id="chart-container" class="card" style="display:none; margin-top:15px; background:white;">
		<canvas id="businessChart"></canvas>
	</div>
    <div class="log" id="game-log" style="margin-top:15px;"></div>
</div>

<div id="setup-modal" class="modal" style="display:flex">
    <div class="modal-content" id="setup-content">
        <h2 style="font-size: 28px;">🏬 第一步：選擇你的事業起源</h2>
        <div class="type-grid">
            <button class="btn-type" onclick="chooseDiff('drink')"><h4>🥤 飲料店</h4><p>客流量極大、低單價、低成本。</p></button>
            <button class="btn-type" onclick="chooseDiff('bakery')"><h4>🥐 烘焙坊</h4><p>低成本、需求穩定、中等人事費。</p></button>
            <button class="btn-type" onclick="chooseDiff('game')"><h4>🎮 電玩店</h4><p>高單價、高利潤、需求不穩定。</p></button>
            <button class="btn-type" onclick="chooseDiff('hobby')"><h4>🧸 玩具店</h4><p>高單價、需求穩定、高人事費。</p></button>
        </div>
    </div>
</div>

<div id="settle-modal" class="modal">
    <div class="modal-content">
        <h2 id="settle-title" style="font-size: 32px; margin-bottom: 15px;">📈 今日結算報表</h2>
        <div id="settle-report"></div>
		<div class="settle-stats-container">
			<div class="settle-stat-card card-ops">
				<div class="settle-grid-item border-right">
					<small>當前單價</small>
					<b id="settle-ui-price">-</b>
				</div>
				<div class="settle-grid-item border-right">
					<small>成本</small>
					<b id="settle-ui-cost">-</b>
				</div>
				<div class="settle-grid-item">
					<small>預估客流</small>
					<b id="settle-ui-demand">-</b>
				</div>
			</div>

			<div class="settle-stat-card card-exp">
				<div class="settle-grid-item border-right">
					<small>每日租金</small>
					<b id="settle-ui-rent">-</b>
				</div>
				<div class="settle-grid-item">
					<small>人事</small>
					<b id="settle-ui-personnel">-</b>
				</div>
			</div>
		</div>
        <hr style="border: 1px solid #f3f4f6; margin-bottom: 5px;">
        <h3 style="color: var(--primary);">💡 每日投資決策
			<button onclick="showEffectPanel()" class="Buff-detail" style="">查看詳細加成</button>
		</h3>
        <div class="type-grid" id="buff-options" style="grid-template-columns: repeat(3, 1fr); gap: 15px;"></div>
        <button class="btn-main" style="background:#94a3b8; font-size:18px; margin-top: 30px; width: 45%;" onclick="checkEventAfterSettle()">跳過投資</button>
    </div>
</div>

<div id="event-modal" class="modal">
    <div class="modal-content">
        <h2 id="event-title" style="color:var(--danger); font-size: 30px;">🔥 重大經營決策</h2>
        <p id="event-desc" style="font-size:17px; padding:20px; background:#fff1f2; border-radius:15px; line-height:1.5;"></p>
        <div id="event-options" class="type-grid" style="grid-template-columns: 1fr 1fr;"></div>
    </div>
</div>

<div id="effect-modal" class="modal">
    <div class="modal-content" style="max-width: 500px;">
        <h2 style="color:var(--primary); margin-bottom: 15px;">🔍 當前效果總計</h2>
        <div id="effect-detail-list" style="text-align: left; max-height: 400px; overflow-y: auto;">
            </div>
        <button class="btn-main" style="margin-top: 20px;" onclick="document.getElementById('effect-modal').style.display='none'">關閉面板</button>
    </div>
</div>
<script src="myShop_script.js"></script>
</body>
</html>
