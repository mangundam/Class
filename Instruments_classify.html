<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>樂器分類大挑戰</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #007bff;
            --success-color: #28a745;
            --error-color: #dc3545;
            --bg-color: #f0f4f8;
        }

        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            margin: 0;
            touch-action: manipulation;
        }

        h1 { color: var(--primary-color); margin-bottom: 5px; font-size: 1.5rem; }
        .instruction { color: #666; margin-bottom: 20px; font-size: 0.9rem; }

        #instrument-pool {
            width: 95%; max-width: 1000px; min-height: 100px;
            background: #fff; border: 2px dashed #999; border-radius: 10px;
            display: flex; flex-wrap: wrap; justify-content: center;
            align-items: center; padding: 10px; margin-bottom: 20px;
        }

        .instrument {
            width: 60px; height: 60px; margin: 8px; cursor: grab;
            background: #fff; border: 1px solid #ddd; border-radius: 8px;
            touch-action: none; position: relative; z-index: 10;
        }

        .instrument img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }

        .categories-container {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 15px; width: 100%; max-width: 1200px;
        }

        .category-box {
            width: 160px; min-height: 180px; background: #e9ecef;
            border: 2px solid #ced4da; border-radius: 12px;
            display: flex; flex-direction: column; padding: 8px;
        }

        .category-box h3 {
            margin: 0 0 10px 0; color: #495057; font-size: 0.9rem;
            border-bottom: 2px solid #dee2e6; text-align: center; padding-bottom: 5px;
        }

        .drop-zone { flex-grow: 1; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 5px; min-height: 100px; }

        .controls { margin: 30px 0; }
        button {
            padding: 12px 40px; font-size: 1.1rem; background-color: var(--accent-color);
            color: white; border: none; border-radius: 25px; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* 彈出視窗共同樣式 */
        #overlay, #input-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center;
        }

        .modal-content {
            background: #fff; width: 85%; max-width: 400px; padding: 30px;
            border-radius: 15px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .modal-content input {
            width: 80%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem;
        }

        /* 證書樣式 */
        #certificate {
            background: #fff; width: 90%; max-width: 500px; padding: 40px;
            border: 10px double #c9ad6a; border-radius: 5px; text-align: center; position: relative;
        }

        #certificate h2 { font-family: "Times New Roman", serif; color: #846733; margin-top: 0; }
        .cert-name { font-size: 1.8rem; border-bottom: 2px solid #333; margin: 10px auto; width: fit-content; min-width: 150px; }
        .cert-info { font-size: 1.1rem; color: #555; margin-bottom: 15px; }
        .cert-score { font-size: 1.4rem; color: var(--primary-color); margin: 15px 0; font-weight: bold; }
        .cert-date { font-size: 0.9rem; color: #999; margin-top: 20px; }

        @media (max-width: 600px) {
            .category-box { width: 42%; }
            .instrument { width: 50px; height: 50px; }
        }
    </style>
</head>
<body>

    <h1>樂器分類大挑戰</h1>
    <p class="instruction">用滑鼠或手指將樂器拖移到正確的分類框內</p>

    <div id="instrument-pool">
        <!-- 圖片連結已更新 -->
        <div class="instrument" id="Violin"><img src="https://mangundam.github.io/Class/instruments/Violin.png"></div>
        <div class="instrument" id="Viola"><img src="https://mangundam.github.io/Class/instruments/Viola.png"></div>
        <div class="instrument" id="Cello"><img src="https://mangundam.github.io/Class/instruments/Cello.png"></div>
        <div class="instrument" id="Harp"><img src="https://mangundam.github.io/Class/instruments/Harp.png"></div>
        <div class="instrument" id="Guitar"><img src="https://mangundam.github.io/Class/instruments/Guitar.png"></div>
        <div class="instrument" id="Flute"><img src="https://mangundam.github.io/Class/instruments/Flute.png"></div>
        <div class="instrument" id="Clarinet"><img src="https://mangundam.github.io/Class/instruments/Clarinet.png"></div>
        <div class="instrument" id="Saxophone"><img src="https://mangundam.github.io/Class/instruments/Saxophone.png"></div>
        <div class="instrument" id="Trumpet"><img src="https://mangundam.github.io/Class/instruments/Trumpet.png"></div>
        <div class="instrument" id="French Horn"><img src="https://mangundam.github.io/Class/instruments/French%20Horn.png"></div>
        <div class="instrument" id="Xylophone"><img src="https://mangundam.github.io/Class/instruments/Xylophone.png"></div>
        <div class="instrument" id="Piano"><img src="https://mangundam.github.io/Class/instruments/Piano.png"></div>
        <div class="instrument" id="Accordion"><img src="https://mangundam.github.io/Class/instruments/Accordion.png"></div>
    </div>

    <div class="categories-container">
        <div class="category-box"><h3>Strings 弦樂器</h3><div class="drop-zone" id="Strings"></div></div>
        <div class="category-box"><h3>Woodwinds 木管樂器</h3><div class="drop-zone" id="Woodwinds"></div></div>
        <div class="category-box"><h3>Brass 銅管樂器</h3><div class="drop-zone" id="Brass"></div></div>
        <div class="category-box"><h3>Percussion 打擊樂器</h3><div class="drop-zone" id="Percussion"></div></div>
        <div class="category-box"><h3>Keyboards 鍵盤樂器</h3><div class="drop-zone" id="Keyboards"></div></div>
    </div>

    <div class="controls">
        <button onclick="openInputModal()">提交答案</button>
    </div>

    <!-- 姓名學號輸入視窗 -->
    <div id="input-overlay">
        <div class="modal-content">
            <h3>請輸入資料</h3>
            <input type="text" id="student-id" placeholder="學號 (例如: 10101)">
            <input type="text" id="student-name" placeholder="姓名">
            <br><br>
            <button onclick="confirmAndSubmit()" style="padding: 8px 25px; font-size: 1rem;">確認送出</button>
        </div>
    </div>

    <!-- 證書視窗 -->
    <div id="overlay">
        <div id="certificate">
            <h2>CERTIFICATE OF COMPLETION</h2>
            <p>這項榮譽授予</p>
            <div class="cert-name" id="display-name"></div>
            <div class="cert-info" id="display-id"></div>
            <p>成功完成樂器分類挑戰</p>
            <div class="cert-score" id="display-score"></div>
            <div id="upload-status" style="font-size: 0.8rem; color: #666;">正在同步至雲端...</div>
            <div class="cert-date" id="display-date"></div>
            <button onclick="location.reload()" style="margin-top:20px; background:#6c757d; padding:8px 20px;">重新挑戰</button>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbx__xGleQlRaeKWyZf-y9g-lGVaZX3wfCYlUdMoHEFGktICESMyWl3dyRqDdd9mHiVDCA/exec"; // 請更換為您的 GAS 網址

        const answers = {
            "Strings": ["Violin", "Viola", "Cello", "Harp", "Guitar"],
            "Woodwinds": ["Flute", "Clarinet", "Saxophone"],
            "Brass": ["Trumpet", "French Horn"],
            "Percussion": ["Xylophone"],
            "Keyboards": ["Piano", "Accordion"]
        };

        // 隨機洗牌
        window.onload = () => {
            const pool = document.getElementById('instrument-pool');
            const items = Array.from(pool.children);
            for (let i = items.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                pool.appendChild(items[j]);
            }
        };

        // 拖放與觸控邏輯 (省略重複部分以保持整潔，功能不變)
        let activeItem = null, initialX, initialY;
        document.querySelectorAll('.instrument').forEach(item => {
            item.draggable = true;
            item.addEventListener('dragstart', e => e.dataTransfer.setData("text", item.id));
            item.addEventListener('touchstart', e => {
                activeItem = e.target.closest('.instrument');
                const t = e.touches[0]; initialX = t.clientX - activeItem.offsetLeft; initialY = t.clientY - activeItem.offsetTop;
                activeItem.style.zIndex = "1000";
            }, {passive: false});
            item.addEventListener('touchmove', e => {
                if (!activeItem) return; e.preventDefault();
                const t = e.touches[0]; activeItem.style.position = 'fixed';
                activeItem.style.left = (t.clientX - initialX) + 'px'; activeItem.style.top = (t.clientY - initialY) + 'px';
            }, {passive: false});
            item.addEventListener('touchend', e => {
                if (!activeItem) return; activeItem.style.display = 'none';
                const target = document.elementFromPoint(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
                activeItem.style.display = 'block'; activeItem.style.position = 'static';
                const zone = target ? target.closest('.drop-zone, #instrument-pool') : null;
                if (zone) zone.appendChild(activeItem); activeItem = null;
            }, {passive: false});
        });
        document.querySelectorAll('.drop-zone, #instrument-pool').forEach(zone => {
            zone.addEventListener('dragover', e => e.preventDefault());
            zone.addEventListener('drop', e => { e.preventDefault(); zone.appendChild(document.getElementById(e.dataTransfer.getData("text"))); });
        });

        function openInputModal() { document.getElementById('input-overlay').style.display = 'flex'; }

        function confirmAndSubmit() {
            const sid = document.getElementById('student-id').value;
            const sname = document.getElementById('student-name').value;
            if (!sid || !sname) { alert("請完整填寫學號與姓名"); return; }

            document.getElementById('input-overlay').style.display = 'none';
            calculateAndDisplay(sid, sname);
        }

        function calculateAndDisplay(sid, sname) {
            let correct = 0;
            const total = 13;
            for (const [cat, list] of Object.entries(answers)) {
                const zoneItems = document.getElementById(cat).querySelectorAll('.instrument');
                zoneItems.forEach(inst => {
                    if (list.includes(inst.id)) { correct++; inst.style.border = "2px solid var(--success-color)"; }
                    else { inst.style.border = "2px solid var(--error-color)"; }
                });
            }

            const score = Math.round((correct / total) * 100);
            
            // 顯示證書
            document.getElementById('display-name').innerText = sname;
            document.getElementById('display-id').innerText = "學號: " + sid;
            document.getElementById('display-score').innerText = `得分: ${score}% (${correct} / ${total})`;
            document.getElementById('display-date').innerText = "完成日期: " + new Date().toLocaleDateString();
            document.getElementById('overlay').style.display = 'flex';

            // 傳送資料到後台
            sendToBackend(sid, sname, score, correct);
        }

        function sendToBackend(sid, sname, score, correct) {
            const data = { id: sid, name: sname, score: score, count: correct, date: new Date().toLocaleString() };
            
            fetch(GAS_URL, {
                method: "POST",
                mode: "no-cors", // GAS 限制通常需使用 no-cors
                cache: "no-cache",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            }).then(() => {
                document.getElementById('upload-status').innerText = "雲端同步成功";
                document.getElementById('upload-status').style.color = "green";
            }).catch(err => {
                document.getElementById('upload-status').innerText = "同步失敗，請截圖保存";
                document.getElementById('upload-status').style.color = "red";
            });
        }
    </script>
</body>
</html>
