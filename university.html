<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>大學博覽會 - 集章活動</title>
    <!-- 換成更穩定的 CDN 網址 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        body { font-family: "微軟正黑體", sans-serif; background: #f0f2f5; margin: 0; padding: 0; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        h1, h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        .btn { display: block; width: 100%; padding: 12px; background: #4CAF50; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; text-align: center; margin-top: 10px; }
        .btn:disabled { background: #aaa; cursor: not-allowed; }
        
        .stamp-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px; }
        .stamp-box { border: 2px dashed #aaa; border-radius: 10px; height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; background: #fafafa; }
        .stamp-box.completed { border-style: solid; border-color: #e53935; background: #fff; }
        .stamp-title { font-weight: bold; font-size: 14px; text-align: center; z-index: 2; margin-bottom: 5px; }
        .school-name { font-size: 12px; color: #555; text-align: center; z-index: 2; padding: 0 5px; }
        .stamp-img { position: absolute; width: 80px; height: 80px; object-fit: contain; opacity: 0.8; z-index: 1; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 999; justify-content: center; align-items: center; }
        .modal-content { background: #fff; padding: 20px; border-radius: 10px; width: 90%; max-width: 400px; text-align: center; }
        .modal-content h3 { margin-top: 0; }
        .btn-cancel { background: #f44336; margin-top: 10px; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; }
        
        /* 移除 loginSection 的隱藏，讓畫面至少出得來 */
        #stampSection, #submitSection { display: none; }
        #errorDisplay { display: none; background: #ffebee; color: #c62828; padding: 15px; margin-bottom: 20px; border-radius: 5px; border: 1px solid #ef9a9a; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 錯誤訊息顯示區 -->
        <div id="errorDisplay"></div>

        <!-- 登入 / 註冊畫面 (預設顯示) -->
        <div id="loginSection">
            <h1>博覽會集章活動</h1>
            <div class="form-group">
                <label>班級</label>
                <select id="userClass">
                    <option value="">請選擇班級...</option>
                    <option value="普一忠">普一忠</option><option value="普一孝">普一孝</option><option value="普一仁">普一仁</option><option value="普一愛">普一愛</option>
                    <option value="商一壹">商一壹</option><option value="觀一壹">觀一壹</option><option value="多一壹">多一壹</option><option value="多一貳">多一貳</option>
                    <option value="英一壹">英一壹</option><option value="英一貳">英一貳</option><option value="日一壹">日一壹</option><option value="日一貳">日一貳</option>
                    <option value="普二忠">普二忠</option><option value="普二孝社">普二孝社</option><option value="普二孝自">普二孝自</option>
                    <option value="商二壹">商二壹</option><option value="觀二壹">觀二壹</option><option value="多二壹">多二壹</option><option value="英二壹">英二壹</option><option value="日二壹">日二壹</option>
                    <option value="普三忠">普三忠</option><option value="普三孝">普三孝</option><option value="普三仁">普三仁</option><option value="普三愛">普三愛</option>
                    <option value="商三壹">商三壹</option><option value="觀三壹">觀三壹</option><option value="多三壹">多三壹</option><option value="多三貳">多三貳</option>
                    <option value="英三壹">英三壹</option><option value="日三壹">日三壹</option><option value="日三貳">日三貳</option>
                </select>
            </div>
            <div class="form-group">
                <label>學號</label>
                <input type="number" id="userNumber" placeholder="請輸入學號 (如: 111001)">
            </div>
            <div class="form-group">
                <label>姓名</label>
                <input type="text" id="userName" placeholder="請輸入姓名">
            </div>
            <button class="btn" onclick="saveLogin()">開始集章</button>
        </div>

        <!-- 集章畫面 -->
        <div id="stampSection">
            <h2>我的集章卡</h2>
            <p style="text-align:center; color:#666;" id="welcomeMsg"></p>
            <div class="stamp-grid" id="stampGrid"></div>
        </div>

        <!-- 填寫心得與送出 -->
        <div id="submitSection" style="margin-top: 30px;">
            <hr>
            <h2>🎉 恭喜完成所有集章！</h2>
            <div class="form-group">
                <label>請撰寫參觀心得：</label>
                <textarea id="reflection" rows="4" placeholder="請寫下您今天的心得收穫..."></textarea>
            </div>
            <button class="btn" onclick="submitForm()">送出資料</button>
        </div>
    </div>

    <!-- 任務說明 Modal -->
    <div class="modal" id="taskModal">
        <div class="modal-content">
            <h3 id="taskTitle">任務說明</h3>
            <p id="taskDesc"></p>
            <button class="btn" onclick="openScanner()">📸 拍照掃描 QR Code</button>
            <button class="btn btn-cancel" onclick="closeModal('taskModal')">取消</button>
        </div>
    </div>

    <!-- 相機掃描 Modal -->
    <div class="modal" id="scannerModal">
        <div class="modal-content">
            <h3>掃描 QR Code</h3>
            <p style="font-size:12px; color:red;">※ 限現場親自拍照掃描，無法上傳照片</p>
            <div id="reader"></div>
            <button class="btn btn-cancel" onclick="closeScanner()">取消掃描</button>
        </div>
    </div>

    <script>
        // 捕捉未預期的錯誤並顯示在畫面上，避免只看到白屏
        window.onerror = function(message, source, lineno, colno, error) {
            const errDiv = document.getElementById('errorDisplay');
            errDiv.style.display = 'block';
            errDiv.innerHTML = `<strong>系統發生錯誤：</strong><br>${message}<br><small>行號: ${lineno}</small>`;
        };

        const stampImage = 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c6/Sign-check-icon.png/120px-Sign-check-icon.png';

: true, "south": false, "east": false}, {"id": "1c96d8a3", "name": "中國科技大學", "general": false, "tech": true, "national": false, "north": true, "central": false, "south": false, "east": false}, {"id": "3e5e4e71", "name": "嶺東科技大學", "general": false, "tech": true, "national": false, "north": false, "central": true, "south": false, "east": false}, {"id": "9e67a1c6", "name": "輔仁大學學校財團法人輔仁大學", "general": true, "tech": false, "national": false, "north": true, "central": false, "south": false, "east": false}, {"id": "d7879e96", "name": "開南大學", "general": true, "tech": false, "national": false, "north": true, "central": false, "south": false, "east": false}, {"id": "4772af1c", "name": "中國文化大學", "general": true, "tech": false, "national": false, "north": true, "central": false, "south": false, "east": false}, {"id": "a0e2513c", "name": "文藻外語大學", "general": true, "tech": false, "national": false, "north": false, "central": false, "south": true, "east": false}, {"id": "e08cbeef", "name": "國立東華大學", "general": true, "tech": false, "national": true, "north": false, "central": false, "south": false, "east": true}, {"id": "21cb0637", "name": "台南應用科技大學", "general": false, "tech": true, "national": false, "north": false, "central": false, "south": true, "east": false}, {"id": "7903f6ba", "name": "慈濟學校財團法人慈濟大學", "general": true, "tech": false, "national": false, "north": false, "central": false, "south": false, "east": true}, {"id": "9cc53eff", "name": "國立澎湖科技大學", "general": false, "tech": true, "national": true, "north": false, "central": false, "south": true, "east": false}, {"id": "64c46e3f", "name": "崇右學校財團法人崇右影藝科技大學", "general": false, "tech": true, "national": false, "north": true, "central": false, "south": false, "east": false}, {"id": "b5676b19", "name": "長庚學校財團法人長庚科技大學", "general": false, "tech": true, "national": false, "north": true, "central": false, "south": false, "east": false}, {"id": "2b269c61", "name": "世新大學", "general": true, "tech": false, "national": false, "north": true, "central": false, "south": false, "east": false}, {"id": "4698ce20", "name": "南華大學", "general": true, "tech": false, "national": false, "north": false, "central": false, "south": true, "east": false}, {"id": "bfcbcc06", "name": "亞東學校財團法人亞東科技大學", "general": false, "tech": true, "national": false, "north": true, "central": false, "south": false, "east": false}, {"id": "b9cfd9cc", "name": "宏國德霖科技大學", "general": false, "tech": true, "national": false, "north": true, "central": false, "south": false, "east": false}, {"id": "b3b1b712", "name": "黎明技術學院", "general": false, "tech": false, "national": false, "north": true, "central": false, "south": false, "east": false}];

        const defaultStamps = [
            { title: "一般大學", req: "general", collected: false, schoolName: "" },
            { title: "科技大學", req: "tech", collected: false, schoolName: "" },
            { title: "國立大學", req: "national", collected: false, schoolName: "" },
            { title: "北部大學", req: "north", collected: false, schoolName: "" },
            { title: "中部大學", req: "central", collected: false, schoolName: "" },
            { title: "南部大學", req: "south", collected: false, schoolName: "" },
            { title: "東部大學", req: "east", collected: false, schoolName: "" },
            { title: "最有興趣的大學", req: "any", collected: false, schoolName: "" }
        ];

        let stamps = defaultStamps;
        let studentData = null;
        let currentTargetIndex = -1;
        let html5QrCode = null;

        // 加入防呆的暫存讀取機制
        try {
            const savedStamps = localStorage.getItem('expoStamps');
            if (savedStamps) stamps = JSON.parse(savedStamps);
            const savedUser = localStorage.getItem('expoUser');
            if (savedUser) studentData = JSON.parse(savedUser);
        } catch (e) {
            console.error("暫存解析失敗，重置資料", e);
            localStorage.removeItem('expoStamps');
            localStorage.removeItem('expoUser');
        }

        window.onload = () => {
            if (studentData) {
                document.getElementById('loginSection').style.display = 'none';
                showStampSection();
            }
        };

        function saveLogin() {
            const cls = document.getElementById('userClass').value;
            const num = document.getElementById('userNumber').value;
            const name = document.getElementById('userName').value.trim();
            
            if (!cls || !num || !name) {
                alert('請完整填寫班級、學號與姓名！');
                return;
            }
            
            studentData = { class: cls, number: num, name: name };
            localStorage.setItem('expoUser', JSON.stringify(studentData));
            
            document.getElementById('loginSection').style.display = 'none';
            showStampSection();
        }

        function showStampSection() {
            document.getElementById('stampSection').style.display = 'block';
            document.getElementById('welcomeMsg').innerText = `${studentData.class} ${studentData.name} (${studentData.number})，歡迎開始集章！`;
            renderStamps();
        }

        function renderStamps() {
            const grid = document.getElementById('stampGrid');
            grid.innerHTML = '';
            let allCompleted = true;

            stamps.forEach((stamp, index) => {
                const box = document.createElement('div');
                box.className = `stamp-box ${stamp.collected ? 'completed' : ''}`;
                
                const title = document.createElement('div');
                title.className = 'stamp-title';
                title.innerText = stamp.title;
                box.appendChild(title);
                
                if (stamp.collected) {
                    const schoolInfo = document.createElement('div');
                    schoolInfo.className = 'school-name';
                    schoolInfo.innerText = stamp.schoolName;
                    box.appendChild(schoolInfo);
                    
                    const img = document.createElement('img');
                    img.src = stampImage;
                    img.className = 'stamp-img';
                    box.appendChild(img);
                } else {
                    allCompleted = false;
                    box.onclick = () => showTaskModal(index);
                }
                grid.appendChild(box);
            });

            if (allCompleted) {
                document.getElementById('submitSection').style.display = 'block';
            }
        }

        function showTaskModal(index) {
            currentTargetIndex = index;
            document.getElementById('taskTitle').innerText = stamps[index].title;
            const descMap = {
                "general": "請掃描一所【一般大學】的 QR Code",
                "tech": "請掃描一所【科技大學】的 QR Code",
                "national": "請掃描一所【國立大學】的 QR Code",
                "north": "請掃描一所【北部大學】的 QR Code",
                "central": "請掃描一所【中部大學】的 QR Code",
                "south": "請掃描一所【南部大學】的 QR Code",
                "east": "請掃描一所【東部大學】的 QR Code",
                "any": "自由選擇一所您【最感興趣的大學】進行掃描"
            };
            document.getElementById('taskDesc').innerText = descMap[stamps[index].req];
            document.getElementById('taskModal').style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function openScanner() {
            closeModal('taskModal');
            document.getElementById('scannerModal').style.display = 'flex';
            
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    closeScanner(false);
                    verifyScan(decodedText);
                },
                (errorMessage) => { }
            ).catch((err) => {
                alert("無法開啟相機！請確認：\n1. 已允許瀏覽器使用相機\n2. 網頁需在 https 或 localhost 環境下執行");
                closeScanner(true);
            });
        }

        function closeScanner(skipStop = false) {
            document.getElementById('scannerModal').style.display = 'none';
            if (!skipStop && html5QrCode) {
                html5QrCode.stop().catch(err => console.log(err));
            }
        }

        function verifyScan(scannedId) {
            const targetSchool = schoolsData.find(s => s.id === scannedId);
            if (!targetSchool) {
                alert("❌ 無效的 QR Code，請確認掃描的是攤位上的官方條碼！");
                return;
            }

            const requirement = stamps[currentTargetIndex].req;
            if (requirement === "any" || targetSchool[requirement] === true) {
                stamps[currentTargetIndex].collected = true;
                stamps[currentTargetIndex].schoolName = targetSchool.name;
                localStorage.setItem('expoStamps', JSON.stringify(stamps));
                alert(`✅ 成功收集！這所學校是：${targetSchool.name}`);
                renderStamps();
            } else {
                alert(`❌ 條件不符！\n\n【${targetSchool.name}】不符合此章格 (${stamps[currentTargetIndex].title}) 的要求。`);
            }
        }

        function submitForm() {
            const ref = document.getElementById('reflection').value.trim();
            if (!ref) {
                alert('請撰寫參觀心得再送出！');
                return;
            }

            const baseUrl = "https://docs.google.com/forms/d/e/1FAIpQLSdH0_BmT51ecteiH59l_zLLZNzwObCKNHLLdaZ2qjTbWMSKnA/viewform?usp=pp_url";
            const params = [
                `entry.871765795=${encodeURIComponent(studentData.class)}`,
                `entry.1183621632=${encodeURIComponent(studentData.number)}`,
                `entry.1423815459=${encodeURIComponent(studentData.name)}`,
                `entry.1174958471=${encodeURIComponent(stamps[0].schoolName)}`,
                `entry.1759328801=${encodeURIComponent(stamps[1].schoolName)}`,
                `entry.495542782=${encodeURIComponent(stamps[2].schoolName)}`,
                `entry.351794897=${encodeURIComponent(stamps[3].schoolName)}`,
                `entry.1176353059=${encodeURIComponent(stamps[4].schoolName)}`,
                `entry.704948696=${encodeURIComponent(stamps[5].schoolName)}`,
                `entry.1675069782=${encodeURIComponent(stamps[6].schoolName)}`,
                `entry.1167011241=${encodeURIComponent(stamps[7].schoolName)}`,
                `entry.2145257875=${encodeURIComponent(ref)}`
            ];
            
            window.location.href = `${baseUrl}&${params.join('&')}`;
        }
    </script>
</body>
</html>
