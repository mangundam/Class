<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名店大師</title>
    <link rel="stylesheet" href="myShop_desktop.css" media="screen and (min-width: 769px)">
	<link rel="stylesheet" href="myShop_phone.css" media="screen and (max-width: 768px)">
</head>
<body>

<div class="container">
    <div class="header-stats">
    <div class="stat-card">
        <span class="stat-label">📅 天數</span>
        <span class="stat-val" id="ui-day">1</span>
        <div class="speed-controls">
            <button class="btn-speed active" id="speed-1" onclick="setSpeed(1)">1x</button>
			<button class="btn-speed" id="speed-2" onclick="setSpeed(2)">2x</button>
            <button class="btn-speed" id="speed-10" onclick="setSpeed(10)">10x</button>

        </div>
    </div>
    <div class="stat-card">
        <span class="stat-label">💰 現金</span>
        <span class="stat-val" id="ui-money">50000</span>
        <hr style="width:100%; border:0; border-top:1px solid #ddd; margin:4px 0">
        <span id="ui-shop-name" style="font-weight:bold; color:var(--success)">-</span>
    </div>
    <div class="stat-card">
        <span class="stat-label">💸 開銷</span>
        <span class="stat-val" id="ui-expense" style="color:var(--danger)">0</span>
        <span class="stat-hint" id="ui-expense-hint">💡 固定成本：店租 0元 + 人事 2,400元 = 2,400元/天</span>
    </div>
</div>

    <div id="game-canvas">
		<div class="road"></div>
		
		<div id="sub-stores-container" class="sub-stores-container"></div>
		
		<div class="shop-building" id="shop-node" style="display:none">
			<span class="main-store-icon">🏪</span>
			<div class="sub-type-icon" id="shop-sub-icon">🥤</div>
		</div>
	</div>
    <button class="btn-main" id="btn-start" onclick="startDay()">開店!</button>

    <div class="setup-grid">
        <div class="card">
            <h3>📊 營運數據</h3>
            <div style="font-size: 20px; line-height: 1.8;">
                單價：<b id="ui-price" style="color:var(--primary)">0</b> 元<br>
                成本：<b id="ui-cost" style="color:var(--danger)">0</b> 元<br>
                預估客流：<b id="ui-demand-range" style="color:var(--warning)">25 ~ 40</b> 人
            </div>
        </div>
		<div class="card">
			<h3 style="margin-top:0">📜 經營筆記</h3>
			<div class="strategy-history-area">
				<div id="active-buffs-list" style="font-size: 14px; margin-bottom: 10px;">
					<b style="color:var(--primary)">🎯 當前策略：</b>
					<div id="history-buffs-inline" style="display: flex; flex-wrap: wrap; gap: 4px; margin-top:5px;">暫無</div>
				</div>
				<div id="event-impact-list" style="font-size: 14px;">
					<b style="color:var(--danger)">⚠️ 事件影響：</b>
					<div id="history-events-inline" style="margin-top:5px;">暫無</div>
				</div>
			</div>
		</div>
    </div>

    <div class="log" id="game-log" style="margin-top:15px;"></div>
</div>

<div id="setup-modal" class="modal" style="display:flex">
    <div class="modal-content" id="setup-content">
        <h2 style="font-size: 28px;">🏬 第一步：選擇你的事業起源</h2>
        <div class="type-grid">
            <button class="btn-type" onclick="chooseDiff('drink')"><h4>🥤 飲料店</h4><p>客流量極大、低單價、低成本。</p></button>
            <button class="btn-type" onclick="chooseDiff('bakery')"><h4>🥐 烘焙坊</h4><p>低成本、需求穩定、中等人事費。</p></button>
            <button class="btn-type" onclick="chooseDiff('game')"><h4>🎮 電玩店</h4><p>高單價、高利潤、需求不穩定。</p></button>
            <button class="btn-type" onclick="chooseDiff('hobby')"><h4>🧸 玩具店</h4><p>高單價、需求穩定、高人事費。</p></button>
        </div>
    </div>
</div>

<div id="settle-modal" class="modal">
    <div class="modal-content">
        <h2 id="settle-title" style="font-size: 32px; margin-bottom: 15px;">📈 今日結算報表</h2>
        <div id="settle-report" style="font-size:20px; text-align:center; background:#f8fafc; padding:25px; border-radius:20px; line-height:1.6; border: 2px solid #e2e8f0; margin-bottom: 25px;"></div>
        <hr style="border: 1px solid #f3f4f6; margin-bottom: 25px;">
        <h3 style="font-size: 26px; color: var(--primary); margin-bottom: 15px;">💡 每日投資決策</h3>
        <div class="type-grid" id="buff-options" style="grid-template-columns: repeat(3, 1fr); gap: 15px;"></div>
        <button class="btn-main" style="background:#94a3b8; font-size:18px; margin-top: 30px; width: 45%;" onclick="checkEventAfterSettle()">跳過投資</button>
    </div>
</div>

<div id="event-modal" class="modal">
    <div class="modal-content">
        <h2 id="event-title" style="color:var(--danger); font-size: 30px;">🔥 重大經營決策</h2>
        <p id="event-desc" style="font-size:17px; padding:20px; background:#fff1f2; border-radius:15px; line-height:1.5;"></p>
        <div id="event-options" class="type-grid" style="grid-template-columns: 1fr 1fr;"></div>
    </div>
</div>

<script>
	const SHOP_DATA = {
		drink: { name: "飲料店", icon: "🥤", price: 65, cost: 22, demandMin: 36, demandMax: 55, personnel: 2400 },//1548~2365
		bakery: { name: "烘焙坊", icon: "🥐", price: 180, cost: 55, demandMin: 18, demandMax: 22, personnel: 3000 },//2250~2750
		game: { name: "電玩店", icon: "🎮", price: 1800, cost: 1100, demandMin: 1, demandMax: 5, personnel: 2800 },//700~3500
		hobby: { name: "玩具店", icon: "🧸", price: 900, cost: 500, demandMin: 6, demandMax: 8, personnel: 3600 }//2400~3200
	};

	const BUFF_POOL = [
		{ name: "📰 網路廣告", desc: "客流 +10%", buy: 4000, dRate: 0.10 },
		{ name: "🤖 自動結帳", desc: "單位成本 -10%", buy: 3500, cRate: -0.10 },
		{ name: "💎 尊榮會員", desc: "客流 +5%, 售價 +10%", buy: 4000, dRate: 0.05, pRate: 0.10 },
		{ name: "⏰ 延長工時", desc: "客流 +15%, 人事 +30%", buy: 1500, dRate: 0.15, personnelRate: 0.3 },
		{ name: "🎫 優惠禮券", desc: "客流 +15%, 售價 -15%", buy: 2500, dRate: 0.15, pRate: -0.15 },
		{ name: "🧹 門面裝修", desc: "客流 +10%, 售價 +5%", buy: 5000, dRate: 0.10, pRate: 0.05 },
		{ name: "📦 批發採購", desc: "單位成本 -20%, 客流 -10%", buy: 2000, cRate: -0.20, dRate: -0.1 },
		{ name: "👨‍🍳 專業培訓", desc: "售價 +15%, 人事 +20%", buy: 4000, pRate: 0.15, personnelRate: 0.2 },
		{ name: "🏗️ 擴大店面", desc: "客流 +30%, 房租 +1500", buy: 8500, dRate: 0.30, rentAdd: 1500 },
		{ name: "🏢 開設分店", desc: "客流 +70%, 房租 +3000, 人事 +50%", buy: 18000, dRate: 0.70, rentAdd: 3000, personnelRate: 0.5 }
	];

//dRate=客流, cRate=成本, pRate=售價, personnelRate=人事, rentAdd=房租
//沒有duration等於永久活動
	const BIG_EVENTS = [
		{
			title: "⚖️ 法定工資調漲",
			desc: "政府宣布調高基本時薪，這將影響近期的經營成本（持續 5 天）。",
			options: [
				{ 
					text: "精簡人力 (人事+15%, 客流-20%)", 
					impact: { personnelRate: 0.15, dRate: -0.20, log: "短期：精簡人力導致服務品質下降", duration: 5 } 
				},
				{ 
					text: "全面調薪 (人事+30%, 售價+10%)", 
					impact: { pRate: 0.10, personnelRate: 0.3, log: "短期：調薪提升士氣與產品價值", duration: 5 }
				}
			]
		},
		{
			title: "🏗️ 捷運完工轉型",
			desc: "店門口的捷運站正式完工啟用！這將帶來穩定的人潮，但地段租金也隨之暴漲。",
			options: [
				{ 
					text: "原地升級 (客流+30%, 租金+2000)", 
					impact: { dRate: 0.30, rentAdd: 2000, log: "長期：捷運站帶來龐大客流，但租金成本大幅提升"} 
				},
				{ 
					text: "搬遷避險 (客流-10%, 租金-300)", 
					impact: { dRate: -0.10, rentAdd: -300, log: "長期：搬遷至較遠地段，避開租金壓力但人氣下滑"}
				}
			]
		},
		{
			title: "🌀 強力颱風侵襲",
			desc: "氣象局發布陸上警報，影響預計僅限明日。",
			options: [
				{ 
					text: "防颱加固 (開銷+1000, 客流-40%)", 
					impact: { rentAdd: 1000, dRate: -0.4, log: "短期：加固設施支出", duration: 1 } 
				},
				{ 
					text: "停業一天 (當天零客流, 零人事費用)", 
					impact: { dRate: -100.0, personnelRate: -100.0, log: "短期：停業避災", duration: 1 } 
				}
			]
		},
		{
			title: "✈️ 國際旅遊節",
			desc: "大量國外旅客湧入，這是一次性的觀光熱潮（持續 3 天）。",
			options: [
				{ 
					text: "外籍友善 (人事+40%, 客流+80%)", 
					impact: { dRate: 0.80, personnelRate: 0.4, log: "短期：增聘臨時翻譯人員", duration: 3 }
				},
				{ 
					text: "推出套裝 (售價+20%, 客流+20%)", 
					impact: { pRate: 0.2, dRate: 0.10, log: "短期：觀光限定套裝", duration: 3 } 
				}
			]
		},
		{
			title: "🌍 供應鏈危機",
			desc: "全球物料短缺，預計會造成短期的成本波動（持續 5 天）。",
			options: [
				{ 
					text: "吸收成本 (成本+8%)", 
					impact: { cRate: 0.08, log: "短期：公司吸收物料漲幅", duration: 5 } 
				},
				{ 
					text: "調整配方 (客流-15%)", 
					impact: { dRate: -0.15, log: "短期：配方更換導致客流流失", duration: 5 } 
				}
			]
		},
		{
			title: "🚧 門口修路",
			desc: "店門口進行地下管線施工，預計持續 3 天，進出不便。",
			options: [
				{ 
					text: "忍受不便 (客流-30%)", 
					impact: { dRate: -0.30, log: "短期：施工阻擋了客流", duration: 3 } 
				},
				{
					text: "補貼吸引 (開銷+1500, 客流-10%)",
					impact: { eAdd: 1500, dRate: -0.10, log: "短期：投入行銷經費補貼", duration: 3 }
				}
			]
		}
	];
	
	let state = {
		shop: null, money: 50000, day: 1, 
		activeBuffs: [], historyEvents: [],
		difficulty: 'normal', eventCycle: 5,
		rent: 1000, personnel: 2400,
		expenseMod: 1, dailyRev: 0, dailySold: 0,
		gameSpeed: 1,
		expansionLevel: 0,
		branchPositions: []
		
	};

    function chooseDiff(key) {
        state.shop = { ...SHOP_DATA[key] };
        document.getElementById('setup-content').innerHTML = `<h2 style="font-size:28px;">⚙️ 第二步：選擇經營難度</h2>
            <div class="diff-grid">
                <button class="btn-diff" onclick="finalize('easy', 120000, 800, 7)">
                    <h4>🟢 簡單</h4>
                    <p>資金充足 ($12萬)<br>店租: $800 / 天<br><b>每 7 天</b>一事件</p>
                </button>
                <button class="btn-diff" onclick="finalize('normal', 60000, 1000, 5)">
                    <h4>🟡 標準</h4>
                    <p>創業資金 ($6萬)<br>店租: $1,000 / 天<br><b>每 5 天</b>一事件</p>
                </button>
                <button class="btn-diff" onclick="finalize('hard', 30000, 1200, 3)">
                    <h4>🔴 困難</h4>
                    <p>資金吃緊 ($3萬)<br>店租: $1,200 / 天<br><b>每 3 天</b>一事件</p>
                </button>
            </div>`;
    }

	function finalize(diff, m, r, cycle) {
		state.difficulty = diff; 
		state.money = m; 
		state.rent = r;           // 難度決定的租金
		state.eventCycle = cycle;
		
		// 直接抓取該店型的純人事費
		state.personnel = state.shop.personnel; 
		
		document.getElementById('setup-modal').style.display = 'none';
		document.getElementById('shop-node').style.display = 'flex';
		document.getElementById('shop-sub-icon').textContent = state.shop.icon;
		document.getElementById('ui-shop-name').textContent = state.shop.name;
		updateUI();
	}

	function calculateCurrentStats() {
		let p = state.shop.price, c = state.shop.cost;
		let baseRent = state.rent;        // 來自難度設定
		let basePersonnel = state.personnel; // 來自店型設定

		let pMul = 1.0, cMul = 1.0, dMul = 1.0, persMul = 1.0;
		let rentAdd = 0, dAdd = 0;

		// 策略影響 (Buffs)
		state.activeBuffs.forEach(item => {
			if(item.pRate) pMul *= (1 + item.pRate);
			if(item.cRate) cMul *= (1 + item.cRate);
			if(item.dRate) dMul *= (1 + item.dRate);
			if(item.personnelRate) persMul *= (1 + item.personnelRate); // 影響人事
			if(item.rentAdd) rentAdd += item.rentAdd; // 影響租金
		});

		// 事件影響 (Events)
		state.historyEvents.forEach(item => {
			if(item.pRate) pMul *= (1 + item.pRate);
			if(item.cRate) cMul *= (1 + item.cRate);
			if(item.dRate) dMul *= (1 + item.dRate);
			if(item.personnelRate) persMul *= (1 + item.personnelRate);
			if(item.rentAdd) rentAdd += item.rentAdd;
		});

		// 最終合成計算
		const finalPrice = Math.max(1, Math.floor(p * pMul));
		const finalCost = Math.max(1, Math.floor(c * cMul));
		const finalPersonnel = Math.max(0, Math.floor(basePersonnel * persMul));
		const finalRent = Math.max(0, baseRent + rentAdd);

		return { 
			price: finalPrice, 
			cost: finalCost, 
			expense: finalPersonnel + finalRent, // 總開銷 = 動態人事 + 動態租金
			Statrent: finalRent,
			StatPersonnel: finalPersonnel,
			dRate: dMul - 1,
			dAdd: dAdd
		};
	}

	function updateUI() {
			const stats = calculateCurrentStats();
			document.getElementById('ui-money').textContent = Math.floor(state.money);
			document.getElementById('ui-day').textContent = state.day;
			document.getElementById('ui-price').textContent = stats.price;
			document.getElementById('ui-cost').textContent = stats.cost;
			document.getElementById('ui-expense').textContent = Math.floor(stats.expense);
			
			document.getElementById('ui-expense-hint').textContent = 
				`💡 固定成本：店租 ${stats.Statrent.toLocaleString()}元 + 人事 ${stats.StatPersonnel.toLocaleString()}元 = ${Math.floor(stats.expense).toLocaleString()}元/天`;
				
			const minDemand = Math.max(0, Math.floor(state.shop.demandMin * (1 + stats.dRate)) + stats.dAdd);
			const maxDemand = Math.max(0, Math.floor(state.shop.demandMax * (1 + stats.dRate)) + stats.dAdd);
			document.getElementById('ui-demand-range').textContent = `${minDemand} ~ ${maxDemand}`;
						
			const buffDiv = document.getElementById('history-buffs-inline');
			const eventDiv = document.getElementById('history-events-inline');
			
			if (buffDiv) {
				// 1. 統計次數
				const counts = {};
				state.activeBuffs.forEach(b => {
					counts[b.name] = (counts[b.name] || 0) + 1;
				});

				// 2. 轉換成顯示文字
				const displayTags = Object.keys(counts).map(name => {
					const count = counts[name];
					const countText = count > 1 ? ` *${count}` : ""; // 超過1個才顯示 *幾
					return `<span class="status-tag" style="margin:2px; font-size:11px;">${name}${countText}</span>`;
				});

				buffDiv.innerHTML = displayTags.join('') || "無";
			}
			
			if (eventDiv) {
				eventDiv.innerHTML = state.historyEvents.map(e => {
					// 如果有 duration 就顯示剩餘天數，否則顯示永久
					const countdown = e.duration !== undefined ? ` (剩餘 ${e.duration+1} 天)` : " (永久)";
					return `<div style="font-size:12px; color:#64748b; border-bottom:1px solid #eee; padding:2px 0;">
						• ${e.log} <b style="color:var(--danger)">${countdown}</b>
					</div>`;
				}).join('') || "無";
			}
			const shopNode = document.getElementById('shop-node');
			const subStoreContainer = document.getElementById('sub-stores-container');
			if (!subStoreContainer) return;

			// 處理擴大店面縮放
			state.expansionLevel = state.activeBuffs.filter(b => b.name.includes("擴大店面")).length;
			if (state.expansionLevel > 0) {
				const scale = 1 + (state.expansionLevel * 0.1);
				// 動態計算位移：每級向上提 10px 避免破底
				const translateY = state.expansionLevel * -1;
				
				shopNode.style.transform = `translateX(-50%) scale(${scale}) translateY(${translateY}%)`;
				shopNode.style.transformOrigin = "bottom center";
			} else {
				shopNode.style.transform = `translateX(-50%) scale(1) translateY(0px)`;
			}

			// --- 處理分店核心邏輯 (防止重疊版本) ---
			const currentBranchBuffs = state.activeBuffs.filter(b => b.name.includes("開設分店")).length;
			const targetGraphicCount = currentBranchBuffs; 

			// 初始化 state 中的 branchPositions（如果還沒有的話）
			if (!state.branchPositions) state.branchPositions = [];

			while (state.branchPositions.length < targetGraphicCount) {
				const storeEmojis = ['🏠', '🏘️', '🏤', '🏢', '🏬', '🏪', '🏨', '🏦'];
				let newLeft, isOverlap, attempts = 0;

				// 嘗試尋找不重疊的座標，最多嘗試 50 次避免死迴圈
				do {
					isOverlap = false;
					const side = Math.random() > 0.5 ? 'left' : 'right';
					newLeft = (side === 'left') ? (Math.random() * 32) : (68 + Math.random() * 25);
					
					// 檢查與「已存在分店」的距離
					for (let existing of state.branchPositions) {
						// 如果兩個座標水平距離小於 8%，視為重疊 (數字越大分得越開)
						if (Math.abs(existing.left - newLeft) < 15) {
							isOverlap = true;
							break;
						}
					}
					attempts++;
				} while (isOverlap && attempts < 50);

				state.branchPositions.push({
					emoji: storeEmojis[Math.floor(Math.random() * storeEmojis.length)],
					left: newLeft,
					top: (Math.random() * 10), 
					scale: 0.8 + (Math.random() * 0.3)
				});
			}

			// 渲染 HTML：只有當數量增加時才重新繪製，保留原本分店的位置
			if (subStoreContainer.childElementCount !== state.branchPositions.length) {
				subStoreContainer.innerHTML = '';
				state.branchPositions.forEach(pos => {
					const span = document.createElement('span');
					span.className = 'branch-icon';
					span.textContent = pos.emoji;
					span.style.left = `${pos.left}%`;
					span.style.top = `${pos.top}%`;
					span.style.transform = `scale(${pos.scale})`;
					subStoreContainer.appendChild(span);
				});
			}
	}
	
	async function startDay() {
		const btn = document.getElementById('btn-start');
		btn.disabled = true;
		btn.textContent = "🏪 營業中..."; // 顯示效果
		
		state.dailyRev = 0; 
		state.dailySold = 0;
		const stats = calculateCurrentStats();
		
		const range = state.shop.demandMax - state.shop.demandMin + 1;
		const baseDemand = Math.floor(Math.random() * range) + state.shop.demandMin; 
		
		const finalCount = Math.max(0, Math.floor(baseDemand * (1 + stats.dRate)) + stats.dAdd);
		
		// 等待所有客人都走完
		await playBusinessAnimation(finalCount, stats.price);
		
		const totalIncome = state.dailyRev;
		const totalCost = (state.dailySold * stats.cost) + stats.expense;
		const netProfit = totalIncome - totalCost;
		state.money += netProfit;
		
		btn.textContent = "開店!"; // 結算後改回原樣
		showSettlement(state.dailySold, totalIncome, totalCost, netProfit, state.money);
	}

    async function playBusinessAnimation(total, currentPrice) {
		return new Promise(resolve => {
			const canvas = document.getElementById('game-canvas');
			let spawned = 0;
			let finished = 0; // 新增：追蹤完成動作的客人數量
			const s = state.gameSpeed; 
			
			const baseDuration = 10000;
			const baseMoveTime = 3000;
			const baseStayTime = 800;
			const baseCoinTime = 1000;

			// 如果完全沒客人，直接結束
			if (total === 0) {
				setTimeout(resolve, 500 / s);
				return;
			}

			function spawnCustomer() {
				if (spawned >= total) return;

				spawned++;
				const c = document.createElement('div');
				c.className = 'customer';
				c.textContent = ['🚶', '🧍', '🚶‍♀️', '🧍‍♂️', '🏃'][Math.floor(Math.random() * 5)];
				const xOffset = (Math.random() * 80) - 40;
				c.style.transform = `translateX(${xOffset}px)`;
				canvas.appendChild(c);

				// 第一階段：走到店門口
				setTimeout(() => {
					c.style.transition = `left ${baseMoveTime / s}ms linear`;
					c.style.left = "46%";

					// 第二階段：消費
					setTimeout(() => {
						c.style.opacity = "0";

						const coin = document.createElement('div');
						coin.className = 'coin-pop';
						coin.style.animationDuration = `${baseCoinTime / s}ms`; 
						coin.innerHTML = `💰 +${currentPrice}`;
						document.getElementById('shop-node').appendChild(coin);

						state.dailyRev += currentPrice;
						state.dailySold += 1;
						document.getElementById('ui-money').textContent = Math.floor(state.money + state.dailyRev);

						// 第三階段：離開
						setTimeout(() => {
							c.style.opacity = "1";
							c.style.transition = `left ${baseMoveTime / s}ms linear`;
							c.style.left = "-20%";
							
							// 第四階段：徹底消失並移除元素
							setTimeout(() => {
								c.remove();
								coin.remove();
								finished++;
								// 當最後一位客人離開畫面時，觸發 resolve
								if (finished === total) {
									resolve();
								}
							}, baseMoveTime / s);
						}, baseStayTime / s);
					}, baseMoveTime / s);
				}, 50 / s);

				if (spawned < total) {
					const nextDelay = (baseDuration / total) * (Math.random() * 0.5 + 0.75) / s;
					setTimeout(spawnCustomer, nextDelay);
				}
			}

			spawnCustomer();
		});
	}

	function showSettlement(count, rev, cost, profit, money) {
		// 如果已經達到30天或資金為負，雖然顯示報表，但點擊按鈕應指向結束畫面
		const isGameOver = state.money < 0 || state.day >= 30;
		
		const modal = document.getElementById('settle-modal');
		document.getElementById('settle-report').innerHTML = `
			📦 銷量：<b>${count}</b> 件 <br>
			📥 收入：<span style="color:var(--success); font-weight:800;">+$${rev.toLocaleString()}</span><br>
			📤 支出：<span style="color:var(--danger); font-weight:800;">-$${Math.floor(cost).toLocaleString()}</span><br>
			✨ 純利：<b style="color:${profit>=0?'green':'red'}; font-size: 26px;">$${Math.floor(profit).toLocaleString()}</b><br>
			💰 餘額：<b style="color:var(--success); font-size: 26px;">$${Math.floor(money).toLocaleString()}</b>
		`;
		log(`Day ${state.day}：銷量 ${count} | 營收 ${rev} | 淨利 ${Math.floor(profit)}`);

		const optBox = document.getElementById('buff-options');
		const investTitle = modal.querySelector('h3'); // 抓取「每日投資決策」標題
		const skipBtn = modal.querySelector('.btn-main[onclick="checkEventAfterSettle()"]');

		if (state.money < 0) {
			// 如果負債，隱藏投資選項並更改按鈕文字
			optBox.style.display = 'none';
			if(investTitle) investTitle.textContent = "❌ 經營失敗：公司已宣告破產";
			skipBtn.textContent = "查看最終報表";
		} else {
			// 正常顯示投資選項
			optBox.style.display = 'grid';
			if(investTitle) investTitle.textContent = "💡 每日投資決策";
			skipBtn.textContent = "跳過投資";
			
			optBox.innerHTML = '';
			[...BUFF_POOL].sort(() => 0.5-Math.random()).slice(0,3).forEach(b => {
				const btn = document.createElement('div');
				btn.className = 'btn-buff-card';
				btn.innerHTML = `
					<div class="buff-name-label">${b.name}</div>
					<div class="buff-desc-label">${b.desc}</div>
					<div class="buff-cost-label">$${b.buy.toLocaleString()}</div>
				`;
				btn.onclick = () => {
					if(state.money < b.buy) {
						showWarning("⚠️ 資金不足！");
						return;
					}
					state.money -= b.buy;
					state.activeBuffs.push(b);
					updateUI();
					checkEventAfterSettle();
				};
				optBox.appendChild(btn);
			});
		}
		modal.style.display = 'flex';
	}

    function checkEventAfterSettle() {
        document.getElementById('settle-modal').style.display = 'none';
        if (state.day <30  && state.day % state.eventCycle === 0) triggerBigEvent(); else nextDay();
    }

    function triggerBigEvent() {
		const ev = BIG_EVENTS[Math.floor(Math.random() * BIG_EVENTS.length)];
		document.getElementById('event-title').textContent = `🔥 第 ${state.day} 天 ${ev.title}`;
		document.getElementById('event-desc').textContent = ev.desc;
		const optBox = document.getElementById('event-options');
		optBox.innerHTML = '';
		ev.options.forEach(opt => {
			const btn = document.createElement('button');
			btn.className = 'btn-main';
			btn.textContent = opt.text;
			btn.onclick = () => {
				const newImpact = { ...opt.impact };
				if(newImpact.duration){log(`<span style="color:var(--warning)">[事件] ${newImpact.log} (持續 ${newImpact.duration} 天，預計 ${state.day + newImpact.duration+1} 日恢復)</span>`);}
				else {log(`<span style="color:var(--warning)">[事件] ${newImpact.log} (永久)</span>`);}
				
				state.historyEvents.push(newImpact);
				document.getElementById('event-modal').style.display = 'none';
				updateUI(); 
				nextDay();
			};
			optBox.appendChild(btn);
		});
		document.getElementById('event-modal').style.display = 'flex';
	}

	function nextDay() {
		if (state.money < 0) {
			gameOver("破產！這裡是最終經營總結報告。");
			return;
		}
		state.historyEvents.forEach(event => {
			if (event.duration !== undefined) {
				event.duration--;
			}
		});

		const originalCount = state.historyEvents.length;
		state.historyEvents = state.historyEvents.filter(event => 
			event.duration === undefined || event.duration > -1
		);

		if (state.historyEvents.length < originalCount) {
			log(`<span style="color:var(--success)">[事件] 部分暫時性事件影響已結束。</span>`);
		}

		state.day++;
		if (state.day > 30) {
			state.day = 30; // 固定在30天
			gameOver("30 天經營結束！這裡是最終經營總結報告。");
			return;
		}

		updateUI(); 
		document.getElementById('btn-start').disabled = false;
		
	}
	
	function setSpeed(speed) {
		state.gameSpeed = speed;
		document.querySelectorAll('.btn-speed').forEach(btn => btn.classList.remove('active'));
		document.getElementById(`speed-${speed}`).classList.add('active');
	}
	
	function gameOver(title) {
		document.getElementById('btn-start').classList.add('hidden-area');
		document.getElementById('game-canvas').classList.add('hidden-area');

		const strategyArea = document.querySelector('.strategy-history-area');
		if (strategyArea) strategyArea.classList.add('expanded-card');

		const logArea = document.getElementById('game-log');
		logArea.classList.add('fully-visible');
		
		updateUI(); 
		log(`<b style='color:var(--primary); font-size:24px;'>${title}</b>`);
	}
	
	function showWarning(text) {
		const toast = document.createElement('div');
		toast.className = 'insufficient-funds-toast';
		toast.textContent = text;
		document.body.appendChild(toast);
		
		setTimeout(() => {
			toast.remove();
		}, 1500);
	}
    function log(msg) {
        const l = document.getElementById('game-log');
        l.innerHTML = `[${state.day}日] ${msg}<br>` + l.innerHTML;
    }
</script>
