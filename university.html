<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>大學博覽會 - 集章活動</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        body { font-family: "微軟正黑體", sans-serif; background: #f0f2f5; margin: 0; padding: 0; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        h1, h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        .btn { display: block; width: 100%; padding: 12px; background: #4CAF50; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; text-align: center; margin-top: 10px; }
        .btn:disabled { background: #aaa; cursor: not-allowed; }
        
        .stamp-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px; }
        .stamp-box { border: 1px solid #ddd; border-radius: 10px; height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; cursor: pointer; position: relative; background: #fafafa; padding-top: 10px; box-sizing: border-box; overflow: hidden; }
        .stamp-box.completed { border-color: #4CAF50; background: #fff; border-width: 2px; }
        .stamp-title { font-weight: bold; font-size: 14px; text-align: center; z-index: 2; margin-bottom: 5px; background: rgba(255,255,255,0.8); padding: 2px 5px; border-radius: 4px; }
        .school-name { font-size: 16px; color: #555; text-align: center; z-index: 2; padding: 2px 5px; background: rgba(255,255,255,0.8); border-radius: 4px; margin-top:40px; }
        .stamp-img { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85px; height: 85px; object-fit: contain; z-index: 1; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 999; justify-content: center; align-items: center; }
        .modal-content { background: #fff; padding: 20px; border-radius: 10px; width: 90%; max-width: 400px; text-align: center; }
        .modal-content h3 { margin-top: 0; }
        .btn-cancel { background: #f44336; margin-top: 10px; }
        .btn-primary { background: #2196F3; margin-top: 10px; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; }
        
        #stampSection, #submitSection { display: none; }
        #errorDisplay { display: none; background: #ffebee; color: #c62828; padding: 15px; margin-bottom: 20px; border-radius: 5px; border: 1px solid #ef9a9a; }
        #submittedMsg { display: none; text-align: center; color: #4CAF50; font-weight: bold; margin-top: 15px; font-size: 18px; }
    </style>
</head>

            <button class="btn" onclick="saveLogin()">開始集章</button>
        </div>

        <!-- 集章畫面 -->
        <div id="stampSection">
            <h2>我的集章卡</h2>
            <p style="text-align:center; color:#666;" id="welcomeMsg"></p>
            <div class="stamp-grid" id="stampGrid"></div>
        </div>

        <!-- 填寫心得與送出 -->
        <div id="submitSection" style="margin-top: 30px;">
            <hr>
            <h2>恭喜完成所有集章</h2>
            <div class="form-group">
                <label>請撰寫參觀心得：</label>
                <textarea id="reflection" rows="4" placeholder="請寫下您今天的心得收穫..."></textarea>
            </div>
            <button class="btn" id="submitBtn" onclick="submitForm()">送出資料</button>

        </div>
    </div>

    <!-- 任務說明 Modal -->
    <div class="modal" id="taskModal">
        <div class="modal-content">
            <h3 id="taskTitle">任務說明</h3>
            <p id="taskDesc"></p>
            <button class="btn btn-primary" onclick="openScanner()">開啟相機掃描</button>
            <button class="btn btn-cancel" onclick="closeModal('taskModal')">取消</button>
        </div>
    </div>

    <!-- 相機掃描 Modal -->
    <div class="modal" id="scannerModal">
        <div class="modal-content">
            <h3>掃描 QR Code</h3>
            <p id="scannerTargetText" style="font-weight: bold; color: #1976d2; margin-bottom: 5px;"></p>
            <p style="font-size:12px; color:red; margin-top: 0;">限現場親自拍照掃描，無法上傳照片</p>
            <div id="reader"></div>
            <button class="btn btn-primary" id="captureBtn" onclick="requestScan()">進行掃描</button>
            <button class="btn btn-cancel" onclick="closeScanner()">取消掃描</button>
        </div>
    </div>

    <!-- 自訂訊息 Modal (取代 alert) -->
    <div class="modal" id="messageModal">
        <div class="modal-content">
            <h3 id="msgTitle">提示訊息</h3>
            <p id="msgBody"></p>
            <button class="btn" onclick="closeModal('messageModal')">確定</button>
        </div>

        const defaultStamps = [
            { title: "一般大學", req: "general", collected: false, schoolName: "", dimImg: "stamp/一般大學_暗.png", colorImg: "stamp/一般大學.png" },
            { title: "科技大學", req: "tech", collected: false, schoolName: "", dimImg: "stamp/科技大學_暗.png", colorImg: "stamp/科技大學.png" },

        let stamps = defaultStamps;
        let studentData = null;
        let currentTargetIndex = -1;
        let html5QrCode = null;
        let scanRequested = false;
        let scanTimeout = null;

        // 讀取暫存資料
        try {
            const savedStamps = localStorage.getItem('expoStamps');
            if (savedStamps) stamps = JSON.parse(savedStamps);
            const savedUser = localStorage.getItem('expoUser');
            if (savedUser) studentData = JSON.parse(savedUser);
        } catch (e) {
            console.error("暫存解析失敗，重置資料", e);
            localStorage.removeItem('expoStamps');
            localStorage.removeItem('expoUser');
        }

        window.onload = () => {
            if (studentData) {
                document.getElementById('loginSection').style.display = 'none';
                showStampSection();
            }
        };

        // 自訂提示視窗
        function showMessage(title, text) {
            document.getElementById('msgTitle').innerText = title;
            document.getElementById('msgBody').innerText = text;
            document.getElementById('messageModal').style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function saveLogin() {
            const cls = document.getElementById('userClass').value;
            const num = document.getElementById('userNumber').value;
            const name = document.getElementById('userName').value.trim();
            
            if (!cls || !num || !name) {
                showMessage('資料不完整', '請完整填寫班級、學號與姓名！');
                return;
            }
            
            studentData = { class: cls, number: num, name: name };
            localStorage.setItem('expoUser', JSON.stringify(studentData));
            
            document.getElementById('loginSection').style.display = 'none';
            showStampSection();
        }

        function showStampSection() {
            document.getElementById('stampSection').style.display = 'block';
            document.getElementById('welcomeMsg').innerText = `${studentData.class} ${studentData.name} (${studentData.number})，歡迎開始集章！`;
            renderStamps();
        }

        function renderStamps() {
            const grid = document.getElementById('stampGrid');
            grid.innerHTML = '';
            let allCompleted = true;

            stamps.forEach((stamp, index) => {
                const box = document.createElement('div');
                box.className = `stamp-box ${stamp.collected ? 'completed' : ''}`;
                
                const title = document.createElement('div');
                title.className = 'stamp-title';
                title.innerText = stamp.title;
                box.appendChild(title);
                
                if (stamp.collected) {
                    const schoolInfo = document.createElement('div');
                    schoolInfo.className = 'school-name';
                    schoolInfo.innerText = stamp.schoolName;
                    box.appendChild(schoolInfo);
                } else {
                    allCompleted = false;
                    box.onclick = () => showTaskModal(index);
                }
                
                // 置入圖片 (依照收集狀態判斷要顯示黯淡圖還是彩色圖)
                const img = document.createElement('img');
                img.src = stamp.collected ? stamp.colorImg : stamp.dimImg;
                img.className = 'stamp-img';
                box.appendChild(img);

                grid.appendChild(box);
            });

            if (allCompleted) {
                document.getElementById('submitSection').style.display = 'block';
                // 檢查是否已送出過
                if (localStorage.getItem('expoSubmitted') === 'true') {
                    document.getElementById('reflection').disabled = true;
                    document.getElementById('submitBtn').style.display = 'none';
                    document.getElementById('submittedMsg').style.display = 'block';
                }
            }
        }

        function showTaskModal(index) {
            currentTargetIndex = index;
            document.getElementById('taskTitle').innerText = stamps[index].title;
            const descMap = {
                "general": "請掃描一所【一般大學】的 QR Code",
                "tech": "請掃描一所【科技大學】的 QR Code",
                "national": "請掃描一所【國立大學】的 QR Code",
                "north": "請掃描一所【北部大學】的 QR Code",
                "central": "請掃描一所【中部大學】的 QR Code",
                "south": "請掃描一所【南部大學】的 QR Code",
                "east": "請掃描一所【東部大學】的 QR Code",
                "any": "自由選擇一所您【最感興趣的大學】進行掃描"
            };
            document.getElementById('taskDesc').innerText = descMap[stamps[index].req];
            document.getElementById('taskModal').style.display = 'flex';
        }

        function openScanner() {
            closeModal('taskModal');
            
            // 設定掃描目標提示文字
            const targetReq = stamps[currentTargetIndex].title;
            document.getElementById('scannerTargetText').innerText = `請尋找並掃描符合【${targetReq}】的攤位條碼`;
            
            // 重置掃描按鈕狀態
            scanRequested = false;
            document.getElementById('captureBtn').innerText = '進行掃描';
            document.getElementById('captureBtn').disabled = false;
            
            document.getElementById('scannerModal').style.display = 'flex';
            
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    // 只有當使用者按下「進行掃描」時，才處理掃描結果
                    if (scanRequested) {
                        scanRequested = false;
                        clearTimeout(scanTimeout);
                        closeScanner(false);
                        verifyScan(decodedText);
                    }
                },
                (errorMessage) => { }
            ).catch((err) => {
                showMessage("相機錯誤", "無法開啟相機！請確認已允許瀏覽器使用相機權限。");
                closeScanner(true);
            });
        }

        // 學生點擊手動掃描按鈕
        function requestScan() {
            scanRequested = true;
            const btn = document.getElementById('captureBtn');
            btn.innerText = '掃描分析中，請保持穩定...';
            btn.disabled = true;

            // 給予 2.5 秒的掃描緩衝期，若沒掃到則重置
            scanTimeout = setTimeout(() => {
                if (scanRequested) {
                    scanRequested = false;
                    btn.innerText = '進行掃描';
                    btn.disabled = false;
                    showMessage('未偵測到條碼', '未能辨識出清晰的 QR Code，請對準條碼後再按一次掃描。');
                }
            }, 2500);
        }

        function closeScanner(skipStop = false) {
            document.getElementById('scannerModal').style.display = 'none';
            if (!skipStop && html5QrCode) {
                html5QrCode.stop().catch(err => console.log(err));
            }
        }

        function verifyScan(scannedId) {
            const targetSchool = schoolsData.find(s => s.id === scannedId);
            if (!targetSchool) {
                showMessage("條碼無效", "此 QR Code 無效，請確認掃描的是攤位上的官方條碼！");
                return;
            }

            const requirement = stamps[currentTargetIndex].req;
            if (requirement === "any" || targetSchool[requirement] === true) {
                stamps[currentTargetIndex].collected = true;
                stamps[currentTargetIndex].schoolName = targetSchool.name;
                localStorage.setItem('expoStamps', JSON.stringify(stamps));
                showMessage("收集成功", `成功收集！這所學校是：${targetSchool.name}`);
                renderStamps();
            } else {
                showMessage("條件不符", `【${targetSchool.name}】不符合此章格 (${stamps[currentTargetIndex].title}) 的要求。`);
            }
        }

        function submitForm() {
            const ref = document.getElementById('reflection').value.trim();
            if (!ref) {
                showMessage('資料未填', '請撰寫參觀心得再送出！');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = "資料傳送中...";
            submitBtn.disabled = true;

            const submitUrl = "https://docs.google.com/forms/d/e/1FAIpQLSdH0_BmT51ecteiH59l_zLLZNzwObCKNHLLdaZ2qjTbWMSKnA/formResponse";
            
            const formData = new URLSearchParams();
            formData.append("entry.871765795", studentData.class);
            formData.append("entry.1183621632", studentData.number);
            formData.append("entry.1423815459", studentData.name);
            formData.append("entry.1174958471", stamps[0].schoolName);
            formData.append("entry.1759328801", stamps[1].schoolName);
            formData.append("entry.495542782", stamps[2].schoolName);
            formData.append("entry.351794897", stamps[3].schoolName);
            formData.append("entry.1176353059", stamps[4].schoolName);
            formData.append("entry.704948696", stamps[5].schoolName);
            formData.append("entry.1675069782", stamps[6].schoolName);
            formData.append("entry.1167011241", stamps[7].schoolName);
            formData.append("entry.2145257875", ref);

            fetch(submitUrl, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: formData.toString()
            }).then(() => {
                // 送出成功後，鎖定畫面狀態
                localStorage.setItem('expoSubmitted', 'true');
                showMessage('傳送成功', '心得與集章紀錄已成功送出！感謝您的參與。');
                renderStamps(); // 重新渲染以隱藏送出按鈕
            }).catch(err => {
                console.error(err);
                showMessage('傳送失敗', '請檢查網路連線狀態後重試。');
                submitBtn.innerText = "重新送出資料";
                submitBtn.disabled = false;
            });
        }
    </script>
</body>
</html>
