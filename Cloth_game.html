<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>衣櫃演算法：大師挑戰賽</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .slot { aspect-ratio: 1/1; transition: all 0.2s; -webkit-tap-highlight-color: transparent; }
        .selected { border: 4px solid #f59e0b !important; transform: scale(1.05); z-index: 20; }
        .success-bg { animation: celebrate 0.5s ease-out; }
        @keyframes celebrate { 0% { background: #fff; } 50% { background: #dcfce7; } 100% { background: #fff; } }
        .shake { animation: shake 0.3s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    </style>
</head>
<body class="bg-slate-900 font-sans text-slate-200 antialiased overflow-hidden">

    <div class="h-16 bg-slate-800 px-6 flex justify-between items-center border-b border-slate-700 shadow-xl">
        <div class="flex flex-col">
            <span id="lv-tag" class="text-[10px] uppercase tracking-widest text-indigo-400 font-bold">Challenge 01</span>
            <span id="lv-name" class="text-lg font-black italic">ARRAY SORT</span>
        </div>
        <div class="bg-slate-900 px-4 py-1 rounded-full border border-slate-600">
            <span class="text-xs text-slate-400">STEPS:</span>
            <span id="step-count" class="font-mono text-amber-400 font-bold">0</span>
        </div>
    </div>

    <main class="h-[calc(100vh-140px)] overflow-y-auto p-4 flex flex-col items-center">
        
        <div id="msg-board" class="w-full max-w-md bg-indigo-600 rounded-2xl p-4 mb-6 shadow-2xl relative overflow-hidden">
            <div class="flex items-start gap-3">
                <div class="bg-white/20 p-2 rounded-lg text-xl">💡</div>
                <div>
                    <h3 id="msg-title" class="font-bold text-white">操作提示</h3>
                    <p id="msg-text" class="text-xs text-indigo-100 leading-relaxed mt-1">
                        點擊衣服選取，再點擊空格搬移。目標：將所有衣服按顏色深淺排序。
                    </p>
                </div>
            </div>
            <div id="result-overlay" class="hidden absolute inset-0 bg-emerald-600 flex flex-col items-center justify-center animate-pop">
                <div class="text-3xl font-black mb-1">完成！⭐⭐⭐</div>
                <div class="text-xs opacity-80 mb-4">這就是最高效率的資料結構應用</div>
                <button onclick="nextLevel()" class="bg-white text-emerald-700 px-6 py-2 rounded-full font-bold">前進下一關</button>
            </div>
        </div>

        <div id="stage" class="w-full max-w-md bg-slate-800/50 rounded-3xl border border-slate-700 p-6 min-h-[320px] flex items-center justify-center">
            </div>

    </main>

    <footer class="fixed bottom-0 w-full h-20 bg-slate-800 border-t border-slate-700 p-4 flex justify-around items-center">
        <button onclick="resetCurrentLevel()" class="flex flex-col items-center opacity-60 hover:opacity-100 transition">
            <span class="text-xl">🔄</span>
            <span class="text-[10px] font-bold">RETRY</span>
        </button>
        <div class="h-10 w-px bg-slate-700"></div>
        <div id="hint-area" class="text-center">
            <p class="text-[10px] text-slate-500 font-bold uppercase tracking-tighter">Current Target</p>
            <p id="current-task" class="text-xs font-bold text-amber-500">將「紅衣」移至 Index 0</p>
        </div>
    </footer>

    <script>
        const levels = [
            {
                id: "01", name: "ARRAY SHIFT", 
                type: "array",
                desc: "陣列中的資料是連續的。要空出位子，必須手動移動其他資料。",
                hint: "先將目標位置的衣服移到最後方的空格 (Memory Slot)",
                data: ['shirt_1_yellow.png', 'shirt_1_red.png', 'shirt_1_blue.png', null],
                check: (data) => data[0] === 'shirt_1_red.png'
            },
            {
                id: "02", name: "STACK REVERSE", 
                type: "stack",
                desc: "Stack 是「後進先出」。只能從最頂端操作。",
                hint: "先將頂部的衣服移到另一個暫存棧 (Buffer Stack)",
                data: { s1: ['pants_blue.png', 'shirt_2_green.png'], s2: [] },
                check: (data) => data.s2.length === 2 && data.s2[1] === 'pants_blue.png'
            }
        ];

        let currentLvIdx = 0;
        let steps = 0;
        let selectedItem = null;

        function render() {
            const lv = levels[currentLvIdx];
            document.getElementById('lv-tag').innerText = `Challenge ${lv.id}`;
            document.getElementById('lv-name').innerText = lv.name;
            document.getElementById('msg-text').innerText = lv.desc;
            document.getElementById('current-task').innerText = lv.hint;
            document.getElementById('step-count').innerText = steps;

            const stage = document.getElementById('stage');
            stage.innerHTML = '';

            if(lv.type === 'array') {
                const grid = document.createElement('div');
                grid.className = "grid grid-cols-2 gap-4 w-full";
                lv.data.forEach((img, i) => {
                    const slot = document.createElement('div');
                    slot.className = `slot rounded-2xl bg-slate-900 border-2 ${selectedItem === i ? 'selected border-amber-500' : 'border-slate-700'}`;
                    slot.innerHTML = `<span class="absolute top-1 left-2 text-[8px] text-slate-600 font-mono">ADR_${i}</span>`;
                    if(img) {
                        const c = document.createElement('img');
                        c.src = `cloth/${img}`;
                        c.className = "w-20 h-20 relative z-10 p-2";
                        slot.appendChild(c);
                    }
                    slot.onclick = () => handleArrayClick(i);
                    grid.appendChild(slot);
                });
                stage.appendChild(grid);
            }

            if(lv.type === 'stack') {
                const flex = document.createElement('div');
                flex.className = "flex gap-10 h-full items-end";
                ['s1', 's2'].forEach(key => {
                    const container = document.createElement('div');
                    container.className = `w-24 min-h-[200px] border-x-2 border-b-2 rounded-b-xl flex flex-col-reverse items-center p-2 gap-1 ${selectedItem === key ? 'border-amber-500 bg-amber-500/10' : 'border-slate-600 bg-slate-900'}`;
                    lv.data[key].forEach((img, i) => {
                        const c = document.createElement('img');
                        c.src = `cloth/${img}`;
                        c.className = `w-16 h-16 ${i === lv.data[key].length - 1 ? '' : 'opacity-30'}`;
                        container.appendChild(c);
                    });
                    container.onclick = () => handleStackClick(key);
                    flex.appendChild(container);
                });
                stage.appendChild(flex);
            }
        }

        function handleArrayClick(i) {
            const lv = levels[currentLvIdx];
            if(selectedItem === null) {
                if(lv.data[i]) selectedItem = i;
            } else {
                if(lv.data[i] === null) {
                    lv.data[i] = lv.data[selectedItem];
                    lv.data[selectedItem] = null;
                    steps++;
                    selectedItem = null;
                    if(lv.check(lv.data)) showResult();
                } else {
                    selectedItem = i; // Switch selection
                }
            }
            render();
        }

        function handleStackClick(key) {
            const lv = levels[currentLvIdx];
            if(selectedItem === null) {
                if(lv.data[key].length > 0) selectedItem = key;
            } else {
                if(selectedItem !== key) {
                    const item = lv.data[selectedItem].pop();
                    lv.data[key].push(item);
                    steps++;
                    selectedItem = null;
                    if(lv.check(lv.data)) showResult();
                } else {
                    selectedItem = null;
                }
            }
            render();
        }

        function showResult() {
            const overlay = document.getElementById('result-overlay');
            overlay.classList.remove('hidden');
            // 根據步數評分邏輯可在此增加
        }

        function nextLevel() {
            currentLvIdx++;
            steps = 0;
            document.getElementById('result-overlay').classList.add('hidden');
            if(currentLvIdx < levels.length) render();
            else alert("全部挑戰達成！您已掌握資料結構核心。");
        }

        function resetCurrentLevel() {
            location.reload(); // 簡單起見直接重整，也可寫重置邏輯
        }

        window.onload = render;
    </script>
</body>
</html>
