<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灰階圖片直方圖分析工具</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .upload-section {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        input[type="file"] {
            display: none;
        }

        .custom-file-upload {
            border: 2px dashed #3498db;
            color: #3498db;
            background-color: #fff;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .custom-file-upload:hover {
            background-color: #3498db;
            color: #fff;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            width: 100%;
            max-width: 900px;
            justify-content: center;
        }

        .card {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card h2 {
            font-size: 1.2rem;
            color: #475569;
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 5px;
            width: 100%;
            text-align: center;
        }

        #imagePreview {
            max-width: 100%;
            max-height: 400px;
            object-fit: contain;
            display: none;
            border-radius: 4px;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 300px;
        }

        /* 隱藏用來處理像素的 canvas */
        #hiddenCanvas {
            display: none;
        }
    </style>
</head>
<body>

    <h1>灰階圖片直方圖分析</h1>

    <div class="upload-section">
        <label class="custom-file-upload">
            <input type="file" id="imageInput" accept="image/*">
            選擇或拖曳圖片至此
        </label>
    </div>

    <div class="container">
        <div class="card">
            <h2>圖片預覽 (灰階化)</h2>
            <img id="imagePreview" alt="圖片預覽">
        </div>

        <div class="card">
            <h2>灰階值直方圖 (0 - 255)</h2>
            <div class="canvas-container">
                <canvas id="histogramChart"></canvas>
            </div>
        </div>
    </div>

    <canvas id="hiddenCanvas"></canvas>

    <script>
        const imageInput = document.getElementById('imageInput');
        const imagePreview = document.getElementById('imagePreview');
        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const ctx = hiddenCanvas.getContext('2d');
        let histogramChart = null;

        // 初始化 Chart.js 直方圖
        function initChart(data = Array(256).fill(0)) {
            const chartCtx = document.getElementById('histogramChart').getContext('2d');
            
            // 如果已有圖表則先銷毀，避免重疊
            if (histogramChart) {
                histogramChart.destroy();
            }

            // 產生 0 ~ 255 的 X 軸標籤
            const labels = Array.from({length: 256}, (_, i) => i);

            histogramChart = new Chart(chartCtx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '像素數量',
                        data: data,
                        backgroundColor: 'rgba(100, 116, 139, 0.7)', // 灰藍色
                        borderColor: 'rgba(100, 116, 139, 1)',
                        borderWidth: 1,
                        barPercentage: 1.0,  // 讓長條圖之間沒有空隙，看起來更像直方圖
                        categoryPercentage: 1.0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            grid: { display: false },
                            title: { display: true, text: '灰階值 (0:黑 ~ 255:白)', font: { size: 12 } }
                        },
                        y: {
                            beginAtZero: true,
                            title: { display: true, text: '像素出現次數', font: { size: 12 } }
                        }
                    },
                    plugins: {
                        legend: { display: false } // 隱藏圖例
                    }
                }
            });
        }

        // 監聽圖片上傳
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    // 1. 設定隱藏 canvas 的大小與圖片相同
                    hiddenCanvas.width = img.width;
                    hiddenCanvas.height = img.height;
                    
                    // 2. 將圖片繪製到隱藏 canvas 上
                    ctx.drawImage(img, 0, 0);
                    
                    // 3. 取得圖片的像素資料 (RGBA)
                    const imgData = ctx.getImageData(0, 0, img.width, img.height);
                    const data = imgData.data;
                    
                    // 4. 初始化一個長度 256、值全部為 0 的陣列來統計灰階值
                    const grayscaleCounts = Array(256).fill(0);

                    // 5. 遍歷所有像素（每 4 個元素代表一個像素的 R, G, B, A）
                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i];
                        const g = data[i+1];
                        const b = data[i+2];
                        
                        // 使用心理學公式（ITU-R BT.601）計算人類視覺的灰階值
                        const gray = Math.round(0.299 * r + 0.587 * g + 0.114 * b);
                        
                        // 統計該灰階值出現的次數
                        grayscaleCounts[gray]++;

                        // 同步把隱藏 canvas 上的圖片變成真正的灰階（以便後面顯示）
                        data[i] = gray;     // R
                        data[i+1] = gray;   // G
                        data[i+2] = gray;   // B
                    }

                    // 6. 把處理好的灰階像素放回隱藏 canvas
                    ctx.putImageData(imgData, 0, 0);

                    // 7. 將灰階化後的圖片轉成 Base64 顯示在預覽區域
                    imagePreview.src = hiddenCanvas.toDataURL();
                    imagePreview.style.display = 'block';

                    // 8. 更新直方圖
                    initChart(grayscaleCounts);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // 網頁載入時先初始化一個空的圖表
        window.onload = () => initChart();
    </script>
</body>
</html>
